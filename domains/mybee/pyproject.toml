[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nex-mybee-ax"
version = "0.1.0"
description = "MyBee office-work domain policy and NeX canonical API consumers"
requires-python = ">=3.12"
license = {text = "Proprietary"}

[tool.setuptools.packages.find]
where = ["."]
include = ["mybee_ax*"]
