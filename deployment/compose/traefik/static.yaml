api:
  dashboard: false

entryPoints:
  web:
    address: ":8080"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":8443"
  health:
    address: ":8082"

ping:
  entryPoint: health

providers:
  file:
    filename: /etc/traefik/dynamic.yaml
    watch: true

log:
  level: INFO
  format: json

accessLog:
  format: json
