components:
  parameters:
    serviceId:
      name: service_id
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ServiceId"
    since:
      name: since
      in: query
      required: false
      schema:
        type: string
        format: date-time
    until:
      name: until
      in: query
      required: false
      schema:
        type: string
        format: date-time
    sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - desc
          - asc
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        pattern: "^[0-9]+$"
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
  schemas:
    ServiceId:
      type: string
      enum:
        - nex-oa
        - nex-ag
        - nex-ae-api
        - nex-cx
        - nex-mo
    TraceId:
      type: string
      pattern: "^[0-9a-f]{32}$"
    OperationalEventSeverity:
      type: string
      enum:
        - DEBUG
        - INFO
        - WARNING
        - ERROR
        - CRITICAL
    ServiceLogSeverity:
      type: string
      enum:
        - DEBUG
        - INFO
        - WARNING
        - ERROR
        - CRITICAL
    AgOperatorType:
      type: string
      enum:
        - service
        - user
    AgOperatorReviewNoteStatus:
      type: string
      enum:
        - ACTIVE
        - SUPERSEDED
        - RESOLVED
        - DELETED
    AgOperatorEvidenceExportStatus:
      type: string
      enum:
        - REQUESTED
        - READY
        - FAILED
        - CANCELLED
    AgGenerationQualityIssueDetailProjection:
      type: object
      additionalProperties: true
      required:
        - projection_schema_version
        - projection_status
        - checked_at
        - cx_generation_id
        - source_projection
        - quality
        - attention_required
        - severity
        - runbook
        - debug_paths
        - redaction_summary
      properties:
        projection_schema_version:
          type: string
          const: ag_generation_quality_issue_detail_projection.v1
        projection_status:
          type: string
          enum:
            - READY
            - DEGRADED
        checked_at:
          type: string
          format: date-time
        cx_generation_id:
          type: string
          minLength: 1
        trace_id:
          type:
            - string
            - "null"
          pattern: "^[0-9a-f]{32}$"
        request_id:
          type:
            - string
            - "null"
          minLength: 1
        source_projection:
          type: object
          additionalProperties: true
        quality:
          type:
            - object
            - "null"
          additionalProperties: true
        attention_required:
          type: boolean
        severity:
          type: string
          enum:
            - INFO
            - WARNING
            - ERROR
        runbook:
          type: object
          additionalProperties: true
        debug_paths:
          type: object
          additionalProperties: true
        redaction_summary:
          type: object
          additionalProperties: true
    AgGenerationQualityOperatorDispositionRequest:
      type: object
      additionalProperties: true
      required:
        - operator_ref
        - operator_action
      properties:
        disposition_id:
          type: string
          minLength: 1
        operator_ref:
          type: object
          additionalProperties: false
          required:
            - operator_type
            - operator_id
          properties:
            operator_type:
              type: string
              enum:
                - service
                - user
            operator_id:
              type: string
              minLength: 1
            tenant_id:
              type: string
              minLength: 1
        operator_action:
          type: string
          enum:
            - acknowledged
            - false_positive
            - needs_cx_repair
            - needs_ae_followup
            - escalated
            - resolved
        reason_codes:
          type: array
          items:
            type: string
            enum:
              - metadata_gap
              - citation_quality
              - retrieval_quality
              - generation_quality
              - user_feedback
              - duplicate
              - not_reproducible
              - other
        operator_note:
          type: string
          maxLength: 4096
        quality_issue_refs:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - source_service
              - issue_type
              - issue_code
            properties:
              source_service:
                type: string
                enum:
                  - nex-ae-api
                  - nex-cx
                  - nex-ag
              issue_type:
                type: string
                enum:
                  - retrieval_quality
                  - generation_quality
                  - citation_quality
                  - artifact_quality
                  - user_feedback
                  - operator_review
              issue_code:
                type: string
                minLength: 1
              issue_ref_id:
                type: string
                minLength: 1
    AgGenerationQualityOperatorDisposition:
      type: object
      additionalProperties: false
      required:
        - disposition_schema_version
        - disposition_id
        - cx_generation_id
        - trace_id
        - request_id
        - operator_ref
        - operator_action
        - disposition_status
        - reason_codes
        - operator_note_hash
        - operator_note_preview
        - quality_issue_refs
        - metadata
        - created_at
        - updated_at
      properties:
        disposition_schema_version:
          type: string
          const: ag_generation_quality_operator_disposition.v1
        disposition_id:
          type: string
          minLength: 1
        cx_generation_id:
          type: string
          minLength: 1
        trace_id:
          $ref: "#/components/schemas/TraceId"
        request_id:
          type: string
          minLength: 1
        operator_ref:
          type: object
          additionalProperties: false
          required:
            - operator_type
            - operator_id
            - tenant_id
          properties:
            operator_type:
              type: string
              enum:
                - service
                - user
            operator_id:
              type: string
              minLength: 1
            tenant_id:
              type:
                - string
                - "null"
              minLength: 1
        operator_action:
          type: string
          enum:
            - acknowledged
            - false_positive
            - needs_cx_repair
            - needs_ae_followup
            - escalated
            - resolved
        disposition_status:
          type: string
          enum:
            - ACKNOWLEDGED
            - DISMISSED
            - IN_REPAIR
            - ESCALATED
            - RESOLVED
        reason_codes:
          type: array
          uniqueItems: true
          items:
            type: string
        operator_note_hash:
          type:
            - string
            - "null"
          pattern: "^[0-9a-f]{64}$"
        operator_note_preview:
          type:
            - string
            - "null"
          maxLength: 240
        quality_issue_refs:
          type: array
          items:
            type: object
            additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
          required:
            - raw_note_stored
            - raw_prompt_stored
            - raw_generation_output_stored
            - operator_note_storage
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AgGenerationQualityOperatorDispositionList:
      type: object
      additionalProperties: false
      required:
        - disposition_list_schema_version
        - cx_generation_id
        - trace_id
        - request_id
        - items
        - summary
      properties:
        disposition_list_schema_version:
