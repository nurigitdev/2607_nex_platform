  /admin/v1/operations/jobs/{service_id}/{job_id}:
    get:
      operationId: getAgJobOperationDetailProjection
      tags:
        - Operations
      parameters:
        - name: service_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ServiceId"
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
