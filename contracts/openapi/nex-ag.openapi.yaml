openapi: 3.1.0
info:
  title: NeX AG API
  version: 0.0.0-slice0003
tags:
  - name: Platform
  - name: Readiness
  - name: GenerationAudit
  - name: Operations
paths:
  /health:
    get:
      operationId: getAgHealth
      tags:
        - Platform
      responses:
        "200":
          description: Service health status.
  /ready:
    get:
      operationId: getAgReadiness
      tags:
        - Platform
      responses:
        "200":
          description: Service dependencies are ready.
        "503":
          description: One or more service dependencies are unavailable.
  /version:
    get:
      operationId: getAgVersion
      tags:
        - Platform
      responses:
        "200":
          description: Service version metadata.
  /internal/v1/auth/service-claim:
    get:
      operationId: validateAgServiceClaim
      tags:
        - Platform
      responses:
        "200":
          description: Service claim is valid for this service.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/readiness/services:
    get:
      operationId: getAgReadinessProjection
      tags:
        - Readiness
      responses:
        "200":
          description: Read-only service readiness projection.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/generation-audit/generations/{cx_generation_id}:
    get:
      operationId: getAgGenerationAuditProjection
      tags:
        - GenerationAudit
      parameters:
        - name: cx_generation_id
          in: path
          required: true
          schema:
            type: string
        - name: artifact_handoff_id
          in: query
          required: false
          schema:
            type: string
        - name: recovery_request_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Read-only redacted generation audit projection assembled through CX and AE service APIs, optionally including artifact handoff and recovery request summaries.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Source generation, artifact handoff, or recovery request was not found.
        "503":
          description: Source service is unavailable.
  /admin/v1/operations:
    get:
      operationId: getAgUnifiedOperationsProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - name: job_status
          in: query
          required: false
          schema:
            type: string
            enum:
              - QUEUED
              - RUNNING
              - SUCCEEDED
              - FAILED
              - CANCELLED
        - name: job_type
          in: query
          required: false
          schema:
            type: string
        - name: event_severity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OperationalEventSeverity"
        - name: event_type
          in: query
          required: false
          schema:
            type: string
        - name: trace_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TraceId"
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Combined read-only jobs and operational events projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid operations query or filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/rollups:
    get:
      operationId: getAgOperationsRollupMetricsProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
      responses:
        "200":
          description: Read-only operations rollup metrics projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid rollup query or filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/dashboard:
    get:
      operationId: getAgOperationsDashboardSnapshotProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
        - name: recent_limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        "200":
          description: Read-only operations dashboard snapshot projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid dashboard query or filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/issue-candidates:
    get:
      operationId: getAgOperationsIssueCandidateProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
        - name: recent_limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        "200":
          description: Read-only operations issue candidate projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid issue candidate query or filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/workers:
    get:
      operationId: getAgWorkerRuntimeProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - name: worker_type
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - STARTING
              - IDLE
              - BUSY
              - STOPPING
              - STOPPED
              - ERROR
        - name: stale_after_seconds
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 60
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Read-only worker heartbeat runtime projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid worker runtime query or filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/workers/{service_id}/{worker_id}:
    get:
      operationId: getAgWorkerDetailProjection
      tags:
        - Operations
      parameters:
        - name: service_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ServiceId"
        - name: worker_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: stale_after_seconds
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 60
        - name: event_limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: Read-only worker detail projection with active job and lifecycle event correlation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid worker detail query or filter.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Worker was not found.
  /admin/v1/operations/sources:
    get:
      operationId: getAgOperationSourceReadinessProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
      responses:
        "200":
          description: Read-only operations source readiness projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid service filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/event-taxonomy:
    get:
      operationId: getAgOperationalEventTaxonomyProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - name: event_type
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Read-only operational event taxonomy projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid service filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/events:
    get:
      operationId: getAgOperationalEventProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - name: severity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OperationalEventSeverity"
        - name: event_type
          in: query
          required: false
          schema:
            type: string
        - name: trace_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TraceId"
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Read-only operational event projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid operational event query or filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/events/{event_id}:
    get:
      operationId: getAgOperationalEventDetailProjection
      tags:
        - Operations
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Read-only operational event detail projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Operational event was not found.
  /admin/v1/operations/jobs:
    get:
      operationId: getAgJobOperationsProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - QUEUED
              - RUNNING
              - SUCCEEDED
              - FAILED
              - CANCELLED
        - name: job_type
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Read-only job operations projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid job query or filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/jobs/{service_id}/{job_id}:
    get:
      operationId: getAgJobOperationDetailProjection
      tags:
        - Operations
      parameters:
        - name: service_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ServiceId"
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Read-only job detail and lifecycle timeline projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid service id.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Job source or job was not found.
        "503":
          description: Job source is unavailable.
  /admin/v1/operations/jobs/{service_id}/{job_id}/cancel:
    post:
      operationId: cancelAgOperationalJob
      tags:
        - Operations
      parameters:
        - name: service_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ServiceId"
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgJobControlRequest"
      responses:
        "200":
          description: AG dispatched a cancel request to the target service-local job control API and recorded audit summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgJobControlDispatch"
        "400":
          description: Invalid target service.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Target service job control endpoint or job was not found.
        "409":
          description: Target service rejected the cancel transition.
        "422":
          description: Job control payload is invalid.
        "503":
          description: Target service job control endpoint is unavailable.
  /admin/v1/operations/jobs/{service_id}/{job_id}/retry:
    post:
      operationId: retryAgOperationalJob
      tags:
        - Operations
      parameters:
        - name: service_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ServiceId"
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgJobControlRequest"
      responses:
        "200":
          description: AG dispatched a retry request to the target service-local job control API and recorded audit summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgJobControlDispatch"
        "400":
          description: Invalid target service.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Target service job control endpoint or job was not found.
        "409":
          description: Target service rejected the retry request.
        "422":
          description: Job control payload is invalid.
        "503":
          description: Target service job control endpoint is unavailable.
  /admin/v1/operations/traces/{trace_id}:
    get:
      operationId: getAgCrossServiceTraceTimelineProjection
      tags:
        - Operations
      parameters:
        - name: trace_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TraceId"
        - $ref: "#/components/parameters/serviceId"
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Read-only cross-service trace timeline projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid trace timeline query or filter.
        "401":
          description: Service claim is missing or invalid.
components:
  parameters:
    serviceId:
      name: service_id
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ServiceId"
    since:
      name: since
      in: query
      required: false
      schema:
        type: string
        format: date-time
    until:
      name: until
      in: query
      required: false
      schema:
        type: string
        format: date-time
    sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - desc
          - asc
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        pattern: "^[0-9]+$"
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
  schemas:
    ServiceId:
      type: string
      enum:
        - nex-oa
        - nex-ag
        - nex-ae-api
        - nex-cx
        - nex-mo
    TraceId:
      type: string
      pattern: "^[0-9a-f]{32}$"
    OperationalEventSeverity:
      type: string
      enum:
        - DEBUG
        - INFO
        - WARNING
        - ERROR
        - CRITICAL
    AgOperationsProjection:
      type: object
      required:
        - projection_schema_version
        - checked_at
      properties:
        projection_schema_version:
          type: string
          enum:
            - ag_operation_source_readiness_projection.v1
            - ag_operational_event_projection.v1
            - ag_operational_event_detail_projection.v1
            - ag_operational_event_taxonomy_projection.v1
            - ag_job_operations_projection.v1
            - ag_job_operation_detail_projection.v1
            - ag_unified_operations_projection.v1
            - ag_operations_rollup_metrics_projection.v1
            - ag_operations_dashboard_snapshot_projection.v1
            - ag_operations_issue_candidate_projection.v1
            - ag_worker_runtime_projection.v1
            - ag_worker_detail_projection.v1
            - ag_cross_service_trace_timeline_projection.v1
            - ag_job_control_dispatch.v1
        checked_at:
          type: string
          format: date-time
      additionalProperties: true
    AgJobControlRequest:
      type: object
      additionalProperties: false
      properties:
        observed_at:
          type: string
          format: date-time
        error_code:
          type: string
          minLength: 1
        detail:
          type: string
          minLength: 1
    AgJobControlDispatch:
      type: object
      additionalProperties: true
      required:
        - projection_schema_version
        - dispatch_status
        - checked_at
        - service_id
        - job_id
        - action
        - service_response
        - audit_event
        - summary
      properties:
        projection_schema_version:
          type: string
          const: ag_job_control_dispatch.v1
        dispatch_status:
          type: string
          const: SUCCEEDED
        checked_at:
          type: string
          format: date-time
        request_trace_id:
          $ref: "#/components/schemas/TraceId"
        service_id:
          $ref: "#/components/schemas/ServiceId"
        job_id:
          type: string
          minLength: 1
        action:
          type: string
          enum:
            - cancel
            - retry
        service_response:
          $ref: "#/components/schemas/ServiceJobControlResponse"
        audit_event:
          $ref: "#/components/schemas/AuditEventSummary"
        summary:
          type: object
          additionalProperties: true
          required:
            - service_id
            - job_id
            - action
            - job_status
            - allowed_actions
          properties:
            service_id:
              $ref: "#/components/schemas/ServiceId"
            job_id:
              type: string
            action:
              type: string
            job_status:
              $ref: "#/components/schemas/JobStatus"
            allowed_actions:
              type: array
              items:
                type: string
    ServiceJobControlResponse:
      type: object
      additionalProperties: true
      required:
        - job_control_schema_version
        - service_id
        - action
        - job
        - controls
      properties:
        job_control_schema_version:
          type: string
          const: service_job_control.v1
        service_id:
          $ref: "#/components/schemas/ServiceId"
        action:
          type: string
          enum:
            - read
            - cancel
            - retry
        job:
          $ref: "#/components/schemas/ServiceJobControlJob"
        controls:
          $ref: "#/components/schemas/ServiceJobControls"
    ServiceJobControlJob:
      type: object
      additionalProperties: true
      required:
        - service_id
        - job_schema_version
        - job_id
        - job_type
        - status
        - trace_id
        - request_id
        - subject_ref
        - attempt_count
        - max_attempts
        - retryable
        - links
        - created_at
        - updated_at
      properties:
        service_id:
          $ref: "#/components/schemas/ServiceId"
        job_schema_version:
          type: string
          const: common_job.v1
        job_id:
          type: string
          minLength: 1
        job_type:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/JobStatus"
        trace_id:
          $ref: "#/components/schemas/TraceId"
        request_id:
          type: string
          minLength: 1
        subject_ref:
          type: object
          additionalProperties: false
          required:
            - type
            - id
          properties:
            type:
              type: string
              minLength: 1
            id:
              type: string
              minLength: 1
        attempt_count:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
        retryable:
          type: boolean
        links:
          type: object
          additionalProperties:
            type: string
        error:
          type:
            - object
            - "null"
          additionalProperties: true
        available_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ServiceJobControls:
      type: object
      additionalProperties: false
      required:
        - can_cancel
        - can_retry
        - terminal
        - dead_lettered
        - allowed_actions
      properties:
        can_cancel:
          type: boolean
        can_retry:
          type: boolean
        terminal:
          type: boolean
        dead_lettered:
          type: boolean
        allowed_actions:
          type: array
          items:
            type: string
            enum:
              - read
              - cancel
              - retry
    AuditEventSummary:
      type: object
      additionalProperties: true
      required:
        - ok
      properties:
        ok:
          type: boolean
        event_id:
          type: string
        event_type:
          type: string
        error_code:
          type: string
    JobStatus:
      type: string
      enum:
        - QUEUED
        - RUNNING
        - SUCCEEDED
        - FAILED
        - CANCELLED
