openapi: 3.1.0
info:
  title: NeX AG API
  version: 0.0.0-slice0003
tags:
  - name: Platform
  - name: Readiness
  - name: GenerationAudit
  - name: Operations
paths:
  /health:
    get:
      operationId: getAgHealth
      tags:
        - Platform
      responses:
        "200":
          description: Service health status.
  /ready:
    get:
      operationId: getAgReadiness
      tags:
        - Platform
      responses:
        "200":
          description: Service dependencies are ready.
        "503":
          description: One or more service dependencies are unavailable.
  /version:
    get:
      operationId: getAgVersion
      tags:
        - Platform
      responses:
        "200":
          description: Service version metadata.
  /internal/v1/auth/service-claim:
    get:
      operationId: validateAgServiceClaim
      tags:
        - Platform
      responses:
        "200":
          description: Service claim is valid for this service.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/readiness/services:
    get:
      operationId: getAgReadinessProjection
      tags:
        - Readiness
      responses:
        "200":
          description: Read-only service readiness projection.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/generation-audit/generations/{cx_generation_id}:
    get:
      operationId: getAgGenerationAuditProjection
      tags:
        - GenerationAudit
      parameters:
        - name: cx_generation_id
          in: path
          required: true
          schema:
            type: string
        - name: artifact_handoff_id
          in: query
          required: false
          schema:
            type: string
        - name: recovery_request_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Read-only redacted generation audit projection assembled through CX and AE service APIs, optionally including artifact handoff and recovery request summaries.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Source generation, artifact handoff, or recovery request was not found.
        "503":
          description: Source service is unavailable.
  /admin/v1/generation-audit/generations/{cx_generation_id}/quality-issue-detail:
    get:
      operationId: getAgGenerationQualityIssueDetailProjection
      tags:
        - GenerationAudit
      parameters:
        - name: cx_generation_id
          in: path
          required: true
          schema:
            type: string
        - name: artifact_handoff_id
          in: query
          required: false
          schema:
            type: string
        - name: recovery_request_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Read-only redacted generation quality issue detail and operator runbook projection assembled from the AG generation audit projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgGenerationQualityIssueDetailProjection"
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Source generation, artifact handoff, or recovery request was not found.
        "503":
          description: Source service is unavailable.
  /admin/v1/generation-audit/generations/{cx_generation_id}/quality-dispositions:
    post:
      operationId: createAgGenerationQualityOperatorDisposition
      tags:
        - GenerationAudit
      parameters:
        - name: cx_generation_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgGenerationQualityOperatorDispositionRequest"
      responses:
        "202":
          description: AG accepted and recorded an operator disposition for the generation quality issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgGenerationQualityOperatorDisposition"
        "401":
          description: Service claim is missing or invalid.
        "422":
          description: Operator disposition payload is invalid or contains unsafe raw fields.
    get:
      operationId: listAgGenerationQualityOperatorDispositions
      tags:
        - GenerationAudit
      parameters:
        - name: cx_generation_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Read-only operator dispositions for a CX generation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgGenerationQualityOperatorDispositionList"
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/generation-audit/generations/{cx_generation_id}/quality-dispositions/{disposition_id}:
    get:
      operationId: getAgGenerationQualityOperatorDisposition
      tags:
        - GenerationAudit
      parameters:
        - name: cx_generation_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: disposition_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Read-only operator disposition record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgGenerationQualityOperatorDisposition"
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Operator disposition was not found for this generation.
  /admin/v1/generation-audit/generations/{cx_generation_id}/remediation-tasks:
    post:
      operationId: createAgGenerationRemediationTask
      tags:
        - GenerationAudit
      parameters:
        - name: cx_generation_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgGenerationRemediationTaskRequest"
      responses:
        "202":
          description: AG accepted and recorded a generation remediation task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgGenerationRemediationAction"
        "401":
          description: Service claim is missing or invalid.
        "422":
          description: Remediation task payload is invalid or contains unsafe raw fields.
    get:
      operationId: listAgGenerationRemediationTasks
      tags:
        - GenerationAudit
      parameters:
        - name: cx_generation_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Read-only generation remediation tasks for a CX generation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgGenerationRemediationActionList"
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/generation-audit/generations/{cx_generation_id}/remediation-tasks/{remediation_action_id}:
    get:
      operationId: getAgGenerationRemediationTask
      tags:
        - GenerationAudit
      parameters:
        - name: cx_generation_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: remediation_action_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Read-only generation remediation task detail and operator runbook projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgGenerationRemediationTaskDetail"
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Remediation task was not found for this generation.
    patch:
      operationId: updateAgGenerationRemediationTaskStatus
      tags:
        - GenerationAudit
      parameters:
        - name: cx_generation_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: remediation_action_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgGenerationRemediationTaskStatusUpdateRequest"
      responses:
        "200":
          description: Remediation task status was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgGenerationRemediationAction"
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Remediation task was not found for this generation.
        "409":
          description: Requested remediation status transition is not allowed.
        "422":
          description: Status update payload is invalid or contains unsafe raw fields.
  /admin/v1/generation-audit/generations/{cx_generation_id}/remediation-tasks/{remediation_action_id}/execute:
    post:
      operationId: executeAgGenerationRemediationTask
      tags:
        - GenerationAudit
      parameters:
        - name: cx_generation_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: remediation_action_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgGenerationRemediationExecutionDispatchRequest"
      responses:
        "202":
          description: AG dispatched the remediation task to CX execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgGenerationRemediationExecutionDispatch"
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Remediation task was not found for this generation.
        "409":
          description: Remediation task cannot be dispatched from its current state.
        "422":
          description: Dispatch request is invalid or remediation action is not executable by CX.
        "503":
          description: CX remediation execution endpoint or AG task store is unavailable.
  /admin/v1/generation-audit/generations/{cx_generation_id}/remediation-tasks/{remediation_action_id}/sync-execution-status:
    post:
      operationId: syncAgGenerationRemediationExecutionStatus
      tags:
        - GenerationAudit
      parameters:
        - name: cx_generation_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: remediation_action_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgGenerationRemediationExecutionStatusSyncRequest"
      responses:
        "200":
          description: AG synchronized the remediation task status from CX execution detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgGenerationRemediationExecutionStatusSync"
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Remediation task was not found for this generation.
        "409":
          description: Remediation task cannot be synchronized from the observed CX status.
        "422":
          description: CX execution detail is invalid or cannot be reconciled.
        "503":
          description: CX remediation execution endpoint or AG task store is unavailable.
  /admin/v1/operations:
    get:
      operationId: getAgUnifiedOperationsProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - name: job_status
          in: query
          required: false
          schema:
            type: string
            enum:
              - QUEUED
              - RUNNING
              - SUCCEEDED
              - FAILED
              - CANCELLED
        - name: job_type
          in: query
          required: false
          schema:
            type: string
        - name: event_severity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OperationalEventSeverity"
        - name: event_type
          in: query
          required: false
          schema:
            type: string
        - name: trace_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TraceId"
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Combined read-only jobs and operational events projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid operations query or filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/rollups:
    get:
      operationId: getAgOperationsRollupMetricsProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
      responses:
        "200":
          description: Read-only operations rollup metrics projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid rollup query or filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/dashboard:
    get:
      operationId: getAgOperationsDashboardSnapshotProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
        - name: recent_limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        "200":
          description: Read-only operations dashboard snapshot projection, including CX processing run status summary when configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid dashboard query or filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/issue-candidates:
    get:
      operationId: getAgOperationsIssueCandidateProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
        - name: recent_limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        "200":
          description: Read-only operations issue candidate projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid issue candidate query or filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operator-review/workbench:
    get:
      operationId: getAgOperatorReviewWorkbench
      tags:
        - Operations
      parameters:
        - name: target_service
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ServiceId"
        - name: target_kind
          in: query
          required: false
          schema:
            type: string
        - name: target_id
          in: query
          required: false
          schema:
            type: string
        - name: trace_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TraceId"
        - name: operator_type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgOperatorType"
        - name: operator_id
          in: query
          required: false
          schema:
            type: string
        - name: note_status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgOperatorReviewNoteStatus"
        - name: export_status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgOperatorEvidenceExportStatus"
        - name: updated_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: updated_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Read-only AG operator review workbench grouped by target reference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperatorReviewWorkbench"
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: User claim is not authorized for AG operator review.
        "422":
          description: Workbench filter is invalid.
        "503":
          description: Operator review note or evidence export store is unavailable.
  /admin/v1/operator-review/workbench/rollups:
    get:
      operationId: getAgOperatorReviewWorkbenchRollups
      tags:
        - Operations
      parameters:
        - name: target_service
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ServiceId"
        - name: target_kind
          in: query
          required: false
          schema:
            type: string
        - name: target_id
          in: query
          required: false
          schema:
            type: string
        - name: trace_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TraceId"
        - name: operator_type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgOperatorType"
        - name: operator_id
          in: query
          required: false
          schema:
            type: string
        - name: note_status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgOperatorReviewNoteStatus"
        - name: export_status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgOperatorEvidenceExportStatus"
        - name: updated_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: updated_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Read-only rollup metrics for the AG operator review workbench.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperatorReviewWorkbenchRollup"
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: User claim is not authorized for AG operator review.
        "422":
          description: Workbench filter is invalid.
        "503":
          description: Operator review note or evidence export store is unavailable.
  /admin/v1/operator-review/cases:
    get:
      operationId: listAgOperatorReviewCases
      tags:
        - Operations
      parameters:
        - name: target_service
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ServiceId"
        - name: target_kind
          in: query
          required: false
          schema:
            type: string
        - name: target_id
          in: query
          required: false
          schema:
            type: string
        - name: trace_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TraceId"
        - name: case_status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgOperatorReviewCaseStatus"
        - name: case_priority
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgOperatorReviewCasePriority"
        - name: operator_type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgOperatorType"
        - name: operator_id
          in: query
          required: false
          schema:
            type: string
        - name: assignee_id
          in: query
          required: false
          schema:
            type: string
        - name: updated_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: updated_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Read-only AG operator review case list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperatorReviewCaseSurface"
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: User claim is not authorized for AG operator review.
        "422":
          description: Case filter is invalid.
        "503":
          description: Operator review case store is unavailable.
    post:
      operationId: createAgOperatorReviewCase
      tags:
        - Operations
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgOperatorReviewCaseMutationRequest"
      responses:
        "201":
          description: Operator review case created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperatorReviewCaseSurface"
        "200":
          description: Idempotent replay of a previously created case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperatorReviewCaseSurface"
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: User claim is not authorized for AG operator review.
        "409":
          description: Idempotency key maps to a different case request.
        "422":
          description: Case payload is invalid.
        "503":
          description: Operator review case store or audit emitter is unavailable.
  /admin/v1/operator-review/cases/rollups:
    get:
      operationId: getAgOperatorReviewCaseRollups
      tags:
        - Operations
      parameters:
        - name: target_service
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ServiceId"
        - name: target_kind
          in: query
          required: false
          schema:
            type: string
        - name: target_id
          in: query
          required: false
          schema:
            type: string
        - name: trace_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TraceId"
        - name: case_status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgOperatorReviewCaseStatus"
        - name: case_priority
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgOperatorReviewCasePriority"
        - name: operator_type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgOperatorType"
        - name: operator_id
          in: query
          required: false
          schema:
            type: string
        - name: assignee_id
          in: query
          required: false
          schema:
            type: string
        - name: updated_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: updated_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Read-only AG operator review case/action rollup metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperatorReviewCaseRollup"
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: User claim is not authorized for AG operator review.
        "422":
          description: Case rollup filter is invalid.
        "503":
          description: Operator review case store is unavailable.
  /admin/v1/operator-review/cases/queue:
    get:
      operationId: getAgOperatorReviewCaseQueue
      tags:
        - Operations
      parameters:
        - name: target_service
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ServiceId"
        - name: target_kind
          in: query
          required: false
          schema:
            type: string
        - name: target_id
          in: query
          required: false
          schema:
            type: string
        - name: trace_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TraceId"
        - name: case_status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgOperatorReviewCaseStatus"
        - name: case_priority
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgOperatorReviewCasePriority"
        - name: operator_type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgOperatorType"
        - name: operator_id
          in: query
          required: false
          schema:
            type: string
        - name: assignee_id
          in: query
          required: false
          schema:
            type: string
        - name: latest_action_type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgOperatorReviewCaseActionType"
        - name: attention_status
          in: query
          required: false
          schema:
            type: string
            enum:
              - BLOCKED
              - ATTENTION
              - OPEN
              - OK
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum:
              - attention
              - updated_at
              - priority
              - status
              - case_id
        - name: sort_direction
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: updated_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: updated_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Read-only operator-facing AG review case queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperatorReviewCaseWorkbenchSurface"
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: User claim is not authorized for AG operator review.
        "422":
