          type: array
          items:
            type: string
            enum:
              - read
              - cancel
              - retry
              - replay
    AuditEventSummary:
      type: object
      additionalProperties: true
      required:
        - ok
      properties:
        ok:
          type: boolean
        event_id:
          type: string
        event_type:
          type: string
        error_code:
          type: string
    JobStatus:
      type: string
