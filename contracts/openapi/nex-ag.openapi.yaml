openapi: 3.1.0
info:
  title: NeX AG API
  version: 0.0.0-slice0003
tags:
  - name: Platform
  - name: Readiness
  - name: GenerationAudit
  - name: Operations
paths:
  /health:
    get:
      operationId: getAgHealth
      tags:
        - Platform
      responses:
        "200":
          description: Service health status.
  /ready:
    get:
      operationId: getAgReadiness
      tags:
        - Platform
      responses:
        "200":
          description: Service dependencies are ready.
        "503":
          description: One or more service dependencies are unavailable.
  /version:
    get:
      operationId: getAgVersion
      tags:
        - Platform
      responses:
        "200":
          description: Service version metadata.
  /internal/v1/auth/service-claim:
    get:
      operationId: validateAgServiceClaim
      tags:
        - Platform
      responses:
        "200":
          description: Service claim is valid for this service.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/readiness/services:
    get:
      operationId: getAgReadinessProjection
      tags:
        - Readiness
      responses:
        "200":
          description: Read-only service readiness projection.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/generation-audit/generations/{cx_generation_id}:
    get:
      operationId: getAgGenerationAuditProjection
      tags:
        - GenerationAudit
      parameters:
        - name: cx_generation_id
          in: path
          required: true
          schema:
            type: string
        - name: artifact_handoff_id
          in: query
          required: false
          schema:
            type: string
        - name: recovery_request_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Read-only redacted generation audit projection assembled through CX and AE service APIs, optionally including artifact handoff and recovery request summaries.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Source generation, artifact handoff, or recovery request was not found.
        "503":
          description: Source service is unavailable.
  /admin/v1/generation-audit/generations/{cx_generation_id}/quality-issue-detail:
    get:
      operationId: getAgGenerationQualityIssueDetailProjection
      tags:
        - GenerationAudit
      parameters:
        - name: cx_generation_id
          in: path
          required: true
          schema:
            type: string
        - name: artifact_handoff_id
          in: query
          required: false
          schema:
            type: string
        - name: recovery_request_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Read-only redacted generation quality issue detail and operator runbook projection assembled from the AG generation audit projection.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Source generation, artifact handoff, or recovery request was not found.
        "503":
          description: Source service is unavailable.
  /admin/v1/operations:
    get:
      operationId: getAgUnifiedOperationsProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - name: job_status
          in: query
          required: false
          schema:
            type: string
            enum:
              - QUEUED
              - RUNNING
              - SUCCEEDED
              - FAILED
              - CANCELLED
        - name: job_type
          in: query
          required: false
          schema:
            type: string
        - name: event_severity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OperationalEventSeverity"
        - name: event_type
          in: query
          required: false
          schema:
            type: string
        - name: trace_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TraceId"
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Combined read-only jobs and operational events projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid operations query or filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/rollups:
    get:
      operationId: getAgOperationsRollupMetricsProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
      responses:
        "200":
          description: Read-only operations rollup metrics projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid rollup query or filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/dashboard:
    get:
      operationId: getAgOperationsDashboardSnapshotProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
        - name: recent_limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        "200":
          description: Read-only operations dashboard snapshot projection, including CX processing run status summary when configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid dashboard query or filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/issue-candidates:
    get:
      operationId: getAgOperationsIssueCandidateProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
        - name: recent_limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        "200":
          description: Read-only operations issue candidate projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid issue candidate query or filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/workers:
    get:
      operationId: getAgWorkerRuntimeProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - name: worker_type
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - STARTING
              - IDLE
              - BUSY
              - STOPPING
              - STOPPED
              - ERROR
        - name: stale_after_seconds
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 60
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Read-only worker heartbeat runtime projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid worker runtime query or filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/workers/{service_id}/{worker_id}:
    get:
      operationId: getAgWorkerDetailProjection
      tags:
        - Operations
      parameters:
        - name: service_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ServiceId"
        - name: worker_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: stale_after_seconds
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 60
        - name: event_limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: Read-only worker detail projection with active job and lifecycle event correlation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid worker detail query or filter.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Worker was not found.
  /admin/v1/operations/sources:
    get:
      operationId: getAgOperationSourceReadinessProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
      responses:
        "200":
          description: Read-only operations source readiness projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid service filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/event-taxonomy:
    get:
      operationId: getAgOperationalEventTaxonomyProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - name: event_type
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Read-only operational event taxonomy projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid service filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/events:
    get:
      operationId: getAgOperationalEventProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - name: severity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OperationalEventSeverity"
        - name: event_type
          in: query
          required: false
          schema:
            type: string
        - name: trace_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TraceId"
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Read-only operational event projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid operational event query or filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/events/{event_id}:
    get:
      operationId: getAgOperationalEventDetailProjection
      tags:
        - Operations
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Read-only operational event detail projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Operational event was not found.
  /admin/v1/operations/logs:
    get:
      operationId: getAgServiceLogProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - name: severity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ServiceLogSeverity"
        - name: logger_name
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 160
        - name: trace_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TraceId"
        - name: request_id
          in: query
          required: false
          schema:
            type: string
        - name: job_id
          in: query
          required: false
          schema:
            type: string
        - name: subject_type
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: subject_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Read-only structured service log projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid structured service log query or filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/logs/policy:
    get:
      operationId: getAgServiceLogQueryPolicyProjection
      tags:
        - Operations
      responses:
        "200":
          description: Read-only structured service log query and retention policy projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/logs/retention/dry-run:
    get:
      operationId: getAgServiceLogRetentionDryRunProjection
      tags:
        - Operations
      parameters:
        - name: service_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ServiceId"
        - name: retention_days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Read-only structured service log retention dry-run projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid structured service log retention filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/logs/retention/{service_id}/purge:
    post:
      operationId: purgeAgServiceLogRetention
      tags:
        - Operations
      parameters:
        - name: service_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ServiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgServiceLogRetentionPurgeRequest"
      responses:
        "200":
          description: AG dispatched a guarded service log retention purge request and recorded audit summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgServiceLogRetentionDispatch"
        "400":
          description: Invalid target service.
        "401":
          description: Service claim is missing or invalid.
        "409":
          description: Execute-mode dispatch was blocked before service call.
        "422":
          description: Retention purge payload is invalid.
        "503":
          description: Target service log retention endpoint is unavailable.
  /admin/v1/operations/logs/{log_id}:
    get:
      operationId: getAgServiceLogDetailProjection
      tags:
        - Operations
      parameters:
        - name: log_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Read-only structured service log detail projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Structured service log was not found.
        "503":
          description: Structured service log source is unavailable.
  /admin/v1/operations/jobs:
    get:
      operationId: getAgJobOperationsProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - QUEUED
              - RUNNING
              - SUCCEEDED
              - FAILED
              - CANCELLED
        - name: job_type
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Read-only job operations projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid job query or filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/retrieval-packages:
    get:
      operationId: getAgRetrievalPackageOperationsProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - READY
              - LOW_CONFIDENCE
              - NO_ANSWER
        - name: trace_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TraceId"
        - name: request_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: retrieval_policy_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Read-only CX retrieval package operations projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid retrieval package query or filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/retrieval-packages/{retrieval_package_id}:
    get:
      operationId: getAgRetrievalPackageDetailProjection
      tags:
        - Operations
      parameters:
        - name: retrieval_package_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/serviceId"
      responses:
        "200":
          description: Read-only CX retrieval package detail/debug projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid retrieval package detail filter.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Retrieval package source or package was not found.
        "503":
          description: Retrieval package source is unavailable.
  /admin/v1/operations/retrieval-score-calibration:
    get:
      operationId: getAgRetrievalScoreCalibrationRollupProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - READY
              - LOW_CONFIDENCE
              - NO_ANSWER
        - name: trace_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TraceId"
        - name: request_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: retrieval_policy_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: calibration_action
          in: query
          required: false
          schema:
            type: string
            enum:
              - default_threshold_accepts_score
              - review_low_confidence_boundary
              - inspect_no_answer_retrieval
              - review_live_threshold_before_canonical_policy
              - compare_observed_and_default_confidence
              - calibration_data_incomplete
        - name: default_confidence_bucket
          in: query
          required: false
          schema:
            type: string
            enum:
              - READY
              - LOW_CONFIDENCE
              - NO_ANSWER
              - UNKNOWN
        - name: threshold_override
          in: query
          required: false
          schema:
            type: boolean
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Read-only retrieval score calibration sample rollup projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid retrieval score calibration query or filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/retrieval-threshold-decisions:
    get:
      operationId: getAgRetrievalThresholdDecisionProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - name: retrieval_policy_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Read-only retrieval threshold decision projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid retrieval threshold decision query or filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/cx-processing-runs:
    get:
      operationId: getAgCxProcessingRunOperationsProjection
      tags:
        - Operations
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - name: document_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - QUEUED
              - RUNNING
              - SUCCEEDED
              - FAILED
              - CANCELLED
        - name: trace_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TraceId"
        - name: request_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: job_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: include_steps
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Read-only CX processing run operations projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid CX processing run query or filter.
        "401":
          description: Service claim is missing or invalid.
  /admin/v1/operations/cx-processing-runs/{pipeline_run_id}:
    get:
      operationId: getAgCxProcessingRunDetailProjection
      tags:
        - Operations
      parameters:
        - name: pipeline_run_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/serviceId"
      responses:
        "200":
          description: Read-only CX processing run detail/debug projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid CX processing run detail filter.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: CX processing run source or run was not found.
        "503":
          description: CX processing run source is unavailable.
  /admin/v1/operations/jobs/{service_id}/{job_id}:
    get:
      operationId: getAgJobOperationDetailProjection
      tags:
        - Operations
      parameters:
        - name: service_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ServiceId"
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Read-only job detail and lifecycle timeline projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid service id.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Job source or job was not found.
        "503":
          description: Job source is unavailable.
  /admin/v1/operations/jobs/{service_id}/{job_id}/cancel:
    post:
      operationId: cancelAgOperationalJob
      tags:
        - Operations
      parameters:
        - name: service_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ServiceId"
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgJobControlRequest"
      responses:
        "200":
          description: AG dispatched a cancel request to the target service-local job control API and recorded audit summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgJobControlDispatch"
        "400":
          description: Invalid target service.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Target service job control endpoint or job was not found.
        "409":
          description: Target service rejected the cancel transition.
        "422":
          description: Job control payload is invalid.
        "503":
          description: Target service job control endpoint is unavailable.
  /admin/v1/operations/jobs/{service_id}/{job_id}/retry:
    post:
      operationId: retryAgOperationalJob
      tags:
        - Operations
      parameters:
        - name: service_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ServiceId"
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgJobControlRequest"
      responses:
        "200":
          description: AG dispatched a retry request to the target service-local job control API and recorded audit summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgJobControlDispatch"
        "400":
          description: Invalid target service.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Target service job control endpoint or job was not found.
        "409":
          description: Target service rejected the retry request.
        "422":
          description: Job control payload is invalid.
        "503":
          description: Target service job control endpoint is unavailable.
  /admin/v1/operations/jobs/{service_id}/{job_id}/replay:
    post:
      operationId: replayAgOperationalJob
      tags:
        - Operations
      parameters:
        - name: service_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ServiceId"
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgJobReplayRequest"
      responses:
        "200":
          description: AG dispatched a dead-letter replay request to the target service-local job control API and recorded audit summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgJobControlDispatch"
        "400":
          description: Invalid target service.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Target service job control endpoint or source job was not found.
        "409":
          description: Target service rejected replay because the source job is not replayable.
        "422":
          description: Replay payload is invalid.
        "503":
          description: Target service job control endpoint is unavailable.
  /admin/v1/operations/traces/{trace_id}:
    get:
      operationId: getAgCrossServiceTraceTimelineProjection
      tags:
        - Operations
      parameters:
        - name: trace_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TraceId"
        - $ref: "#/components/parameters/serviceId"
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Read-only cross-service trace timeline projection over jobs, events, logs, and configured CX retrieval packages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid trace timeline query or filter.
        "401":
          description: Service claim is missing or invalid.
components:
  parameters:
    serviceId:
      name: service_id
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ServiceId"
    since:
      name: since
      in: query
      required: false
      schema:
        type: string
        format: date-time
    until:
      name: until
      in: query
      required: false
      schema:
        type: string
        format: date-time
    sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - desc
          - asc
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        pattern: "^[0-9]+$"
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
  schemas:
    ServiceId:
      type: string
      enum:
        - nex-oa
        - nex-ag
        - nex-ae-api
        - nex-cx
        - nex-mo
    TraceId:
      type: string
      pattern: "^[0-9a-f]{32}$"
    OperationalEventSeverity:
      type: string
      enum:
        - DEBUG
        - INFO
        - WARNING
        - ERROR
        - CRITICAL
    ServiceLogSeverity:
      type: string
      enum:
        - DEBUG
        - INFO
        - WARNING
        - ERROR
        - CRITICAL
    AgOperationsProjection:
      type: object
      required:
        - projection_schema_version
        - checked_at
      properties:
        projection_schema_version:
          type: string
          enum:
            - ag_operation_source_readiness_projection.v1
            - ag_operational_event_projection.v1
            - ag_operational_event_detail_projection.v1
            - ag_operational_event_taxonomy_projection.v1
            - ag_service_log_projection.v1
            - ag_service_log_detail_projection.v1
            - ag_service_log_query_policy_projection.v1
            - ag_service_log_retention_dry_run_projection.v1
            - ag_job_operations_projection.v1
            - ag_job_operation_detail_projection.v1
            - ag_retrieval_package_operations_projection.v1
            - ag_retrieval_package_detail_projection.v1
            - ag_retrieval_score_calibration_rollup_projection.v1
            - ag_retrieval_threshold_decision_projection.v1
            - ag_cx_processing_run_operations_projection.v1
            - ag_cx_processing_run_detail_projection.v1
            - ag_unified_operations_projection.v1
            - ag_operations_rollup_metrics_projection.v1
            - ag_operations_dashboard_snapshot_projection.v1
            - ag_operations_issue_candidate_projection.v1
            - ag_worker_runtime_projection.v1
            - ag_worker_detail_projection.v1
            - ag_cross_service_trace_timeline_projection.v1
            - ag_job_control_dispatch.v1
            - ag_service_log_retention_dispatch.v1
        checked_at:
          type: string
          format: date-time
      additionalProperties: true
    AgServiceLogRetentionPurgeRequest:
      type: object
      additionalProperties: false
      required:
        - retention_cutoff
      properties:
        retention_cutoff:
          type: string
          format: date-time
        retention_days:
          type: integer
          minimum: 1
        checked_at:
          type: string
          format: date-time
        dry_run:
          type: boolean
          default: true
        delete_enabled:
          type: boolean
          default: false
        max_delete_count:
          type: integer
          minimum: 1
        requested_by:
          type: object
          additionalProperties: true
        idempotency_key:
          type: string
          minLength: 1
    AgServiceLogRetentionDispatch:
      type: object
      additionalProperties: true
      required:
        - projection_schema_version
        - dispatch_status
        - checked_at
        - service_id
        - service_response
        - audit_event
        - summary
      properties:
        projection_schema_version:
          type: string
          const: ag_service_log_retention_dispatch.v1
        dispatch_status:
          type: string
          const: SUCCEEDED
        checked_at:
          type: string
          format: date-time
        request_trace_id:
          $ref: "#/components/schemas/TraceId"
        service_id:
          $ref: "#/components/schemas/ServiceId"
        service_response:
          $ref: "#/components/schemas/ServiceLogRetentionExecution"
        audit_event:
          $ref: "#/components/schemas/AuditEventSummary"
        summary:
          type: object
          additionalProperties: true
          required:
            - service_id
            - mode
            - execution_status
            - candidate_count
            - deleted_count
            - delete_enabled
            - max_delete_count
          properties:
            service_id:
              $ref: "#/components/schemas/ServiceId"
            mode:
              type: string
              enum:
                - DRY_RUN
                - EXECUTE
            execution_status:
              type: string
              enum:
                - PLANNED
                - SUCCEEDED
                - BLOCKED
                - FAILED
            candidate_count:
              type: integer
              minimum: 0
            deleted_count:
              type: integer
              minimum: 0
            delete_enabled:
              type: boolean
            max_delete_count:
              type: integer
              minimum: 1
    ServiceLogRetentionExecution:
      type: object
      additionalProperties: true
      required:
        - retention_execution_schema_version
        - execution_id
        - policy_id
        - service_id
        - mode
        - execution_status
        - delete_enabled
        - retention_days
        - retention_cutoff
        - checked_at
        - max_delete_count
        - candidate_count
        - deleted_count
      properties:
        retention_execution_schema_version:
          type: string
          const: service_log_retention_execution.v1
        execution_id:
          type: string
          minLength: 1
        policy_id:
          type: string
          const: service-log-query-retention-v1
        service_id:
          $ref: "#/components/schemas/ServiceId"
        mode:
          type: string
          enum:
            - DRY_RUN
            - EXECUTE
        execution_status:
          type: string
          enum:
            - PLANNED
            - SUCCEEDED
            - BLOCKED
            - FAILED
        delete_enabled:
          type: boolean
        retention_days:
          type: integer
          minimum: 7
          maximum: 365
        retention_cutoff:
          type: string
          format: date-time
        checked_at:
          type: string
          format: date-time
        max_delete_count:
          type: integer
          minimum: 1
        candidate_count:
          type: integer
          minimum: 0
        deleted_count:
          type: integer
          minimum: 0
    AgJobControlRequest:
      type: object
      additionalProperties: false
      properties:
        observed_at:
          type: string
          format: date-time
        error_code:
          type: string
          minLength: 1
        detail:
          type: string
          minLength: 1
    AgJobReplayRequest:
      type: object
      additionalProperties: false
      required:
        - replay_job_id
        - idempotency_key
        - requested_by
        - reason
      properties:
        replay_job_id:
          type: string
          minLength: 1
        idempotency_key:
          type: string
          minLength: 1
        requested_by:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
          maxLength: 500
        observed_at:
          type: string
          format: date-time
    AgJobControlDispatch:
      type: object
      additionalProperties: true
      required:
        - projection_schema_version
        - dispatch_status
        - checked_at
        - service_id
        - job_id
        - action
        - service_response
        - audit_event
        - summary
      properties:
        projection_schema_version:
          type: string
          const: ag_job_control_dispatch.v1
        dispatch_status:
          type: string
          const: SUCCEEDED
        checked_at:
          type: string
          format: date-time
        request_trace_id:
          $ref: "#/components/schemas/TraceId"
        service_id:
          $ref: "#/components/schemas/ServiceId"
        job_id:
          type: string
          minLength: 1
        action:
          type: string
          enum:
            - cancel
            - retry
            - replay
        service_response:
          $ref: "#/components/schemas/ServiceJobControlResponse"
        audit_event:
          $ref: "#/components/schemas/AuditEventSummary"
        summary:
          type: object
          additionalProperties: true
          required:
            - service_id
            - job_id
            - action
            - job_status
            - allowed_actions
          properties:
            service_id:
              $ref: "#/components/schemas/ServiceId"
            job_id:
              type: string
            action:
              type: string
            job_status:
              $ref: "#/components/schemas/JobStatus"
            allowed_actions:
              type: array
              items:
                type: string
    ServiceJobControlResponse:
      type: object
      additionalProperties: true
      required:
        - job_control_schema_version
        - service_id
        - action
        - job
        - controls
      properties:
        job_control_schema_version:
          type: string
          const: service_job_control.v1
        service_id:
          $ref: "#/components/schemas/ServiceId"
        action:
          type: string
          enum:
            - read
            - cancel
            - retry
            - replay
        job:
          $ref: "#/components/schemas/ServiceJobControlJob"
        controls:
          $ref: "#/components/schemas/ServiceJobControls"
        replay:
          $ref: "#/components/schemas/ServiceJobReplaySummary"
    ServiceJobReplaySummary:
      type: object
      additionalProperties: false
      required:
        - action
        - source_job
        - source_job_id
        - replay_job_id
        - lineage
      properties:
        action:
          type: string
          const: CREATE_NEW_JOB
        source_job:
          type: object
          additionalProperties: true
          required:
            - service_id
            - job_id
            - job_type
            - status
            - trace_id
            - request_id
            - subject_ref
            - attempt_count
            - max_attempts
            - retryable
            - dead_lettered
          properties:
            service_id:
              $ref: "#/components/schemas/ServiceId"
            job_id:
              type: string
              minLength: 1
            job_type:
              type: string
              minLength: 1
            status:
              $ref: "#/components/schemas/JobStatus"
            trace_id:
              $ref: "#/components/schemas/TraceId"
            request_id:
              type: string
              minLength: 1
            subject_ref:
              type: object
              additionalProperties: true
            attempt_count:
              type: integer
              minimum: 0
            max_attempts:
              type: integer
              minimum: 1
            retryable:
              type: boolean
            source_error_code:
              type:
                - string
                - "null"
            dead_lettered:
              type: boolean
        source_job_id:
          type: string
          minLength: 1
        replay_job_id:
          type: string
          minLength: 1
        lineage:
          type: object
          additionalProperties: false
          required:
            - lineage_schema_version
            - source_job_id
            - source_status
            - source_attempt_count
            - source_max_attempts
            - requested_by
            - reason
            - replayed_at
          properties:
            lineage_schema_version:
              type: string
              const: job_replay_lineage.v1
            source_job_id:
              type: string
              minLength: 1
            source_status:
              $ref: "#/components/schemas/JobStatus"
            source_attempt_count:
              type: integer
              minimum: 0
            source_max_attempts:
              type: integer
              minimum: 1
            source_error_code:
              type:
                - string
                - "null"
            requested_by:
              type: string
              minLength: 1
            reason:
              type: string
              minLength: 1
              maxLength: 500
            replayed_at:
              type: string
              format: date-time
    ServiceJobControlJob:
      type: object
      additionalProperties: true
      required:
        - service_id
        - job_schema_version
        - job_id
        - job_type
        - status
        - trace_id
        - request_id
        - subject_ref
        - attempt_count
        - max_attempts
        - retryable
        - links
        - created_at
        - updated_at
      properties:
        service_id:
          $ref: "#/components/schemas/ServiceId"
        job_schema_version:
          type: string
          const: common_job.v1
        job_id:
          type: string
          minLength: 1
        job_type:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/JobStatus"
        trace_id:
          $ref: "#/components/schemas/TraceId"
        request_id:
          type: string
          minLength: 1
        subject_ref:
          type: object
          additionalProperties: false
          required:
            - type
            - id
          properties:
            type:
              type: string
              minLength: 1
            id:
              type: string
              minLength: 1
        attempt_count:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
        retryable:
          type: boolean
        links:
          type: object
          additionalProperties:
            type: string
        error:
          type:
            - object
            - "null"
          additionalProperties: true
        available_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ServiceJobControls:
      type: object
      additionalProperties: false
      required:
        - can_cancel
        - can_retry
        - can_replay
        - terminal
        - dead_lettered
        - allowed_actions
      properties:
        can_cancel:
          type: boolean
        can_retry:
          type: boolean
        can_replay:
          type: boolean
        terminal:
          type: boolean
        dead_lettered:
          type: boolean
        allowed_actions:
          type: array
          items:
            type: string
            enum:
              - read
              - cancel
              - retry
              - replay
    AuditEventSummary:
      type: object
      additionalProperties: true
      required:
        - ok
      properties:
        ok:
          type: boolean
        event_id:
          type: string
        event_type:
          type: string
        error_code:
          type: string
    JobStatus:
      type: string
      enum:
        - QUEUED
        - RUNNING
        - SUCCEEDED
        - FAILED
        - CANCELLED
