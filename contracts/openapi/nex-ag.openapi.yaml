          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid service id.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Job source or job was not found.
        "503":
          description: Job source is unavailable.
  /admin/v1/operations/jobs/{service_id}/{job_id}/cancel:
    post:
      operationId: cancelAgOperationalJob
      tags:
        - Operations
      parameters:
        - name: service_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ServiceId"
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgJobControlRequest"
      responses:
        "200":
          description: AG dispatched a cancel request to the target service-local job control API and recorded audit summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgJobControlDispatch"
        "400":
          description: Invalid target service.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Target service job control endpoint or job was not found.
        "409":
          description: Target service rejected the cancel transition.
        "422":
          description: Job control payload is invalid.
        "503":
          description: Target service job control endpoint is unavailable.
  /admin/v1/operations/jobs/{service_id}/{job_id}/retry:
    post:
      operationId: retryAgOperationalJob
      tags:
        - Operations
      parameters:
        - name: service_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ServiceId"
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgJobControlRequest"
      responses:
        "200":
          description: AG dispatched a retry request to the target service-local job control API and recorded audit summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgJobControlDispatch"
        "400":
          description: Invalid target service.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Target service job control endpoint or job was not found.
        "409":
          description: Target service rejected the retry request.
        "422":
          description: Job control payload is invalid.
        "503":
          description: Target service job control endpoint is unavailable.
  /admin/v1/operations/jobs/{service_id}/{job_id}/replay:
    post:
      operationId: replayAgOperationalJob
      tags:
        - Operations
      parameters:
        - name: service_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ServiceId"
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgJobReplayRequest"
      responses:
        "200":
          description: AG dispatched a dead-letter replay request to the target service-local job control API and recorded audit summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgJobControlDispatch"
        "400":
          description: Invalid target service.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Target service job control endpoint or source job was not found.
        "409":
          description: Target service rejected replay because the source job is not replayable.
        "422":
          description: Replay payload is invalid.
        "503":
          description: Target service job control endpoint is unavailable.
  /admin/v1/operations/traces/{trace_id}:
    get:
      operationId: getAgCrossServiceTraceTimelineProjection
      tags:
        - Operations
      parameters:
        - name: trace_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TraceId"
        - $ref: "#/components/parameters/serviceId"
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Read-only cross-service trace timeline projection over jobs, events, logs, and configured CX retrieval packages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgOperationsProjection"
        "400":
          description: Invalid trace timeline query or filter.
        "401":
          description: Service claim is missing or invalid.
components:
  parameters:
    serviceId:
      name: service_id
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ServiceId"
    since:
      name: since
      in: query
      required: false
      schema:
        type: string
        format: date-time
    until:
      name: until
      in: query
      required: false
      schema:
        type: string
        format: date-time
    sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - desc
          - asc
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        pattern: "^[0-9]+$"
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
  schemas:
    ServiceId:
      type: string
      enum:
        - nex-oa
        - nex-ag
        - nex-ae-api
        - nex-cx
        - nex-mo
    TraceId:
      type: string
      pattern: "^[0-9a-f]{32}$"
    OperationalEventSeverity:
      type: string
      enum:
        - DEBUG
        - INFO
        - WARNING
        - ERROR
        - CRITICAL
    ServiceLogSeverity:
      type: string
      enum:
        - DEBUG
        - INFO
        - WARNING
        - ERROR
        - CRITICAL
    AgOperatorType:
      type: string
      enum:
        - service
        - user
    AgOperatorReviewNoteStatus:
      type: string
      enum:
        - ACTIVE
        - SUPERSEDED
        - RESOLVED
        - DELETED
    AgOperatorEvidenceExportStatus:
      type: string
      enum:
        - REQUESTED
        - READY
        - FAILED
        - CANCELLED
    AgGenerationQualityIssueDetailProjection:
      type: object
      additionalProperties: true
      required:
        - projection_schema_version
        - projection_status
        - checked_at
        - cx_generation_id
        - source_projection
        - quality
        - attention_required
        - severity
        - runbook
        - debug_paths
        - redaction_summary
      properties:
        projection_schema_version:
          type: string
          const: ag_generation_quality_issue_detail_projection.v1
        projection_status:
          type: string
          enum:
            - READY
            - DEGRADED
        checked_at:
          type: string
          format: date-time
        cx_generation_id:
          type: string
          minLength: 1
        trace_id:
          type:
            - string
            - "null"
          pattern: "^[0-9a-f]{32}$"
        request_id:
          type:
            - string
            - "null"
          minLength: 1
        source_projection:
          type: object
          additionalProperties: true
        quality:
          type:
            - object
            - "null"
          additionalProperties: true
        attention_required:
          type: boolean
        severity:
          type: string
          enum:
            - INFO
            - WARNING
            - ERROR
        runbook:
          type: object
          additionalProperties: true
        debug_paths:
          type: object
          additionalProperties: true
        redaction_summary:
          type: object
          additionalProperties: true
    AgGenerationQualityOperatorDispositionRequest:
      type: object
      additionalProperties: true
      required:
        - operator_ref
        - operator_action
      properties:
        disposition_id:
          type: string
          minLength: 1
        operator_ref:
          type: object
          additionalProperties: false
          required:
            - operator_type
            - operator_id
          properties:
            operator_type:
              type: string
              enum:
                - service
                - user
            operator_id:
              type: string
              minLength: 1
            tenant_id:
              type: string
              minLength: 1
        operator_action:
          type: string
          enum:
            - acknowledged
            - false_positive
            - needs_cx_repair
            - needs_ae_followup
            - escalated
            - resolved
        reason_codes:
          type: array
          items:
            type: string
            enum:
              - metadata_gap
              - citation_quality
              - retrieval_quality
              - generation_quality
              - user_feedback
              - duplicate
              - not_reproducible
              - other
        operator_note:
          type: string
          maxLength: 4096
        quality_issue_refs:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - source_service
              - issue_type
              - issue_code
            properties:
              source_service:
                type: string
                enum:
                  - nex-ae-api
                  - nex-cx
                  - nex-ag
              issue_type:
                type: string
                enum:
                  - retrieval_quality
                  - generation_quality
                  - citation_quality
                  - artifact_quality
                  - user_feedback
                  - operator_review
              issue_code:
                type: string
                minLength: 1
              issue_ref_id:
                type: string
                minLength: 1
    AgGenerationQualityOperatorDisposition:
      type: object
      additionalProperties: false
      required:
        - disposition_schema_version
        - disposition_id
        - cx_generation_id
        - trace_id
        - request_id
        - operator_ref
        - operator_action
        - disposition_status
        - reason_codes
        - operator_note_hash
        - operator_note_preview
        - quality_issue_refs
        - metadata
        - created_at
        - updated_at
      properties:
        disposition_schema_version:
          type: string
          const: ag_generation_quality_operator_disposition.v1
        disposition_id:
          type: string
          minLength: 1
        cx_generation_id:
          type: string
          minLength: 1
        trace_id:
          $ref: "#/components/schemas/TraceId"
        request_id:
          type: string
          minLength: 1
        operator_ref:
          type: object
          additionalProperties: false
          required:
            - operator_type
            - operator_id
            - tenant_id
          properties:
            operator_type:
              type: string
              enum:
                - service
                - user
            operator_id:
              type: string
              minLength: 1
            tenant_id:
              type:
                - string
                - "null"
              minLength: 1
        operator_action:
          type: string
          enum:
            - acknowledged
            - false_positive
            - needs_cx_repair
            - needs_ae_followup
            - escalated
            - resolved
        disposition_status:
          type: string
          enum:
            - ACKNOWLEDGED
            - DISMISSED
            - IN_REPAIR
            - ESCALATED
            - RESOLVED
        reason_codes:
          type: array
          uniqueItems: true
          items:
            type: string
        operator_note_hash:
          type:
            - string
            - "null"
          pattern: "^[0-9a-f]{64}$"
        operator_note_preview:
          type:
            - string
            - "null"
          maxLength: 240
        quality_issue_refs:
          type: array
          items:
            type: object
            additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
          required:
            - raw_note_stored
            - raw_prompt_stored
            - raw_generation_output_stored
            - operator_note_storage
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AgGenerationQualityOperatorDispositionList:
      type: object
      additionalProperties: false
      required:
        - disposition_list_schema_version
        - cx_generation_id
        - trace_id
        - request_id
        - items
        - summary
      properties:
        disposition_list_schema_version:
          type: string
          const: ag_generation_quality_operator_disposition_list.v1
        cx_generation_id:
          type: string
          minLength: 1
        trace_id:
          $ref: "#/components/schemas/TraceId"
        request_id:
          type: string
          minLength: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgGenerationQualityOperatorDisposition"
        summary:
          type: object
          additionalProperties: false
          required:
            - count
            - by_status
            - latest_updated_at
          properties:
            count:
              type: integer
              minimum: 0
            by_status:
              type: object
              additionalProperties:
                type: integer
                minimum: 0
            latest_updated_at:
              type:
                - string
                - "null"
              format: date-time
    AgGenerationRemediationTaskRequest:
      type: object
      additionalProperties: true
      required:
        - action_type
      properties:
        remediation_action_id:
          type: string
          minLength: 1
        tenant_id:
          type: string
          minLength: 1
        action_type:
          $ref: "#/components/schemas/AgGenerationRemediationActionType"
        action_status:
          $ref: "#/components/schemas/AgGenerationRemediationActionStatus"
        priority:
          $ref: "#/components/schemas/AgGenerationRemediationPriority"
        reason_codes:
          type: array
          items:
            type: string
        owner_ref:
          type: object
          additionalProperties: true
        source_refs:
          type: array
          items:
            type: object
            additionalProperties: true
        evidence_hashes:
          type: array
          items:
            type: string
            pattern: "^[0-9a-f]{64}$"
        evidence_previews:
          type: array
          items:
            type: string
            maxLength: 240
        result_ref:
          type:
            - object
            - "null"
          additionalProperties: true
        action_source:
          type: string
          enum:
            - manual
            - candidate_projection
            - operator_disposition
            - system_policy
    AgGenerationRemediationTaskStatusUpdateRequest:
      type: object
      additionalProperties: true
      required:
        - action_status
      properties:
        action_status:
          $ref: "#/components/schemas/AgGenerationRemediationActionStatus"
        result_ref:
          type:
            - object
            - "null"
          additionalProperties: true
        evidence_hashes:
          type: array
          items:
            type: string
            pattern: "^[0-9a-f]{64}$"
        evidence_previews:
          type: array
          items:
            type: string
            maxLength: 240
    AgGenerationRemediationExecutionDispatchRequest:
      type: object
      additionalProperties: false
      properties:
        requested_at:
          type: string
          minLength: 1
        planned_at:
          type: string
          minLength: 1
        idempotency_key:
          type: string
          minLength: 1
    AgGenerationRemediationExecutionDispatch:
      type: object
      additionalProperties: true
      required:
        - dispatch_schema_version
        - dispatch_status
        - remediation_action_id
        - cx_generation_id
        - trace_id
        - request_id
        - cx_execution_status
        - final_action_status
        - status_update_count
        - result_ref
        - plan
        - task
        - redaction_summary
      properties:
        dispatch_schema_version:
          type: string
          const: ag_generation_remediation_execution_dispatch.v1
        dispatch_status:
          type: string
          const: DISPATCHED
        remediation_action_id:
          type: string
          minLength: 1
        cx_generation_id:
          type: string
          minLength: 1
        trace_id:
          $ref: "#/components/schemas/TraceId"
        request_id:
          type: string
          minLength: 1
        cx_execution_status:
          type: string
          enum:
            - ACCEPTED
            - RUNNING
            - SUCCEEDED
            - FAILED
            - CANCELLED
        final_action_status:
          $ref: "#/components/schemas/AgGenerationRemediationActionStatus"
        status_update_count:
          type: integer
          minimum: 1
        result_ref:
          type: object
          additionalProperties: true
        plan:
          type: object
          additionalProperties: true
        task:
          $ref: "#/components/schemas/AgGenerationRemediationAction"
        redaction_summary:
          type: object
          additionalProperties: true
    AgGenerationRemediationExecutionStatusSyncRequest:
      type: object
      additionalProperties: false
      properties:
        observed_at:
          type: string
          minLength: 1
    AgGenerationRemediationExecutionStatusSync:
      type: object
      additionalProperties: true
      required:
        - status_sync_schema_version
        - sync_status
        - remediation_action_id
        - cx_generation_id
        - trace_id
        - request_id
        - cx_detail_schema_version
        - cx_execution_status
        - previous_action_status
        - final_action_status
        - status_update_count
        - result_ref
        - plan
        - task
        - redaction_summary
      properties:
        status_sync_schema_version:
          type: string
          const: ag_generation_remediation_execution_status_sync.v1
        sync_status:
          type: string
          enum:
            - UPDATED
            - UNCHANGED
        remediation_action_id:
          type: string
          minLength: 1
        cx_generation_id:
          type: string
          minLength: 1
        trace_id:
          $ref: "#/components/schemas/TraceId"
        request_id:
          type: string
          minLength: 1
        cx_detail_schema_version:
          type: string
          const: cx_remediation_execution_detail.v1
        cx_execution_status:
          type: string
          enum:
            - ACCEPTED
            - RUNNING
            - SUCCEEDED
            - FAILED
            - CANCELLED
        previous_action_status:
          $ref: "#/components/schemas/AgGenerationRemediationActionStatus"
        final_action_status:
          $ref: "#/components/schemas/AgGenerationRemediationActionStatus"
        status_update_count:
          type: integer
          minimum: 0
        result_ref:
          type: object
          additionalProperties: true
        plan:
          type: object
          additionalProperties: true
        task:
          $ref: "#/components/schemas/AgGenerationRemediationAction"
        redaction_summary:
          type: object
          additionalProperties: true
    AgGenerationRemediationActionType:
      type: string
      enum:
        - retry_generation
        - retrieval_repair
        - citation_repair
        - prompt_policy_review
        - operator_followup
        - mark_accepted
    AgGenerationRemediationActionStatus:
      type: string
      enum:
        - PROPOSED
        - ASSIGNED
        - IN_PROGRESS
        - WAITING_ON_CX
        - COMPLETED
        - FAILED
        - CANCELLED
    AgGenerationRemediationPriority:
      type: string
      enum:
        - LOW
        - NORMAL
        - HIGH
        - URGENT
    AgGenerationRemediationAction:
