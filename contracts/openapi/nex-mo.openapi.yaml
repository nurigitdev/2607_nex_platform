openapi: 3.1.0
info:
  title: NeX MO API
  version: 0.0.0-slice0003
tags:
  - name: Platform
  - name: Internal Job Control
  - name: Internal Service Logs
  - name: Provider Profiles
  - name: Provider Routes
  - name: Provider Readiness
  - name: Providers
paths:
  /:
    get:
      operationId: getMoServiceRoot
      tags:
        - Platform
      responses:
        "200":
          description: MO service identity and platform links.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRoot"
  /health:
    get:
      operationId: getMoHealth
      tags:
        - Platform
      responses:
        "200":
          description: Service health status.
  /ready:
    get:
      operationId: getMoReadiness
      tags:
        - Platform
      responses:
        "200":
          description: Service dependencies are ready.
        "503":
          description: One or more service dependencies are unavailable.
  /version:
    get:
      operationId: getMoVersion
      tags:
        - Platform
      responses:
        "200":
          description: Service version metadata.
  /internal/v1/auth/service-claim:
    get:
      operationId: validateMoServiceClaim
      tags:
        - Platform
      security:
        - serviceBearer: []
      responses:
        "200":
          description: Service claim is valid for this service.
        "401":
          description: Service claim is missing or invalid.
  /internal/v1/jobs/{job_id}:
    get:
      operationId: getMoServiceJob
      tags:
        - Internal Job Control
      security:
        - serviceBearer: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Payload-redacted MO service-local job control projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobControlResponse"
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Job was not found.
  /internal/v1/jobs/{job_id}/cancel:
    post:
      operationId: cancelMoServiceJob
      tags:
        - Internal Job Control
      security:
        - serviceBearer: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobCancelRequest"
      responses:
        "200":
          description: Active MO job was cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobControlResponse"
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Job was not found.
        "409":
          description: Job cannot transition to cancelled.
        "422":
          description: Job control payload is invalid.
  /internal/v1/jobs/{job_id}/retry:
    post:
      operationId: retryMoServiceJob
      tags:
        - Internal Job Control
      security:
        - serviceBearer: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRetryRequest"
      responses:
        "200":
          description: Running MO job was requeued or dead-lettered by retry policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobControlResponse"
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Job was not found.
        "409":
          description: Job cannot be retried from its current status.
        "422":
          description: Job control payload is invalid.
  /internal/v1/jobs/{job_id}/replay:
    post:
      operationId: replayMoServiceJob
      tags:
        - Internal Job Control
      security:
        - serviceBearer: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobReplayRequest"
      responses:
        "200":
          description: Dead-lettered MO job was replayed with explicit lineage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobControlResponse"
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Job was not found.
        "409":
          description: Job cannot be replayed from its current status.
        "422":
          description: Replay payload is invalid.
  /internal/v1/service-logs/retention/purge:
    post:
      operationId: purgeMoServiceLogRetention
      tags:
        - Internal Service Logs
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceLogRetentionPurgeRequest"
      responses:
        "200":
          description: MO service-log retention dry-run or bounded purge result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceLogRetentionExecution"
        "401":
          description: Service claim is missing or invalid.
        "409":
          description: Idempotency key conflicts with an existing execution.
        "422":
          description: Retention purge payload is invalid.
        "503":
          description: Service-log store is unavailable.
  /internal/v1/service-logs/retention/history:
    get:
      operationId: listMoServiceLogRetentionHistory
      tags:
        - Internal Service Logs
      security:
        - serviceBearer: []
      parameters:
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [DRY_RUN, EXECUTE]
        - name: execution_status
          in: query
          required: false
          schema:
            type: string
            enum: [PLANNED, SUCCEEDED, BLOCKED, FAILED]
        - name: trace_id
          in: query
          required: false
          schema:
            type: string
        - name: request_id
          in: query
          required: false
          schema:
            type: string
        - name: idempotency_key
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: Filtered MO service-log retention execution history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceLogRetentionHistoryList"
        "401":
          description: Service claim is missing or invalid.
        "422":
          description: Retention history filters are invalid.
        "503":
          description: Service-log store is unavailable.
  /internal/v1/service-logs/retention/history/{execution_id}:
    get:
      operationId: getMoServiceLogRetentionHistory
      tags:
        - Internal Service Logs
      security:
        - serviceBearer: []
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
      responses:
        "200":
          description: One MO service-log retention history entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceLogRetentionHistoryEntry"
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Retention history entry was not found.
        "503":
          description: Service-log store is unavailable.
  /api/v1/provider-routes:
    get:
      operationId: listMoProviderRoutes
      tags:
        - Provider Routes
      security:
        - serviceBearer: []
      parameters:
        - name: capability
          in: query
          required: false
          schema:
            type: string
            enum: [embedding, reranking, generation]
      responses:
        "200":
          description: Provider routes and aliases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderRouteList"
        "401":
          description: Service claim is missing or invalid.
  /api/v1/provider-profiles:
    get:
      operationId: listMoProviderProfiles
      tags:
        - Provider Profiles
      security:
        - serviceBearer: []
      parameters:
        - name: capability
          in: query
          required: false
          schema:
            type: string
            enum:
              - embedding
              - reranking
              - generation
      responses:
        "200":
          description: MO model profiles by capability, including selected defaults and generation candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelProfileList"
        "401":
          description: Service claim is missing or invalid.
  /api/v1/provider-route-health:
    get:
      operationId: getMoProviderRouteHealth
      tags:
        - Provider Readiness
      security:
        - serviceBearer: []
      responses:
        "200":
          description: Privacy-safe provider route health and aggregate readiness snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderReadiness"
        "401":
          description: Service claim is missing or invalid.
  /api/v1/provider-telemetry:
    get:
      operationId: getMoProviderTelemetry
      tags:
        - Providers
      security:
        - serviceBearer: []
      parameters:
        - name: capability
          in: query
          required: false
          schema:
            type: string
            enum: [embedding, reranking, generation]
      responses:
        "200":
          description: Privacy-safe process-local provider execution and bounded-retry telemetry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderTelemetrySnapshot"
        "401":
          description: Service claim is missing or invalid.
  /api/v1/embeddings:
    post:
      operationId: createMoEmbeddings
      tags:
        - Providers
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbeddingRequest"
      responses:
        "200":
          description: Normalized embedding vectors from the selected provider route.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingResponse"
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Provider alias was not found.
        "422":
          description: Provider route cannot satisfy the request.
  /api/v1/rerank:
    post:
      operationId: createMoRerank
      tags:
        - Providers
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RerankRequest"
      responses:
        "200":
          description: Normalized reranking scores from the selected provider route.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RerankResponse"
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Provider alias was not found.
        "422":
          description: Provider route cannot satisfy the request.
  /api/v1/generations:
    post:
      operationId: createMoGeneration
      tags:
        - Providers
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerationRequest"
      responses:
        "200":
          description: Normalized generation response from the selected provider route.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationResponse"
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Provider alias was not found.
        "422":
          description: Provider route cannot satisfy the request.
components:
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ExecutionId:
      name: execution_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: NeX service claim
  schemas:
    ServiceRoot:
      type: object
      additionalProperties: false
      required: [service_id, service_name, profile, links]
      properties:
        service_id:
          type: string
          const: nex-mo
        service_name:
          type: string
          minLength: 1
        profile:
          type: string
          minLength: 1
        links:
          type: object
          additionalProperties: false
          required: [health, ready, version]
          properties:
            health:
              type: string
              const: /health
            ready:
              type: string
              const: /ready
            version:
              type: string
              const: /version
    ServiceLogRetentionPurgeRequest:
      type: object
      additionalProperties: false
      required: [retention_cutoff]
      properties:
        retention_cutoff:
          type: string
          format: date-time
        retention_days:
          type: integer
          minimum: 7
          maximum: 365
        checked_at:
          type: string
          format: date-time
        dry_run:
          type: boolean
          default: true
        delete_enabled:
          type: boolean
          default: false
        max_delete_count:
          type: integer
          minimum: 1
          maximum: 500
        requested_by:
          type: object
        idempotency_key:
          type: string
          minLength: 1
    ServiceLogRetentionExecution:
      type: object
      x-nex-canonical-json-schema: schemas/common/service_log_retention_execution.v1.schema.json
      additionalProperties: true
      required:
        - retention_execution_schema_version
        - execution_id
        - service_id
        - mode
        - execution_status
      properties:
        retention_execution_schema_version:
          const: service_log_retention_execution.v1
        execution_id:
          type: string
        service_id:
          type: string
          const: nex-mo
        mode:
          type: string
          enum: [DRY_RUN, EXECUTE]
        execution_status:
          type: string
          enum: [PLANNED, SUCCEEDED, BLOCKED, FAILED]
    ServiceLogRetentionHistoryEntry:
      type: object
      x-nex-canonical-json-schema: schemas/common/service_log_retention_history_entry.v1.schema.json
      additionalProperties: true
      required:
        - retention_history_schema_version
        - execution_id
        - service_id
        - mode
        - execution_status
      properties:
        retention_history_schema_version:
          const: service_log_retention_history_entry.v1
        execution_id:
          type: string
        service_id:
          type: string
          const: nex-mo
        mode:
          type: string
          enum: [DRY_RUN, EXECUTE]
        execution_status:
          type: string
          enum: [PLANNED, SUCCEEDED, BLOCKED, FAILED]
    ServiceLogRetentionHistoryList:
      type: object
      additionalProperties: false
      required:
        - retention_history_list_schema_version
        - service_id
        - filters
        - limit
        - items
        - summary
      properties:
        retention_history_list_schema_version:
          const: service_log_retention_history_list.v1
        service_id:
          type: string
          const: nex-mo
        filters:
          type: object
        limit:
          type: integer
          minimum: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServiceLogRetentionHistoryEntry"
        summary:
          type: object
    JobCancelRequest:
      type: object
      additionalProperties: false
      properties:
        observed_at:
          type: string
          format: date-time
    JobRetryRequest:
      type: object
      additionalProperties: false
      properties:
        error_code:
          type: string
          minLength: 1
        detail:
          type: string
          minLength: 1
        observed_at:
          type: string
          format: date-time
    JobReplayRequest:
      type: object
      additionalProperties: false
      required: [replay_job_id, idempotency_key, requested_by, reason]
      properties:
        replay_job_id:
          type: string
          minLength: 1
        idempotency_key:
          type: string
          minLength: 1
        requested_by:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
        observed_at:
          type: string
          format: date-time
    JobControlResponse:
      type: object
      additionalProperties: true
      required: [job_control_schema_version, service_id, action, job, controls]
      properties:
        job_control_schema_version:
          type: string
          const: service_job_control.v1
        service_id:
          type: string
          const: nex-mo
        action:
          type: string
          enum: [read, cancel, retry, replay]
        job:
          type: object
        controls:
          type: object
        replay:
          type: object
    ProviderRouteList:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_mo/provider_route_list.v1.schema.json
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          type: object
          required: [count, profile]
          properties:
            count:
              type: integer
              minimum: 0
            profile:
              type: string
    ModelProfileList:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_mo/model_profile_list.v1.schema.json
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          type: object
          required: [count, provider_mode]
          properties:
            count:
              type: integer
              minimum: 0
            provider_mode:
              type: string
              enum: [mock, live]
    ProviderTelemetrySnapshot:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_mo/provider_telemetry_snapshot.v1.schema.json
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProviderTelemetryItem"
        meta:
          type: object
          required: [count, provider_mode, schema_version]
          properties:
            count:
              type: integer
              minimum: 0
            provider_mode:
              type: string
              enum: [mock, live]
            schema_version:
              type: string
              const: mo_provider_telemetry_snapshot.v1
    ProviderTelemetryItem:
      type: object
      additionalProperties: false
      required:
        - capability
        - endpoint_env
        - configured
        - request_shape
        - model_name
        - model_revision
        - deployment_id
        - authorization_env
        - authorization_configured
        - request_count
        - success_count
        - failure_count
        - retryable_failure_count
        - degraded_count
        - attempt_count
        - retry_count
        - last_outcome
        - last_observed_at
        - last_latency_ms
        - last_status_code
        - last_error_code
        - last_failure_kind
        - last_upstream_status_code
        - last_retry_at
        - last_retry_delay_ms
        - last_retry_failure_kind
      properties:
        capability:
          type: string
          enum: [embedding, reranking, generation]
        endpoint_env:
          type: string
          minLength: 1
        configured:
          type: boolean
        request_shape:
          type: string
          minLength: 1
        model_name:
          type: string
          minLength: 1
        model_revision:
          type: string
          minLength: 1
        deployment_id:
          type: string
          minLength: 1
        authorization_env:
          type: [string, "null"]
          minLength: 1
        authorization_configured:
          type: boolean
        request_count:
          type: integer
          minimum: 0
        success_count:
          type: integer
          minimum: 0
        failure_count:
          type: integer
          minimum: 0
        retryable_failure_count:
          type: integer
          minimum: 0
        degraded_count:
          type: integer
          minimum: 0
        attempt_count:
          type: integer
          minimum: 0
        retry_count:
          type: integer
          minimum: 0
        last_outcome:
          type: [string, "null"]
          enum: [success, failure, null]
        last_observed_at:
          type: [string, "null"]
          format: date-time
        last_latency_ms:
          type: [integer, "null"]
          minimum: 0
        last_status_code:
          type: [integer, "null"]
          minimum: 100
          maximum: 599
        last_error_code:
          type: [string, "null"]
          minLength: 1
        last_failure_kind:
          type: [string, "null"]
          minLength: 1
        last_upstream_status_code:
          type: [integer, "null"]
          minimum: 100
          maximum: 599
        last_retry_at:
          type: [string, "null"]
          format: date-time
        last_retry_delay_ms:
          type: [integer, "null"]
          minimum: 0
        last_retry_failure_kind:
          type: [string, "null"]
          minLength: 1
    EmbeddingRequest:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_mo/embedding_request.v1.schema.json
      additionalProperties: false
      required: [inputs]
      properties:
        alias:
          type: string
        inputs:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
    EmbeddingResponse:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_mo/embedding_response.v1.schema.json
      additionalProperties: false
      required: [object, alias, model_revision, deployment_id, data, usage]
      properties:
        object:
          const: list
        alias:
          type: string
        model_revision:
          type: string
        deployment_id:
          type: string
        data:
          type: array
          minItems: 1
          items:
            type: object
        usage:
          type: object
    RerankRequest:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_mo/rerank_request.v1.schema.json
      additionalProperties: false
      required: [query, documents]
      properties:
        alias:
          type: string
        query:
          type: string
          minLength: 1
        documents:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        top_n:
          type: integer
          minimum: 1
    RerankResponse:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_mo/rerank_response.v1.schema.json
      additionalProperties: false
      required: [alias, model_revision, deployment_id, results, usage]
      properties:
        alias:
          type: string
        model_revision:
          type: string
        deployment_id:
          type: string
        results:
          type: array
          minItems: 1
          items:
            type: object
        usage:
          type: object
    GenerationRequest:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_mo/generation_request.v1.schema.json
      additionalProperties: false
      properties:
        alias:
          type: string
        provider_capability:
          type: string
          const: generation
        prompt:
          type: [string, "null"]
        messages:
          type: [array, "null"]
          items:
            type: object
        response_format:
          type: object
        reasoning_mode:
          type: string
          enum: [provider_default, enabled, disabled]
        max_output_tokens:
          type: integer
          minimum: 1
        temperature:
          type: number
        stream:
          type: boolean
        metadata:
          type: object
      oneOf:
        - required: [prompt]
        - required: [messages]
    GenerationResponse:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_mo/generation_response.v1.schema.json
      additionalProperties: false
      required:
        - mo_generation_id
        - alias
        - model_revision
        - deployment_id
        - provider_type
        - output
        - finish_reason
        - usage
        - runtime_metadata
        - created_at
        - updated_at
      properties:
        mo_generation_id:
          type: string
        alias:
          type: string
        model_revision:
          type: string
        deployment_id:
          type: string
        provider_type:
          type: string
        output:
          type: object
        finish_reason:
          type: string
        usage:
          type: object
        runtime_metadata:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProviderReadiness:
      type: object
      additionalProperties: false
      x-nex-canonical-json-schema: schemas/service/nex_mo/provider_readiness.v1.schema.json
      required:
        - name
        - ok
        - provider_readiness_schema_version
        - provider_mode
        - readiness_status
        - checked_at
        - expires_at
        - cache_status
        - required_capabilities
        - summary
        - routes
        - failure_code
        - error_code
      properties:
        name:
          type: string
          const: provider_routes
        ok:
          type: boolean
        provider_readiness_schema_version:
          type: string
          const: mo_provider_readiness.v1
        provider_mode:
          type: string
          enum:
            - mock
            - live
            - unknown
        readiness_status:
          type: string
          enum:
            - READY
            - NOT_READY
        checked_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        cache_status:
          type: string
          enum:
            - MISS
            - FRESH
            - REFRESHED
            - STALE
        required_capabilities:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: string
            enum:
              - embedding
