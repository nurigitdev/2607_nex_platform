openapi: 3.1.0
info:
  title: NeX AE API
  version: 0.0.0-slice0003
tags:
  - name: Platform
  - name: Chat
  - name: Retrieval
paths:
  /health:
    get:
      operationId: getAeHealth
      tags:
        - Platform
      responses:
        "200":
          description: Service health status.
  /ready:
    get:
      operationId: getAeReadiness
      tags:
        - Platform
      responses:
        "200":
          description: Service dependencies are ready.
        "503":
          description: One or more service dependencies are unavailable.
  /version:
    get:
      operationId: getAeVersion
      tags:
        - Platform
      responses:
        "200":
          description: Service version metadata.
  /internal/v1/auth/service-claim:
    get:
      operationId: validateAeServiceClaim
      tags:
        - Platform
      responses:
        "200":
          description: Service claim is valid for this service.
        "401":
          description: Service claim is missing or invalid.
  /api/v1/chat/interactions:
    post:
      operationId: createAeChatInteraction
      tags:
        - Chat
      responses:
        "200":
          description: AE chat interaction created and linked to CX generation.
        "400":
          description: Chat interaction request is invalid.
        "401":
          description: Service claim is missing or invalid.
  /api/v1/chat/interactions/{interaction_id}:
    get:
      operationId: getAeChatInteraction
      tags:
        - Chat
      parameters:
        - name: interaction_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AE chat interaction record.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: AE chat interaction was not found.
  /api/v1/retrieval/contexts:
    post:
      operationId: createAeRetrievalInteraction
      tags:
        - Retrieval
      responses:
        "200":
          description: AE retrieval interaction created and linked to CX retrieval package.
        "400":
          description: Retrieval interaction request is invalid.
        "401":
          description: Service claim is missing or invalid.
        "503":
          description: CX retrieval is unavailable.
  /api/v1/retrieval/contexts/{retrieval_interaction_id}:
    get:
      operationId: getAeRetrievalInteraction
      tags:
        - Retrieval
      parameters:
        - name: retrieval_interaction_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AE retrieval interaction record.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: AE retrieval interaction was not found.
