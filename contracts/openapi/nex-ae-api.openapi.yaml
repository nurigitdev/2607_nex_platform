openapi: 3.1.0
info:
  title: NeX AE API
  version: 0.0.0-slice0003
tags:
  - name: Platform
  - name: Auth
  - name: Workspace
  - name: Uploads
  - name: Documents
  - name: Artifacts
  - name: Compatibility
  - name: Recovery
  - name: Chat
  - name: Retrieval
  - name: Analytics
  - name: Prompts
paths:
  /health:
    get:
      operationId: getAeHealth
      tags:
        - Platform
      responses:
        "200":
          description: Service health status.
  /ready:
    get:
      operationId: getAeReadiness
      tags:
        - Platform
      responses:
        "200":
          description: Service dependencies are ready.
        "503":
          description: One or more service dependencies are unavailable.
  /version:
    get:
      operationId: getAeVersion
      tags:
        - Platform
      responses:
        "200":
          description: Service version metadata.
  /internal/v1/auth/service-claim:
    get:
      operationId: validateAeServiceClaim
      tags:
        - Platform
      responses:
        "200":
          description: Service claim is valid for this service.
        "401":
          description: Service claim is missing or invalid.
  /api/v1/auth/session:
    get:
      operationId: getAeBrowserSession
      tags:
        - Auth
      responses:
        "200":
          description: Safe OA browser session snapshot for the authenticated user.
        "401":
          description: Browser user session is missing, expired, or invalid.
  /api/v1/auth/session/login:
    post:
      operationId: loginAeBrowserSession
      tags:
        - Auth
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: >
                In OA mode, AE accepts company employee credential input and
                delegates verification to OA. In mock mode, user_id/login_hint
                remains available for local regression without password input.
              additionalProperties: false
              properties:
                tenant_id:
                  type: string
                employee_id:
                  type: string
                  description: Company employee id used for OA credential login.
                login_identifier:
                  type: string
                  description: Alias for employee_id in OA credential-login mode.
                password:
                  type: string
                  format: password
                  description: Submitted only from AE to OA and never returned.
                user_id:
                  type: string
                  description: Mock-mode local user id.
                login_hint:
                  type: string
                  description: Mock-mode user alias or OA-mode employee id alias.
                scopes:
                  type: array
                  items:
                    type: string
                requested_scopes:
                  type: array
                  items:
                    type: string
                  description: Alias for scopes in OA credential-login mode.
                roles:
                  type: array
                  items:
                    type: string
                  description: Mock-mode local roles; OA mode derives roles from OA.
                ttl_seconds:
                  type: integer
                  minimum: 1
                  maximum: 86400
      responses:
        "200":
          description: Safe OA browser session snapshot and HttpOnly session cookie.
        "400":
          description: Login request is invalid or includes unsupported private fields.
  /api/v1/auth/session/logout:
    post:
      operationId: logoutAeBrowserSession
      tags:
        - Auth
      responses:
        "200":
          description: Revoked safe OA browser session snapshot and cleared session cookie.
        "401":
          description: Browser user session is already missing, expired, or invalid.
  /api/v1/workspaces:
    post:
      operationId: createAeWorkspace
      tags:
        - Workspace
      responses:
        "200":
          description: AE workspace state created with runtime defaults.
        "400":
          description: Workspace request is invalid.
        "401":
          description: Service claim is missing or invalid.
  /api/v1/workspaces/{workspace_id}:
    get:
      operationId: getAeWorkspace
      tags:
        - Workspace
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AE workspace state.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: AE workspace was not found.
  /api/v1/workspaces/{workspace_id}/activity:
    get:
      operationId: listAeWorkspaceActivity
      tags:
        - Workspace
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Safe AE workspace activity entries.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: AE workspace was not found.
  /api/v1/uploads:
    post:
      operationId: createAeUploadHandoff
      tags:
        - Uploads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
                - filename
              properties:
                filename:
                  type: string
                  minLength: 1
                content_type:
                  type: string
                content_text:
                  type: string
                tenant_id:
                  type: string
                  description: Legacy compatibility alias for ownership_ref.tenant_ref.id.
                owner_user_id:
                  type: string
                  description: Legacy compatibility alias for ownership_ref.owner_subject_ref.id.
                user_id:
                  type: string
                  description: Older AE alias for owner_user_id.
                uploaded_by_user_id:
                  type: string
                  description: Legacy compatibility alias for ownership_ref.uploaded_by_subject_ref.id.
                ownership_ref:
                  type: object
                  description: Canonical OA tenant/user subject references propagated to CX.
      responses:
        "200":
          description: CX reported an existing owner-scoped document.
        "202":
          description: Upload handoff accepted and CX ingestion is queued.
        "400":
          description: Upload handoff request is invalid.
        "401":
          description: Service claim is missing or invalid.
        "422":
          description: Upload handoff content metadata is invalid.
        "503":
          description: CX upload registration is unavailable.
  /api/v1/uploads/{upload_handoff_id}:
    get:
      operationId: getAeUploadHandoff
      tags:
        - Uploads
      parameters:
        - name: upload_handoff_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Safe AE upload handoff record.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Upload handoff was not found.
  /api/v1/workspaces/{workspace_id}/documents:
    get:
      operationId: listAeWorkspaceDocuments
      tags:
        - Documents
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Safe AE document library items for a workspace.
        "401":
          description: Service claim is missing or invalid.
        "503":
          description: CX document status is unavailable.
  /api/v1/documents/summary-search:
    get:
      operationId: searchAeDocumentSummaries
      tags:
        - Documents
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Mock lexical summary search results for a workspace.
        "401":
          description: Service claim is missing or invalid.
        "422":
          description: Summary search request is invalid.
        "503":
          description: CX document status is unavailable.
  /api/v1/documents/{document_id}:
    get:
      operationId: getAeDocumentDetail
      tags:
        - Documents
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AE-safe document detail projection composed from a CX detail read.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - projection_schema_version
                  - service_id
                  - workspace_id
                  - tenant_id
                  - owner_user_id
                  - document
                  - cx
                  - metadata
                properties:
                  projection_schema_version:
                    const: ae_document_detail_projection.v1
                  service_id:
                    const: nex-ae-api
                  workspace_id:
                    type: string
                  tenant_id:
                    type: string
                  owner_user_id:
                    type: string
                  document:
                    type: object
                    additionalProperties: false
                    required:
                      - document_detail_schema_version
                      - document_id
                      - upload_handoff_id
                      - filename
                      - content_type
                      - size_bytes
                      - source_sha256
                      - status
                      - summary
                      - processing
                      - source_lineage
                      - links
                      - metadata
                    properties:
                      document_detail_schema_version:
                        const: ae_document_detail_item.v1
                      document_id:
                        type: string
                      upload_handoff_id:
                        type: string
                      filename:
                        type: string
                      content_type:
                        type: string
                      size_bytes:
                        type: integer
                        minimum: 0
                      source_sha256:
                        type: string
                        pattern: ^[0-9a-f]{64}$
                      status:
                        type: object
                        additionalProperties: false
                      summary:
                        type: object
                        additionalProperties: false
                      processing:
                        type: object
                        additionalProperties: false
                      source_lineage:
                        type: object
                        additionalProperties: false
                        required:
                          - storage_key_included
                          - storage_uri_included
                          - storage_path_included
                        properties:
                          source_file_id:
                            type:
                              - string
                              - "null"
                          source_sha256:
                            type: string
                            pattern: ^[0-9a-f]{64}$
                          content_type:
                            type: string
                          size_bytes:
                            type: integer
                            minimum: 0
                          storage_key_included:
                            const: false
                          storage_uri_included:
                            const: false
                          storage_path_included:
                            const: false
                      links:
                        type: object
                        additionalProperties: false
                      metadata:
                        type: object
                        additionalProperties: false
                        properties:
                          raw_source_stored_in_ae:
                            const: false
                          raw_summary_stored_in_ae:
                            const: false
                          embedding_vector_stored_in_ae:
                            const: false
                          cx_storage_redacted:
                            const: true
                  cx:
                    type: object
                    additionalProperties: false
                  metadata:
                    type: object
                    additionalProperties: false
                    properties:
                      raw_source_stored_in_ae:
                        const: false
                      raw_summary_stored_in_ae:
                        const: false
                      embedding_vector_stored_in_ae:
                        const: false
                      cx_storage_redacted:
                        const: true
                      cx_detail_passthrough:
                        const: false
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: AE upload handoff was not found for the requested document.
        "422":
          description: Stored AE document owner scope is invalid.
        "503":
          description: CX document detail is unavailable.
  /api/v1/artifact-handoffs:
    post:
      operationId: createAeArtifactHandoff
      tags:
        - Artifacts
      responses:
        "200":
          description: AE artifact handoff package created from validated CX generation and structured draft records.
        "401":
          description: Service claim is missing or invalid.
        "409":
          description: CX generation or structured draft is not ready for artifact rendering.
        "422":
          description: Artifact handoff request is invalid.
        "503":
          description: CX artifact source records are unavailable.
  /api/v1/artifact-handoffs/{artifact_handoff_id}:
    get:
      operationId: getAeArtifactHandoff
      tags:
        - Artifacts
      parameters:
        - name: artifact_handoff_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Safe AE artifact handoff package.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Artifact handoff was not found.
  /api/v1/artifacts:
    post:
      operationId: createAeArtifact
      tags:
        - Artifacts
      responses:
        "200":
          description: AE artifact record shell created from a validated artifact handoff.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Artifact handoff was not found.
        "409":
          description: Artifact handoff is not ready for record creation.
        "422":
          description: Artifact creation request or handoff record is invalid.
  /api/v1/artifacts/{artifact_id}:
    get:
      operationId: getAeArtifact
      tags:
        - Artifacts
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AE artifact record with source refs, versions, render jobs, files, and links.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Artifact was not found.
  /api/v1/artifacts/{artifact_id}/versions:
    get:
      operationId: listAeArtifactVersions
      tags:
        - Artifacts
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AE artifact versions for the requested artifact.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Artifact was not found.
  /api/v1/artifacts/{artifact_id}/render-jobs:
    post:
      operationId: createAeArtifactRenderJob
      tags:
        - Artifacts
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Markdown render job completed and artifact version metadata recorded.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Artifact was not found.
        "409":
          description: Artifact or source draft is not renderable.
        "422":
          description: Render request is invalid or requests an unsupported format.
        "503":
          description: CX structured draft read is unavailable.
  /api/v1/artifact-render-jobs/{render_job_id}:
    get:
      operationId: getAeArtifactRenderJob
      tags:
        - Artifacts
      parameters:
        - name: render_job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AE artifact render job metadata.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Artifact render job was not found.
  /api/v1/artifact-files/{artifact_file_id}:
    get:
      operationId: getAeArtifactFile
      tags:
        - Artifacts
      parameters:
        - name: artifact_file_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AE artifact file metadata with safe storage reference.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Artifact file was not found.
  /api/v1/artifact-files/{artifact_file_id}/preview:
    get:
      operationId: previewAeArtifactFile
      tags:
        - Artifacts
      parameters:
        - name: artifact_file_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Authorized Markdown artifact preview payload.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Artifact file or preview link was not found.
        "409":
          description: Artifact file content is not ready.
  /api/v1/artifact-files/{artifact_file_id}/download:
    get:
      operationId: downloadAeArtifactFile
      tags:
        - Artifacts
      parameters:
        - name: artifact_file_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Authorized Markdown artifact download payload.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Artifact file or download link was not found.
        "409":
          description: Artifact file content is not ready.
  /api/v1/compatibility/generation-rules:
    get:
      operationId: listAeGenerationCompatibilityRules
      tags:
        - Compatibility
      responses:
        "200":
          description: Active generation compatibility rules visible to AE.
        "401":
          description: Service claim is missing or invalid.
  /api/v1/recovery/generation-policies:
    get:
      operationId: listAeGenerationRecoveryPolicies
      tags:
        - Recovery
      responses:
        "200":
          description: Active generation recovery policies visible to AE.
        "401":
          description: Service claim is missing or invalid.
  /api/v1/recovery/generation-policies/{failure_code}:
    get:
      operationId: getAeGenerationRecoveryPolicy
      tags:
        - Recovery
      parameters:
        - name: failure_code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Generation recovery policy selected by failure code.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: No active generation recovery policy matched the failure code.
  /api/v1/recovery/generation-requests:
    post:
      operationId: createAeGenerationRecoveryRequest
      tags:
        - Recovery
      responses:
        "202":
          description: AE accepted a safe generation recovery request for a failed CX generation record.
        "401":
          description: Service claim is missing or invalid.
        "409":
          description: CX generation is not failed, source lineage is invalid, or requested action is not allowed by policy.
        "422":
          description: Recovery request is invalid.
        "503":
          description: CX generation lookup is unavailable.
  /api/v1/recovery/generation-requests/{recovery_request_id}:
    get:
      operationId: getAeGenerationRecoveryRequest
      tags:
        - Recovery
      parameters:
        - name: recovery_request_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Safe AE generation recovery request record.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Recovery request was not found.
  /api/v1/chat/interactions:
    post:
      operationId: createAeChatInteraction
      tags:
        - Chat
      responses:
        "200":
          description: AE chat interaction created, optionally grounded by CX retrieval, linked to CX generation when evidence is available, or safely recorded as failed when CX blocks generation on retrieval quality.
        "400":
          description: Chat interaction request is invalid.
        "401":
          description: Service claim is missing or invalid.
        "409":
          description: CX generation rejected a non-quality interaction or retrieval state conflict.
        "503":
          description: CX retrieval or generation is unavailable.
  /api/v1/chat/interactions/{interaction_id}:
    get:
      operationId: getAeChatInteraction
      tags:
        - Chat
      parameters:
        - name: interaction_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AE chat interaction record.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: AE chat interaction was not found.
  /api/v1/chat/interactions/{interaction_id}/repaired-response-handoffs:
    post:
      operationId: createAeRepairedResponseHandoff
      tags:
        - Chat
      parameters:
        - name: interaction_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: >
                AE repaired response handoff request built from a CX remediation
                execution detail and completed repaired generation record. AE
                stores safe lineage refs, hashes, preview, actor scope, and user
                review mode only.
      responses:
        "202":
          description: AE repaired response handoff is ready for user review.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - handoff_schema_version
                  - repaired_response_handoff_id
                  - handoff_status
                  - source
                  - repaired_response
                  - lineage
                  - redaction_summary
                properties:
                  handoff_schema_version:
                    const: ae_repaired_response_handoff.v1
                  repaired_response_handoff_id:
                    type: string
                  handoff_status:
                    const: READY_FOR_USER_REVIEW
                  source:
                    type: object
                    additionalProperties: true
                    required:
                      - detail_schema_version
                      - parent_cx_generation_id
                      - repair_cx_generation_id
                    properties:
                      detail_schema_version:
                        const: cx_remediation_execution_detail.v1
                      parent_cx_generation_id:
                        type: string
                      repair_cx_generation_id:
                        type: string
                  repaired_response:
                    type: object
                    additionalProperties: true
                    required:
                      - cx_generation_id
                      - output_preview
                      - output_hash
                    properties:
                      cx_generation_id:
                        type: string
                      output_preview:
                        type: string
                        maxLength: 120
                      output_hash:
                        oneOf:
                          - type: string
                            pattern: "^[a-f0-9]{64}$"
                          - type: "null"
                  lineage:
                    type: object
                    additionalProperties: true
                    required:
                      - source_lineage_schema_version
                      - lineage_status
                      - parent_generation_mutated
                    properties:
                      source_lineage_schema_version:
                        const: cx_repaired_generation_lineage.v1
                      lineage_status:
                        const: LINKED
                      parent_generation_mutated:
                        const: false
                  redaction_summary:
                    type: object
                    additionalProperties: true
                    required:
                      - raw_output_included
                      - raw_prompt_included
                      - raw_source_text_included
                      - provider_detail_included
                    properties:
                      raw_output_included:
                        const: false
                      raw_prompt_included:
                        const: false
                      raw_source_text_included:
                        const: false
                      provider_detail_included:
                        const: false
        "401":
          description: Service claim or browser user session is missing or invalid.
        "409":
          description: CX remediation lineage or generation ids are inconsistent.
        "422":
          description: Handoff payload is invalid or contains sensitive fields.
        "503":
          description: CX remediation or generation read model is unavailable.
  /api/v1/chat/interactions/{interaction_id}/repaired-response-handoffs/review:
    get:
      operationId: listAeRepairedResponseHandoffReviews
      tags:
        - Chat
      parameters:
        - name: interaction_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Safe AE Web repaired response review projection collection.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - collection_schema_version
                  - interaction_id
                  - items
                  - item_count
                properties:
                  collection_schema_version:
                    const: ae_repaired_response_review_collection.v1
                  interaction_id:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      required:
                        - projection_schema_version
                        - repaired_response_handoff_id
                        - decision_controls
                      properties:
                        projection_schema_version:
                          const: ae_repaired_response_review_projection.v1
                        repaired_response_handoff_id:
                          type: string
                        decision_controls:
                          type: object
                          additionalProperties: true
                  item_count:
                    type: integer
                    minimum: 0
        "401":
          description: Service claim or browser user session is missing or invalid.
        "422":
          description: Stored handoff cannot be projected into a safe review card.
  /api/v1/chat/interactions/{interaction_id}/repaired-response-handoffs/{repaired_response_handoff_id}:
    get:
      operationId: getAeRepairedResponseHandoff
      tags:
        - Chat
      parameters:
        - name: interaction_id
          in: path
          required: true
          schema:
            type: string
        - name: repaired_response_handoff_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Safe AE repaired response handoff record.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - handoff_schema_version
                  - repaired_response_handoff_id
                  - interaction_id
                properties:
                  handoff_schema_version:
                    const: ae_repaired_response_handoff.v1
                  repaired_response_handoff_id:
                    type: string
                  interaction_id:
                    type: string
        "401":
          description: Service claim or browser user session is missing or invalid.
        "404":
          description: Repaired response handoff was not found for the interaction.
  /api/v1/chat/interactions/{interaction_id}/repaired-response-handoffs/{repaired_response_handoff_id}/review:
    get:
      operationId: getAeRepairedResponseHandoffReview
      tags:
        - Chat
      parameters:
        - name: interaction_id
          in: path
          required: true
          schema:
            type: string
        - name: repaired_response_handoff_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Safe AE Web repaired response review projection.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - projection_schema_version
                  - projection_status
                  - repaired_response_handoff_id
                  - owner_scope
                  - conversation_scope
                  - repaired_response_summary
                  - decision_controls
                  - redaction_summary
                properties:
                  projection_schema_version:
                    const: ae_repaired_response_review_projection.v1
                  projection_status:
                    const: READY_FOR_DECISION
                  repaired_response_handoff_id:
                    type: string
                  owner_scope:
                    type: object
                    additionalProperties: true
                  conversation_scope:
                    type: object
