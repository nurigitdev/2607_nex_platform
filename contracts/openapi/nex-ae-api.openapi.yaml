openapi: 3.1.0
info:
  title: NeX AE API
  version: 0.0.0-slice0003
tags:
  - name: Platform
  - name: Workspace
  - name: Uploads
  - name: Documents
  - name: Compatibility
  - name: Chat
  - name: Retrieval
  - name: Analytics
  - name: Prompts
paths:
  /health:
    get:
      operationId: getAeHealth
      tags:
        - Platform
      responses:
        "200":
          description: Service health status.
  /ready:
    get:
      operationId: getAeReadiness
      tags:
        - Platform
      responses:
        "200":
          description: Service dependencies are ready.
        "503":
          description: One or more service dependencies are unavailable.
  /version:
    get:
      operationId: getAeVersion
      tags:
        - Platform
      responses:
        "200":
          description: Service version metadata.
  /internal/v1/auth/service-claim:
    get:
      operationId: validateAeServiceClaim
      tags:
        - Platform
      responses:
        "200":
          description: Service claim is valid for this service.
        "401":
          description: Service claim is missing or invalid.
  /api/v1/workspaces:
    post:
      operationId: createAeWorkspace
      tags:
        - Workspace
      responses:
        "200":
          description: AE workspace state created with runtime defaults.
        "400":
          description: Workspace request is invalid.
        "401":
          description: Service claim is missing or invalid.
  /api/v1/workspaces/{workspace_id}:
    get:
      operationId: getAeWorkspace
      tags:
        - Workspace
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AE workspace state.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: AE workspace was not found.
  /api/v1/workspaces/{workspace_id}/activity:
    get:
      operationId: listAeWorkspaceActivity
      tags:
        - Workspace
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Safe AE workspace activity entries.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: AE workspace was not found.
  /api/v1/uploads:
    post:
      operationId: createAeUploadHandoff
      tags:
        - Uploads
      responses:
        "200":
          description: CX reported an existing owner-scoped document.
        "202":
          description: Upload handoff accepted and CX ingestion is queued.
        "400":
          description: Upload handoff request is invalid.
        "401":
          description: Service claim is missing or invalid.
        "422":
          description: Upload handoff content metadata is invalid.
        "503":
          description: CX upload registration is unavailable.
  /api/v1/uploads/{upload_handoff_id}:
    get:
      operationId: getAeUploadHandoff
      tags:
        - Uploads
      parameters:
        - name: upload_handoff_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Safe AE upload handoff record.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Upload handoff was not found.
  /api/v1/workspaces/{workspace_id}/documents:
    get:
      operationId: listAeWorkspaceDocuments
      tags:
        - Documents
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Safe AE document library items for a workspace.
        "401":
          description: Service claim is missing or invalid.
        "503":
          description: CX document status is unavailable.
  /api/v1/documents/summary-search:
    get:
      operationId: searchAeDocumentSummaries
      tags:
        - Documents
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Mock lexical summary search results for a workspace.
        "401":
          description: Service claim is missing or invalid.
        "422":
          description: Summary search request is invalid.
        "503":
          description: CX document status is unavailable.
  /api/v1/compatibility/generation-rules:
    get:
      operationId: listAeGenerationCompatibilityRules
      tags:
        - Compatibility
      responses:
        "200":
          description: Active generation compatibility rules visible to AE.
        "401":
          description: Service claim is missing or invalid.
  /api/v1/chat/interactions:
    post:
      operationId: createAeChatInteraction
      tags:
        - Chat
      responses:
        "200":
          description: AE chat interaction created, optionally grounded by CX retrieval, and linked to CX generation when evidence is available.
        "400":
          description: Chat interaction request is invalid.
        "401":
          description: Service claim is missing or invalid.
        "503":
          description: CX retrieval or generation is unavailable.
  /api/v1/chat/interactions/{interaction_id}:
    get:
      operationId: getAeChatInteraction
      tags:
        - Chat
      parameters:
        - name: interaction_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AE chat interaction record.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: AE chat interaction was not found.
  /api/v1/retrieval/contexts:
    post:
      operationId: createAeRetrievalInteraction
      tags:
        - Retrieval
      responses:
        "200":
          description: AE retrieval interaction created and linked to CX retrieval package.
        "400":
          description: Retrieval interaction request is invalid.
        "401":
          description: Service claim is missing or invalid.
        "503":
          description: CX retrieval is unavailable.
  /api/v1/retrieval/contexts/{retrieval_interaction_id}:
    get:
      operationId: getAeRetrievalInteraction
      tags:
        - Retrieval
      parameters:
        - name: retrieval_interaction_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AE retrieval interaction record.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: AE retrieval interaction was not found.
  /api/v1/prompts/bindings:
    get:
      operationId: listAePromptBindings
      tags:
        - Prompts
      responses:
        "200":
          description: Active AE prompt bindings for debug and audit.
        "401":
          description: Service claim is missing or invalid.
  /api/v1/prompts/render-events/{prompt_render_event_id}:
    get:
      operationId: getAePromptRenderEvent
      tags:
        - Prompts
      parameters:
        - name: prompt_render_event_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prompt render event metadata.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Prompt render event was not found.
  /api/v1/analytics/prompt-events/{prompt_event_id}:
    get:
      operationId: getAePromptAnalyticsSnapshot
      tags:
        - Analytics
      parameters:
        - name: prompt_event_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AE prompt analytics snapshot.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Prompt event was not found.
  /api/v1/analytics/users/{user_id}/task-profile:
    get:
      operationId: getAeUserTaskProfile
      tags:
        - Analytics
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: tenant_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: AE user task profile.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: User task profile was not found.
  /api/v1/analytics/users/{user_id}/recommendations:
    get:
      operationId: listAeUserAutomationRecommendations
      tags:
        - Analytics
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: tenant_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Proposed automation recommendations for the user.
        "401":
          description: Service claim is missing or invalid.
