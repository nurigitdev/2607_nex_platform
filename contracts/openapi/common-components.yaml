openapi: 3.1.0
info:
  title: NeX Platform Common Components
  version: 0.0.0-slice0003
paths: {}
components:
  schemas:
    ServiceStatus:
      type: string
      enum:
        - ok
        - degraded
        - unavailable
    ServiceIdentity:
      type: object
      additionalProperties: false
      required:
        - service
        - version
      properties:
        service:
          type: string
        version:
          type: string
    TraceRefs:
      type: object
      additionalProperties: false
      required:
        - trace_id
        - request_id
      properties:
        trace_id:
          type: string
          pattern: ^[0-9a-f]{32}$
        request_id:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        traceparent:
          type: string
          pattern: ^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
        service_id:
          type: string
          enum:
            - nex-oa
            - nex-ag
            - nex-ae-api
            - nex-cx
            - nex-mo
    ProblemJson:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - instance
        - error_code
        - retryable
        - request_id
        - trace_id
        - details
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        error_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        retryable:
          type: boolean
        request_id:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        trace_id:
          type: string
          pattern: ^[0-9a-f]{32}$
        details:
          type: object
    ServiceClaims:
      type: object
      additionalProperties: false
      required:
        - issuer
        - subject
        - audience
        - service_id
        - scopes
        - issued_at
        - expires_at
        - token_use
      properties:
        issuer:
          type: string
          enum:
            - nex-oa
        subject:
          type: string
          pattern: ^service:nex-(oa|ag|ae-api|cx|mo)$
        audience:
          type: string
          enum:
            - nex-oa
            - nex-ag
            - nex-ae-api
            - nex-cx
            - nex-mo
        service_id:
          type: string
          enum:
            - nex-oa
            - nex-ag
            - nex-ae-api
            - nex-cx
            - nex-mo
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z][a-z0-9_-]*(?::[a-z][a-z0-9_-]*)+$
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        token_use:
          type: string
          enum:
            - service
