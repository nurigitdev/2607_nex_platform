openapi: 3.1.0
info:
  title: NeX OA API
  version: 0.0.0-slice1289
tags:
  - name: Platform
  - name: Auth
  - name: Identity Lifecycle
  - name: Credential Security
  - name: Authorization
  - name: Service Principals
  - name: Signed Tokens
paths:
  /health:
    get:
      operationId: getOaHealth
      tags:
        - Platform
      responses:
        "200":
          description: Service health status.
  /ready:
    get:
      operationId: getOaReadiness
      tags:
        - Platform
      responses:
        "200":
          description: Service dependencies are ready.
        "503":
          description: One or more service dependencies are unavailable.
  /version:
    get:
      operationId: getOaVersion
      tags:
        - Platform
      responses:
        "200":
          description: Service version metadata.
  /internal/v1/auth/service-claim:
    get:
      operationId: validateOaServiceClaim
      tags:
        - Platform
      responses:
        "200":
          description: Service claim is valid for this service.
        "401":
          description: Service claim is missing or invalid.
  /internal/v1/auth/federated-login:
    post:
      operationId: createOaFederatedLogin
      tags: [Auth]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FederatedLoginRequest"
      responses:
        "200":
          description: OIDC identity was linked to an active OA session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FederatedLoginResponse"
        "400": {description: Federated login payload is invalid.}
        "401": {description: OIDC provider or token verification failed.}
        "403": {description: External identity is not linked to an active OA subject.}
        "503": {description: OIDC trust documents or OA persistence are unavailable.}
  /internal/v1/auth/user-login:
    post:
      operationId: createOaCredentialUserLogin
      tags: [Auth]
      security:
        - signedServiceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-route-class: CREDENTIAL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OaUserLoginRequest"
      responses:
        "200":
          description: Credential verification created an opaque OA browser session for AE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OaUserLoginResponse"
        "400": {description: Login payload is invalid.}
        "401": {description: Service token or employee credential is invalid.}
        "403": {description: Caller scope or requested user scope is not allowed.}
        "404": {description: Active tenant membership was not found.}
        "503": {description: OA trust or persistence runtime is unavailable.}
  /api/v1/auth/service-token:
    post:
      operationId: exchangeOaClientCredentialToken
      tags: [Signed Tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceTokenExchangeRequest"
      responses:
        "200":
          description: Five-minute RS256 service access token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedTokenResponse"
        "400":
          description: Service token request is invalid.
        "401":
          description: Client credential is invalid or inactive.
        "403":
          description: Requested audience or scope is not allowed.
        "503":
          description: Signing key or external custody is unavailable.
  /api/v1/auth/introspect:
    post:
      operationId: introspectOaSignedServiceToken
      tags: [Signed Tokens]
      security:
        - signedServiceBearer: []
      x-nex-required-scopes: [token:introspect]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenIntrospectionRequest"
      responses:
        "200":
          description: Privacy-bounded signed-token introspection result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenIntrospectionResponse"
        "400": {description: Introspection request is invalid.}
        "401": {description: Caller token is missing or invalid.}
        "403": {description: Caller lacks token introspection scope.}
  /api/v1/auth/revoke:
    post:
      operationId: revokeOaSignedServiceToken
      tags: [Signed Tokens]
      security:
        - signedServiceBearer: []
      x-nex-required-scopes: [token:revoke]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRevocationRequest"
      responses:
        "200":
          description: Token JTI digest was recorded as revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRevocationResponse"
        "400": {description: Revocation request is invalid.}
        "401": {description: Caller or target token is invalid.}
        "403": {description: Caller lacks token revocation scope.}
        "409": {description: Token is expired or already revoked.}
  /.well-known/jwks.json:
    get:
      operationId: getOaSigningJwks
      tags: [Signed Tokens]
      responses:
        "200":
          description: Current public RS256 verification keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedJwks"
  /internal/v1/auth/tenants/{tenant_id}/roles/{role_id}:
    put:
      operationId: upsertOaAuthorizationRole
      tags:
        - Authorization
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - authorization:admin
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/RoleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationRoleUpsert"
      responses:
        "200":
          description: Role definition was created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationMutationResponse"
        "400":
          description: Authorization payload is invalid.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Authorization administration scope is missing.
        "409":
          description: Authorization revision or reference conflicts.
        "503":
          description: Authorization persistence is unavailable.
  /internal/v1/auth/tenants/{tenant_id}/groups/{group_id}:
    put:
      operationId: upsertOaAuthorizationGroup
      tags:
        - Authorization
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - authorization:admin
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationGroupUpsert"
      responses:
        "200":
          description: Group definition was created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationMutationResponse"
        "400":
          description: Authorization payload is invalid.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Authorization administration scope is missing.
        "409":
          description: Authorization revision or reference conflicts.
        "503":
          description: Authorization persistence is unavailable.
  /internal/v1/auth/tenants/{tenant_id}/groups/{group_id}/members/{subject_id}:
    put:
      operationId: upsertOaAuthorizationGroupMember
      tags:
        - Authorization
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - authorization:admin
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/SubjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationAssignmentUpsert"
      responses:
        "200":
          description: Group membership was created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationMutationResponse"
        "400":
          description: Authorization payload is invalid.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Authorization administration scope is missing.
        "409":
          description: Authorization revision or reference conflicts.
        "503":
          description: Authorization persistence is unavailable.
  /internal/v1/auth/tenants/{tenant_id}/groups/{group_id}/roles/{role_id}:
    put:
      operationId: upsertOaAuthorizationGroupRole
      tags:
        - Authorization
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - authorization:admin
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/RoleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationAssignmentUpsert"
      responses:
        "200":
          description: Group role assignment was created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationMutationResponse"
        "400":
          description: Authorization payload is invalid.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Authorization administration scope is missing.
        "409":
          description: Authorization revision or reference conflicts.
        "503":
          description: Authorization persistence is unavailable.
  /internal/v1/auth/tenants/{tenant_id}/subjects/{subject_id}/authorization:
    get:
      operationId: getOaEffectiveAuthorization
      tags:
        - Authorization
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - authorization:read
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/SubjectId"
      responses:
        "200":
          description: Effective direct and group authorization grants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveAuthorizationResponse"
        "400":
          description: Authorization reference is invalid.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Authorization read scope is missing.
        "404":
          description: Membership was not found.
        "503":
          description: Authorization persistence is unavailable.
  /internal/v1/auth/tenants/{tenant_id}/authorization-events:
    get:
      operationId: listOaAuthorizationEvents
      tags:
        - Authorization
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - authorization:read
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Tenant-scoped privacy-safe authorization events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationEventList"
        "400":
          description: Authorization event query is invalid.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Authorization read scope is missing.
        "503":
          description: Authorization persistence is unavailable.
  /internal/v1/subject-registry/ensure:
    post:
      operationId: ensureOaSubjectRegistryEntry
      tags:
        - Authorization
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - identity:bootstrap:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Subject registry entry ensured for compatibility bootstrap.
        "400":
          description: Subject bootstrap payload is invalid.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Identity bootstrap scope is missing.
        "503":
          description: Subject persistence is unavailable.
  /internal/v1/identity/memberships/ensure:
    post:
      operationId: ensureOaIdentityMembership
      tags:
        - Authorization
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - identity:bootstrap:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Tenant membership ensured for compatibility bootstrap.
        "400":
          description: Membership bootstrap payload is invalid.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Identity bootstrap scope is missing.
        "503":
          description: Membership persistence is unavailable.
  /internal/v1/identity/tenants/{tenant_id}/subjects/{subject_id}/lifecycle:
    patch:
      operationId: transitionOaSubjectLifecycle
      tags:
        - Identity Lifecycle
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - identity:lifecycle:write
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/SubjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityLifecycleTransition"
      responses:
        "200":
          description: Subject lifecycle transition result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectLifecycleResponse"
        "400":
          description: Lifecycle payload is invalid.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Required lifecycle scope is missing.
        "404":
          description: Subject lifecycle target was not found.
        "409":
          description: Revision or lifecycle transition conflicts with current state.
  /internal/v1/identity/tenants/{tenant_id}/memberships/{subject_id}/lifecycle:
    patch:
      operationId: transitionOaMembershipLifecycle
      tags:
        - Identity Lifecycle
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - identity:lifecycle:write
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/SubjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityLifecycleTransition"
      responses:
        "200":
          description: Membership lifecycle transition result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipLifecycleResponse"
        "400":
          description: Lifecycle payload is invalid.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Required lifecycle scope is missing.
        "404":
          description: Membership lifecycle target was not found.
        "409":
          description: Revision or lifecycle transition conflicts with current state.
  /internal/v1/auth/local-credentials/change-password:
    post:
      operationId: changeOaLocalCredentialPassword
      tags:
        - Credential Security
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - credential:security:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialPasswordChange"
      responses:
        "200":
          description: Password changed and active sessions revoked atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialRotationResponse"
        "400":
          description: Password change payload is invalid.
        "401":
          description: Service claim or current password is invalid.
        "403":
          description: Required credential security scope is missing.
        "409":
          description: Credential state or password reuse conflicts with the request.
        "503":
          description: Credential security persistence is unavailable.
  /internal/v1/auth/local-credentials/reset-password:
    post:
      operationId: resetOaLocalCredentialPassword
      tags:
        - Credential Security
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - credential:security:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialPasswordReset"
      responses:
        "200":
          description: Temporary password set and active sessions revoked atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialRotationResponse"
        "400":
          description: Password reset payload is invalid.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Required credential security scope is missing.
        "404":
          description: Credential target was not found.
        "409":
          description: Disabled credential requires an identity lifecycle transition.
        "503":
          description: Credential security persistence is unavailable.
  /internal/v1/auth/security-events:
    get:
      operationId: listOaAuthenticationSecurityEvents
      tags:
        - Credential Security
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - credential:security:read
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: subject_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: event_type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AuthEventType"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Tenant-bounded authentication security events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEventListResponse"
        "400":
          description: Event query is invalid.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Required credential security scope is missing.
        "503":
          description: Authentication event persistence is unavailable.
  /internal/v1/service-principals:
    post:
      operationId: upsertOaServicePrincipal
      tags: [Service Principals]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call, service-principal:admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServicePrincipalUpsert"
      responses:
        "200":
          description: Service principal created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePrincipalResponse"
        "400": {description: Service principal payload is invalid.}
        "401": {description: Service claim is missing or invalid.}
        "403": {description: Service principal administration scope is missing.}
        "409": {description: Service principal revision conflicts.}
        "503": {description: Service principal persistence is unavailable.}
    get:
      operationId: listOaServicePrincipals
      tags: [Service Principals]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call, service-principal:read]
      parameters:
        - name: service_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OaServiceId"
      responses:
        "200":
          description: Privacy-safe service principal list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePrincipalList"
        "400": {description: Service principal query is invalid.}
        "401": {description: Service claim is missing or invalid.}
        "403": {description: Service principal read scope is missing.}
        "503": {description: Service principal persistence is unavailable.}
  /internal/v1/service-principals/{principal_id}:
    get:
      operationId: getOaServicePrincipal
      tags: [Service Principals]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call, service-principal:read]
      parameters:
        - $ref: "#/components/parameters/PrincipalId"
      responses:
        "200":
          description: Privacy-safe service principal detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePrincipalResponse"
        "400": {description: Service principal identifier is invalid.}
        "401": {description: Service claim is missing or invalid.}
        "403": {description: Service principal read scope is missing.}
        "404": {description: Service principal was not found.}
        "503": {description: Service principal persistence is unavailable.}
  /internal/v1/service-principals/{principal_id}/status:
    patch:
      operationId: transitionOaServicePrincipalStatus
      tags: [Service Principals]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call, service-principal:admin]
      parameters:
        - $ref: "#/components/parameters/PrincipalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServicePrincipalStatusTransition"
      responses:
        "200":
          description: Service principal status transitioned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePrincipalResponse"
        "400": {description: Status transition payload is invalid.}
        "401": {description: Service claim is missing or invalid.}
        "403": {description: Service principal administration scope is missing.}
        "404": {description: Service principal was not found.}
        "409": {description: Service principal revision conflicts.}
        "503": {description: Service principal persistence is unavailable.}
  /internal/v1/service-principals/{principal_id}/credentials:
    post:
      operationId: issueOaServiceCredential
      tags: [Service Principals]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call, service-principal:admin]
      parameters:
        - $ref: "#/components/parameters/PrincipalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceCredentialIssueRequest"
      responses:
        "200":
          description: Credential issued with a one-time client secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceCredentialIssueResponse"
        "400": {description: Credential issue payload is invalid.}
        "401": {description: Service claim is missing or invalid.}
        "403": {description: Service principal administration scope is missing.}
        "404": {description: Service principal was not found.}
        "409": {description: Active credential limit or principal status conflicts.}
        "503": {description: Service credential persistence is unavailable.}
    get:
      operationId: listOaServiceCredentials
      tags: [Service Principals]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call, service-principal:read]
      parameters:
        - $ref: "#/components/parameters/PrincipalId"
      responses:
        "200":
          description: Privacy-safe service credential list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceCredentialList"
        "400": {description: Service principal identifier is invalid.}
        "401": {description: Service claim is missing or invalid.}
        "403": {description: Service principal read scope is missing.}
        "503": {description: Service credential persistence is unavailable.}
  /internal/v1/service-credentials/{credential_id}:
    get:
      operationId: getOaServiceCredential
      tags: [Service Principals]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call, service-principal:read]
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "200":
          description: Privacy-safe service credential detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceCredentialResponse"
        "400": {description: Credential identifier is invalid.}
        "401": {description: Service claim is missing or invalid.}
        "403": {description: Service principal read scope is missing.}
        "404": {description: Service credential was not found.}
        "503": {description: Service credential persistence is unavailable.}
  /internal/v1/service-credentials/{credential_id}/rotate:
    post:
      operationId: rotateOaServiceCredential
      tags: [Service Principals]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call, service-principal:admin]
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceCredentialRotationRequest"
      responses:
        "200":
          description: Credential rotated with a one-time replacement secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceCredentialRotationResponse"
        "400": {description: Credential rotation payload is invalid.}
        "401": {description: Service claim is missing or invalid.}
        "403": {description: Service principal administration scope is missing.}
        "404": {description: Service credential was not found.}
        "409": {description: Credential revision or active limit conflicts.}
        "503": {description: Service credential persistence is unavailable.}
  /internal/v1/service-credentials/{credential_id}/status:
    patch:
      operationId: transitionOaServiceCredentialStatus
      tags: [Service Principals]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call, service-principal:admin]
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceCredentialStatusTransition"
      responses:
        "200":
          description: Service credential status transitioned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceCredentialResponse"
        "400": {description: Credential status payload is invalid.}
        "401": {description: Service claim is missing or invalid.}
        "403": {description: Service principal administration scope is missing.}
        "404": {description: Service credential was not found.}
