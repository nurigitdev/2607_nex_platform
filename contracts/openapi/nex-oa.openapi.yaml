openapi: 3.1.0
info:
  title: NeX OA API
  version: 0.0.0-slice1239
tags:
  - name: Platform
  - name: Auth
  - name: Identity Lifecycle
  - name: Credential Security
  - name: Authorization
paths:
  /health:
    get:
      operationId: getOaHealth
      tags:
        - Platform
      responses:
        "200":
          description: Service health status.
  /ready:
    get:
      operationId: getOaReadiness
      tags:
        - Platform
      responses:
        "200":
          description: Service dependencies are ready.
        "503":
          description: One or more service dependencies are unavailable.
  /version:
    get:
      operationId: getOaVersion
      tags:
        - Platform
      responses:
        "200":
          description: Service version metadata.
  /internal/v1/auth/service-claim:
    get:
      operationId: validateOaServiceClaim
      tags:
        - Platform
      responses:
        "200":
          description: Service claim is valid for this service.
        "401":
          description: Service claim is missing or invalid.
  /api/v1/auth/service-token:
    post:
      operationId: createMockServiceToken
      tags:
        - Auth
      responses:
        "200":
          description: Mock service token issued.
        "400":
          description: Service token request is invalid.
  /api/v1/auth/introspect:
    post:
      operationId: introspectMockServiceToken
      tags:
        - Auth
      responses:
        "200":
          description: Mock service token introspection result.
  /internal/v1/auth/tenants/{tenant_id}/roles/{role_id}:
    put:
      operationId: upsertOaAuthorizationRole
      tags:
        - Authorization
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - authorization:admin
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/RoleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationRoleUpsert"
      responses:
        "200":
          description: Role definition was created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationMutationResponse"
        "400":
          description: Authorization payload is invalid.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Authorization administration scope is missing.
        "409":
          description: Authorization revision or reference conflicts.
        "503":
          description: Authorization persistence is unavailable.
  /internal/v1/auth/tenants/{tenant_id}/groups/{group_id}:
    put:
      operationId: upsertOaAuthorizationGroup
      tags:
        - Authorization
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - authorization:admin
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationGroupUpsert"
      responses:
        "200":
          description: Group definition was created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationMutationResponse"
        "400":
          description: Authorization payload is invalid.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Authorization administration scope is missing.
        "409":
          description: Authorization revision or reference conflicts.
        "503":
          description: Authorization persistence is unavailable.
  /internal/v1/auth/tenants/{tenant_id}/groups/{group_id}/members/{subject_id}:
    put:
      operationId: upsertOaAuthorizationGroupMember
      tags:
        - Authorization
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - authorization:admin
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/SubjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationAssignmentUpsert"
      responses:
        "200":
          description: Group membership was created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationMutationResponse"
        "400":
          description: Authorization payload is invalid.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Authorization administration scope is missing.
        "409":
          description: Authorization revision or reference conflicts.
        "503":
          description: Authorization persistence is unavailable.
  /internal/v1/auth/tenants/{tenant_id}/groups/{group_id}/roles/{role_id}:
    put:
      operationId: upsertOaAuthorizationGroupRole
      tags:
        - Authorization
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - authorization:admin
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/RoleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationAssignmentUpsert"
      responses:
        "200":
          description: Group role assignment was created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationMutationResponse"
        "400":
          description: Authorization payload is invalid.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Authorization administration scope is missing.
        "409":
          description: Authorization revision or reference conflicts.
        "503":
          description: Authorization persistence is unavailable.
  /internal/v1/auth/tenants/{tenant_id}/subjects/{subject_id}/authorization:
    get:
      operationId: getOaEffectiveAuthorization
      tags:
        - Authorization
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - authorization:read
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/SubjectId"
      responses:
        "200":
          description: Effective direct and group authorization grants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveAuthorizationResponse"
        "400":
          description: Authorization reference is invalid.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Authorization read scope is missing.
        "404":
          description: Membership was not found.
        "503":
          description: Authorization persistence is unavailable.
  /internal/v1/auth/tenants/{tenant_id}/authorization-events:
    get:
      operationId: listOaAuthorizationEvents
      tags:
        - Authorization
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - authorization:read
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Tenant-scoped privacy-safe authorization events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationEventList"
        "400":
          description: Authorization event query is invalid.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Authorization read scope is missing.
        "503":
          description: Authorization persistence is unavailable.
  /internal/v1/subject-registry/ensure:
    post:
      operationId: ensureOaSubjectRegistryEntry
      tags:
        - Authorization
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - identity:bootstrap:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Subject registry entry ensured for compatibility bootstrap.
        "400":
          description: Subject bootstrap payload is invalid.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Identity bootstrap scope is missing.
        "503":
          description: Subject persistence is unavailable.
  /internal/v1/identity/memberships/ensure:
    post:
      operationId: ensureOaIdentityMembership
      tags:
        - Authorization
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - identity:bootstrap:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Tenant membership ensured for compatibility bootstrap.
        "400":
          description: Membership bootstrap payload is invalid.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Identity bootstrap scope is missing.
        "503":
          description: Membership persistence is unavailable.
  /internal/v1/identity/tenants/{tenant_id}/subjects/{subject_id}/lifecycle:
    patch:
      operationId: transitionOaSubjectLifecycle
      tags:
        - Identity Lifecycle
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - identity:lifecycle:write
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/SubjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityLifecycleTransition"
      responses:
        "200":
          description: Subject lifecycle transition result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectLifecycleResponse"
        "400":
          description: Lifecycle payload is invalid.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Required lifecycle scope is missing.
        "404":
          description: Subject lifecycle target was not found.
        "409":
          description: Revision or lifecycle transition conflicts with current state.
  /internal/v1/identity/tenants/{tenant_id}/memberships/{subject_id}/lifecycle:
    patch:
      operationId: transitionOaMembershipLifecycle
      tags:
        - Identity Lifecycle
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - identity:lifecycle:write
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/SubjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityLifecycleTransition"
      responses:
        "200":
          description: Membership lifecycle transition result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipLifecycleResponse"
        "400":
          description: Lifecycle payload is invalid.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Required lifecycle scope is missing.
        "404":
          description: Membership lifecycle target was not found.
        "409":
          description: Revision or lifecycle transition conflicts with current state.
  /internal/v1/auth/local-credentials/change-password:
    post:
      operationId: changeOaLocalCredentialPassword
      tags:
        - Credential Security
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - credential:security:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialPasswordChange"
      responses:
        "200":
          description: Password changed and active sessions revoked atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialRotationResponse"
        "400":
          description: Password change payload is invalid.
        "401":
          description: Service claim or current password is invalid.
        "403":
          description: Required credential security scope is missing.
        "409":
          description: Credential state or password reuse conflicts with the request.
        "503":
          description: Credential security persistence is unavailable.
  /internal/v1/auth/local-credentials/reset-password:
    post:
      operationId: resetOaLocalCredentialPassword
      tags:
        - Credential Security
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - credential:security:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialPasswordReset"
      responses:
        "200":
          description: Temporary password set and active sessions revoked atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialRotationResponse"
        "400":
          description: Password reset payload is invalid.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Required credential security scope is missing.
        "404":
          description: Credential target was not found.
        "409":
          description: Disabled credential requires an identity lifecycle transition.
        "503":
          description: Credential security persistence is unavailable.
  /internal/v1/auth/security-events:
    get:
      operationId: listOaAuthenticationSecurityEvents
      tags:
        - Credential Security
      security:
        - serviceBearer: []
      x-nex-required-scopes:
        - service:call
        - credential:security:read
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: subject_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: event_type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AuthEventType"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Tenant-bounded authentication security events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEventListResponse"
        "400":
          description: Event query is invalid.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Required credential security scope is missing.
        "503":
          description: Authentication event persistence is unavailable.
components:
  parameters:
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    SubjectId:
      name: subject_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    GroupId:
      name: group_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9._-]{1,63}$"
    RoleId:
      name: role_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9._-]{1,63}$"
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: NeX service claim
  schemas:
    AuthorizationRoleUpsert:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_oa/authorization_role_upsert.v1.schema.json
      additionalProperties: false
      required: [scopes, expected_revision]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: [string, "null"]
          maxLength: 512
        status:
          enum: [ACTIVE, DISABLED]
        scopes:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-z][a-z0-9._-]{0,63}:[a-z][a-z0-9._-]{0,63}$"
        metadata:
          type: object
          maxProperties: 32
        expected_revision:
          type: integer
          minimum: 0
    AuthorizationGroupUpsert:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_oa/authorization_group_upsert.v1.schema.json
      additionalProperties: false
      required: [expected_revision]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: [string, "null"]
          maxLength: 512
        status:
          enum: [ACTIVE, DISABLED]
        metadata:
          type: object
          maxProperties: 32
        expected_revision:
          type: integer
          minimum: 0
    AuthorizationAssignmentUpsert:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_oa/authorization_assignment_upsert.v1.schema.json
      additionalProperties: false
      required: [expected_revision]
      properties:
        status:
          enum: [ACTIVE, DISABLED]
        expected_revision:
          type: integer
          minimum: 0
    AuthorizationMutationResponse:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_oa/authorization_mutation_response.v1.schema.json
      additionalProperties: false
      required:
        - response_schema_version
        - service_id
        - record
        - event
        - affected_subject_ids
        - revoked_session_count
        - request_id
        - trace_id
      properties:
        response_schema_version:
          const: oa_authz_mutation_response.v1
        service_id:
          const: nex-oa
        record:
          type: object
        event:
          type: object
        affected_subject_ids:
          type: array
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
        revoked_session_count:
          type: integer
          minimum: 0
        request_id:
          type: string
        trace_id:
          type: string
    EffectiveAuthorizationResponse:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_oa/effective_authorization_response.v1.schema.json
      additionalProperties: false
      required: [response_schema_version, service_id, authorization, request_id, trace_id]
      properties:
        response_schema_version:
          const: oa_authz_read_response.v1
        service_id:
          const: nex-oa
        authorization:
          type: object
        request_id:
          type: string
        trace_id:
          type: string
    AuthorizationEventList:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_oa/authorization_event_list.v1.schema.json
      additionalProperties: false
      required: [event_list_schema_version, service_id, tenant_id, events, count, request_id, trace_id]
      properties:
        event_list_schema_version:
          const: oa_authz_event_list.v1
        service_id:
          const: nex-oa
        tenant_id:
          type: string
        events:
          type: array
          maxItems: 500
          items:
            type: object
        count:
          type: integer
          minimum: 0
          maximum: 500
        request_id:
          type: string
        trace_id:
          type: string
    CredentialPasswordChange:
      type: object
      additionalProperties: false
      required: [tenant_id, employee_id, current_password, new_password]
      properties:
        tenant_id:
          type: string
          minLength: 1
          maxLength: 128
        employee_id:
          type: string
          minLength: 1
          maxLength: 128
        current_password:
          type: string
          minLength: 8
          maxLength: 256
          writeOnly: true
        new_password:
          type: string
          minLength: 8
          maxLength: 256
          writeOnly: true
    CredentialPasswordReset:
      type: object
      additionalProperties: false
      required: [tenant_id, employee_id, temporary_password, reason_code]
      properties:
        tenant_id:
          type: string
          minLength: 1
          maxLength: 128
        employee_id:
          type: string
          minLength: 1
          maxLength: 128
        temporary_password:
          type: string
          minLength: 8
          maxLength: 256
          writeOnly: true
        reason_code:
          type: string
          pattern: "^[a-z][a-z0-9_.-]{1,127}$"
    CredentialRotationResponse:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_oa/credential_rotation.v1.schema.json
      additionalProperties: false
      required:
        - credential_rotation_schema_version
        - service_id
        - operation
        - tenant_ref
        - subject_ref
        - credential_id
        - credential_status
        - password_changed_at
        - revoked_session_count
        - reason_code
        - metadata
        - request_id
        - trace_id
      properties:
        credential_rotation_schema_version:
          const: oa_credential_rotation.v1
        service_id:
          const: nex-oa
        operation:
          enum: [PASSWORD_CHANGED, PASSWORD_RESET]
        tenant_ref:
          type: object
        subject_ref:
          type: object
        credential_id:
          type: string
        credential_status:
          enum: [ACTIVE, PASSWORD_RESET_REQUIRED]
        password_changed_at:
          type: string
          format: date-time
        revoked_session_count:
          type: integer
          minimum: 0
        reason_code:
          type: string
        metadata:
          type: object
        request_id:
          type: string
        trace_id:
          type: string
    AuthEventType:
      type: string
      enum:
        - LOGIN_SUCCEEDED
        - LOGIN_FAILED
        - PASSWORD_CHANGED
        - PASSWORD_RESET
        - SESSION_ISSUED
        - SESSION_INTROSPECTED
        - SESSION_REVOKED
    AuthEventListResponse:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_oa/auth_event_list.v1.schema.json
      additionalProperties: false
      required:
        - auth_event_list_schema_version
        - service_id
        - tenant_ref
        - events
        - count
        - request_id
        - trace_id
      properties:
        auth_event_list_schema_version:
          const: oa_auth_event_list.v1
        service_id:
          const: nex-oa
        tenant_ref:
          type: object
        events:
          type: array
          maxItems: 200
          items:
            type: object
        count:
          type: integer
          minimum: 0
          maximum: 200
        request_id:
          type: string
        trace_id:
          type: string
    IdentityLifecycleTransition:
      type: object
      additionalProperties: false
      required:
        - target_status
        - expected_revision
      properties:
        target_status:
          type: string
          enum: [ACTIVE, DISABLED, DELETED]
        expected_revision:
          type: integer
          minimum: 1
        reason_code:
          type: string
          pattern: "^[a-z][a-z0-9_.-]{1,63}$"
    SubjectLifecycleResponse:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_oa/subject_lifecycle_response.v1.schema.json
      additionalProperties: false
      required:
        - response_schema_version
        - lifecycle_schema_version
        - entity_type
        - tenant_id
        - subject_id
        - status
        - revision
        - changed
        - revoked_session_count
        - event
        - request_id
        - trace_id
      properties:
        response_schema_version:
          const: oa_subject_lifecycle_response.v1
        lifecycle_schema_version:
          const: oa_identity_lifecycle.v1
        entity_type:
          const: SUBJECT
        tenant_id:
          type: string
        subject_id:
          type: string
        status:
          enum: [ACTIVE, DISABLED, DELETED]
        revision:
          type: integer
          minimum: 1
        changed:
          type: boolean
        revoked_session_count:
          type: integer
          minimum: 0
        event:
          type: [object, "null"]
        request_id:
          type: string
        trace_id:
          type: string
    MembershipLifecycleResponse:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_oa/membership_lifecycle_response.v1.schema.json
      additionalProperties: false
      required:
        - response_schema_version
        - lifecycle_schema_version
        - entity_type
        - tenant_id
        - subject_id
        - status
        - revision
        - changed
        - revoked_session_count
        - event
        - request_id
        - trace_id
      properties:
        response_schema_version:
          const: oa_membership_lifecycle_response.v1
        lifecycle_schema_version:
          const: oa_identity_lifecycle.v1
        entity_type:
          const: MEMBERSHIP
        tenant_id:
          type: string
        subject_id:
          type: string
        status:
          enum: [ACTIVE, DISABLED]
        revision:
          type: integer
          minimum: 1
        changed:
          type: boolean
        revoked_session_count:
          type: integer
          minimum: 0
        event:
          type: [object, "null"]
        request_id:
          type: string
        trace_id:
          type: string
