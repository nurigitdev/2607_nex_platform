openapi: 3.1.0
info:
  title: NeX CX API
  version: 0.96.0
  x-nex-owner-context:
    propagation: trusted-service-asserted-subject
    requiredHeaders:
      - X-NEX-Tenant-ID
      - X-NEX-Subject-ID
    crossOwnerVisibility: not-found
tags:
  - name: Platform
  - name: Content
  - name: Generation
  - name: Compatibility
  - name: Recovery
  - name: Prompts
  - name: InternalJobControl
  - name: InternalServiceLogs
  - name: InternalIngestion
paths:
  /health:
    get:
      operationId: getCxHealth
      tags:
        - Platform
      responses:
        "200":
          description: Service health status.
  /ready:
    get:
      operationId: getCxReadiness
      tags:
        - Platform
      responses:
        "200":
          description: Service dependencies are ready.
        "503":
          description: One or more service dependencies are unavailable.
  /version:
    get:
      operationId: getCxVersion
      tags:
        - Platform
      responses:
        "200":
          description: Service version metadata.
  /internal/v1/auth/service-claim:
    get:
      operationId: validateCxServiceClaim
      tags:
        - Platform
      responses:
        "200":
          description: Service claim is valid for this service.
        "401":
          description: Service claim is missing or invalid.
  /internal/v1/service-logs/retention/purge:
    post:
      operationId: purgeCxServiceLogRetention
      tags:
        - InternalServiceLogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - retention_cutoff
              properties:
                retention_cutoff:
                  type: string
                  format: date-time
                retention_days:
                  type: integer
                  minimum: 1
                checked_at:
                  type: string
                  format: date-time
                dry_run:
                  type: boolean
                  default: true
                delete_enabled:
                  type: boolean
                  default: false
                max_delete_count:
                  type: integer
                  minimum: 1
                requested_by:
                  type: object
                  additionalProperties: true
                idempotency_key:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Guarded service log retention execution evidence.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - retention_execution_schema_version
                  - service_id
                  - mode
                  - execution_status
                  - candidate_count
                  - deleted_count
                properties:
                  retention_execution_schema_version:
                    type: string
                    const: service_log_retention_execution.v1
                  service_id:
                    type: string
                    const: nex-cx
                  mode:
                    type: string
                    enum:
                      - DRY_RUN
                      - EXECUTE
                  execution_status:
                    type: string
                    enum:
                      - SUCCEEDED
                      - BLOCKED
                      - FAILED
                  candidate_count:
                    type: integer
                    minimum: 0
                  deleted_count:
                    type: integer
                    minimum: 0
        "401":
          description: Service claim is missing or invalid.
        "422":
          description: Retention purge payload is invalid.
        "503":
          description: Service log store is unavailable.
  /internal/v1/jobs/{job_id}:
    get:
      operationId: getCxServiceJobControlJob
      tags:
        - InternalJobControl
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Payload-redacted service-local job control projection.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - job_control_schema_version
                  - service_id
                  - action
                  - job
                  - controls
                properties:
                  job_control_schema_version:
                    type: string
                    const: service_job_control.v1
                  service_id:
                    type: string
                    const: nex-cx
                  action:
                    type: string
                    const: read
                  job:
                    type: object
                    additionalProperties: true
                  controls:
                    type: object
                    additionalProperties: true
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Job was not found.
  /internal/v1/jobs/{job_id}/cancel:
    post:
      operationId: cancelCxServiceJob
      tags:
        - InternalJobControl
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                observed_at:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Active CX job was cancelled through service-local job control.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Job was not found.
        "409":
          description: Job cannot transition to cancelled.
        "422":
          description: Job control payload is invalid.
  /internal/v1/jobs/{job_id}/retry:
    post:
      operationId: retryCxServiceJob
      tags:
        - InternalJobControl
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                error_code:
                  type: string
                  minLength: 1
                detail:
                  type: string
                  minLength: 1
                observed_at:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Running CX job was requeued or dead-lettered through service-local retry policy.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Job was not found.
        "409":
          description: Job cannot be retried from its current status.
        "422":
          description: Job control payload is invalid.
  /internal/v1/jobs/{job_id}/replay:
    post:
      operationId: replayCxServiceJob
      tags:
        - InternalJobControl
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - replay_job_id
                - idempotency_key
                - requested_by
                - reason
              properties:
                replay_job_id:
                  type: string
                  minLength: 1
                idempotency_key:
                  type: string
                  minLength: 1
                requested_by:
                  type: string
                  minLength: 1
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                observed_at:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Dead-letter CX job was replayed as a new queued service-local job.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Source job was not found.
        "409":
          description: Source job is not replayable or replay idempotency conflicts.
        "422":
          description: Replay payload is invalid.
  /api/v1/ingestion-runs/{run_id}:
    get:
      operationId: getCxOwnerScopedIngestionRun
      tags:
        - Content
      parameters:
        - $ref: "#/components/parameters/CxTenantId"
        - $ref: "#/components/parameters/CxSubjectId"
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Owner-scoped, private-payload-free durable ingestion run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CxIngestionRunReadModel"
        "401":
          description: Service claim or owner context is missing or invalid.
        "404":
          description: Ingestion run was not found or is not visible to the owner.
        "503":
          description: Durable ingestion persistence is unavailable.
  /api/v1/documents/{document_id}/ingestion-runs:
    get:
      operationId: listCxOwnerScopedDocumentIngestionRuns
      tags:
        - Content
      parameters:
        - $ref: "#/components/parameters/CxTenantId"
        - $ref: "#/components/parameters/CxSubjectId"
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Owner-scoped durable ingestion history for one document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CxIngestionRunCollection"
        "401":
          description: Service claim or owner context is missing or invalid.
        "503":
          description: Durable ingestion persistence is unavailable.
  /internal/v1/ingestion/restart-plan:
    get:
      operationId: getCxIngestionRestartPlan
      tags:
        - InternalIngestion
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Read-only durable queue/run restart classification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CxIngestionRestartPlan"
        "401":
          description: Service claim is missing or invalid.
        "422":
          description: Restart plan limit is invalid.
        "503":
          description: Job queue or durable run persistence is unavailable.
  /internal/v1/ingestion/jobs/{job_id}/recover-expired-lease:
    post:
      operationId: recoverCxExpiredIngestionLease
      tags:
        - InternalIngestion
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Expired ingestion lease was recovered and safely observed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CxIngestionRecovery"
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Job or durable ingestion run was not found.
        "409":
          description: Job is not running or its lease has not expired.
        "503":
          description: Job queue or durable run persistence is unavailable.
  /api/v1/vector-indexes/{vector_index_id}/readiness:
    get:
      operationId: getCxOwnerScopedVectorIndexReadiness
      tags:
        - Content
      parameters:
        - $ref: "#/components/parameters/CxTenantId"
        - $ref: "#/components/parameters/CxSubjectId"
        - name: vector_index_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Owner-scoped persisted and evaluated vector index readiness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CxVectorIndexReadiness"
        "401":
          description: Service claim or owner context is missing or invalid.
        "404":
          description: Vector index was not found or is not visible to the owner.
        "503":
          description: Vector manifest or pgvector persistence is unavailable.
  /api/v1/vector-indexes/{vector_index_id}/readiness/reconcile:
    post:
      operationId: reconcileCxOwnerScopedVectorIndexReadiness
      tags:
        - Content
      parameters:
        - $ref: "#/components/parameters/CxTenantId"
        - $ref: "#/components/parameters/CxSubjectId"
        - name: vector_index_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CxVectorIndexReconciliationRequest"
      responses:
        "200":
          description: Explicit vector freshness reconciliation result and observability summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CxVectorIndexReconciliationResponse"
        "401":
          description: Service claim or owner context is missing or invalid.
        "404":
          description: Vector index was not found or is not visible to the owner.
        "409":
          description: Vector manifest checkpoint changed concurrently.
        "422":
          description: Source snapshot, embedding profile, or timestamp is invalid.
        "503":
          description: Vector manifest or pgvector persistence is unavailable.
  /api/v1/documents:
    parameters: &cxOwnerContextParameters
      - $ref: "#/components/parameters/CxTenantId"
      - $ref: "#/components/parameters/CxSubjectId"
    get:
      operationId: listCxOwnerScopedDocuments
      tags:
        - Content
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
          description: Legacy compatibility alias for tenant_ref.id.
        - name: owner_user_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
          description: Legacy compatibility alias for owner_subject_ref.id.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Owner-scoped active CX document library projection.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - projection_schema_version
                  - service_id
                  - filters
                  - pagination
                  - documents
                  - metadata
                properties:
                  projection_schema_version:
                    type: string
                    const: cx_document_library_projection.v1
                  service_id:
                    type: string
                    const: nex-cx
                  filters:
                    type: object
                    additionalProperties: true
                  pagination:
                    type: object
                    additionalProperties: true
                  documents:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  metadata:
                    type: object
                    additionalProperties: true
                    required:
                      - raw_source_included
                      - raw_summary_included
                      - embedding_vector_included
                      - storage_path_redacted
                    properties:
                      raw_source_included:
                        type: boolean
                        const: false
                      raw_summary_included:
                        type: boolean
                        const: false
                      embedding_vector_included:
                        type: boolean
                        const: false
                      storage_path_redacted:
                        type: boolean
                        const: true
        "400":
          description: Document library query parameters are invalid.
        "401":
          description: Service claim is missing or invalid.
        "503":
          description: CX content repository is unavailable.
  /api/v1/documents/uploads:
    parameters: *cxOwnerContextParameters
    post:
      operationId: registerCxDocumentUpload
      tags:
        - Content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - filename
              properties:
                filename:
                  type: string
                  minLength: 1
                  maxLength: 255
                content_type:
                  type: string
                  minLength: 1
                size_bytes:
                  type: integer
                  minimum: 0
                source_sha256:
                  type: string
                  pattern: ^[0-9A-Fa-f]{64}$
                content_text:
                  type: string
                content_base64:
                  type: string
                  minLength: 1
                tenant_id:
                  type: string
                  minLength: 1
                owner_user_id:
                  type: string
                  minLength: 1
                user_id:
                  type: string
                  minLength: 1
                uploaded_by_user_id:
                  type: string
                  minLength: 1
                tenant_ref:
                  type: object
                  additionalProperties: false
                  required:
                    - type
                    - id
                  properties:
                    type:
                      type: string
                      const: oa.tenant
                    id:
                      type: string
                      minLength: 1
                owner_subject_ref:
                  type: object
                  additionalProperties: false
                  required:
                    - type
                    - id
                  properties:
                    type:
                      type: string
                      const: oa.user
                    id:
                      type: string
                      minLength: 1
                uploaded_by_subject_ref:
                  type: object
                  additionalProperties: false
                  required:
                    - type
                    - id
                  properties:
                    type:
                      type: string
                      const: oa.user
                    id:
                      type: string
                      minLength: 1
                ownership_ref:
                  type: object
                  additionalProperties: false
                  properties:
                    ownership_schema_version:
                      type: string
                      const: cx_source_ownership_ref.v1
                    tenant_ref:
                      type: object
                      additionalProperties: false
                      required:
                        - type
                        - id
                      properties:
                        type:
                          type: string
                          const: oa.tenant
                        id:
                          type: string
                          minLength: 1
                    owner_subject_ref:
                      type: object
                      additionalProperties: false
                      required:
                        - type
                        - id
                      properties:
                        type:
                          type: string
                          const: oa.user
                        id:
                          type: string
                          minLength: 1
                    uploaded_by_subject_ref:
                      type: object
                      additionalProperties: false
                      required:
                        - type
                        - id
                      properties:
                        type:
                          type: string
                          const: oa.user
                        id:
                          type: string
                          minLength: 1
                    legacy:
                      type: object
                      additionalProperties: false
                      properties:
                        tenant_id:
                          type: string
                          minLength: 1
                        owner_user_id:
                          type: string
                          minLength: 1
                    compatibility_mode:
                      type: string
                      const: legacy_owner_fields_mapped_to_oa_subject_refs
                trace_id:
                  type: string
                  pattern: ^[0-9a-f]{32}$
      responses:
        "200":
          description: Owner-scoped duplicate upload already exists.
        "202":
          description: Document upload was registered and an ingestion job was queued.
        "401":
          description: Service claim is missing or invalid.
        "422":
          description: Upload metadata is invalid or unsafe.
  /api/v1/documents/{document_id}:
    parameters: *cxOwnerContextParameters
    get:
      operationId: getCxDocumentDetail
      tags:
        - Content
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: owner_user_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Owner-scoped CX document detail projection.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - projection_schema_version
                  - service_id
                  - source
                  - filters
                  - document
                  - boundary_audit
                  - metadata
                properties:
                  projection_schema_version:
                    const: cx_document_detail_projection.v1
                  service_id:
                    const: nex-cx
                  source:
                    type: object
                    additionalProperties: false
                    required:
                      - source_kind
                      - database_env
                      - redacted_database_url
                    properties:
                      source_kind:
                        type: string
                        minLength: 1
                      database_env:
                        oneOf:
                          - type: string
                            minLength: 1
                          - type: "null"
                      redacted_database_url:
                        oneOf:
                          - type: string
                            pattern: ^postgresql(\+psycopg)?://[^:]+:\*\*\*@.+$
                          - type: "null"
                  filters:
                    type: object
                    additionalProperties: false
                    required:
                      - filter_schema_version
                      - document_ref
                      - tenant_ref
                      - owner_subject_ref
                      - lifecycle_status
                    properties:
                      filter_schema_version:
                        const: cx_document_detail_query_filters.v1
                      document_ref:
                        type: object
                        additionalProperties: false
                        required:
                          - type
                          - id
                        properties:
                          type:
                            const: cx.document
                          id:
                            type: string
                            minLength: 1
                      tenant_ref:
                        type: object
                        additionalProperties: false
                        required:
                          - type
                          - id
                        properties:
                          type:
                            const: oa.tenant
                          id:
                            type: string
                            minLength: 1
                      owner_subject_ref:
                        type: object
                        additionalProperties: false
                        required:
                          - type
                          - id
                        properties:
                          type:
                            const: oa.user
                          id:
                            type: string
                            minLength: 1
                      lifecycle_status:
                        const: ACTIVE
                  document:
                    type: object
                    additionalProperties: false
                    required:
                      - document_detail_schema_version
                      - document_id
                      - upload_id
                      - tenant_ref
                      - owner_subject_ref
                      - uploaded_by_subject_ref
                      - filename
                      - content_type
                      - size_bytes
                      - source_sha256
                      - classification
                      - lifecycle_status
                      - retrieval_policy
                      - created_at
                      - updated_at
                      - summary
                      - summary_embedding
                      - processing
                      - links
                      - metadata
                      - source_lineage
                      - upload
                      - extraction
                      - boundary_audit
                    properties:
                      document_detail_schema_version:
                        const: cx_document_detail_item.v1
                      document_id:
                        type: string
                        minLength: 1
                      upload_id:
                        type: string
                        minLength: 1
                      filename:
                        type: string
                        pattern: ^[^/\\]{1,255}$
                      content_type:
                        type: string
                        minLength: 1
                      size_bytes:
                        type: integer
                        minimum: 0
                      source_sha256:
                        type: string
                        pattern: ^[0-9a-f]{64}$
                      classification:
                        type: string
                        minLength: 1
                      lifecycle_status:
                        const: ACTIVE
                      retrieval_policy:
                        type: object
                        additionalProperties: true
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                      tenant_ref:
                        type: object
                        additionalProperties: false
                        required:
                          - type
                          - id
                        properties:
                          type:
                            const: oa.tenant
                          id:
                            type: string
                            minLength: 1
                      owner_subject_ref:
                        type: object
                        additionalProperties: false
                        required:
                          - type
                          - id
                        properties:
                          type:
                            const: oa.user
                          id:
                            type: string
                            minLength: 1
                      uploaded_by_subject_ref:
                        type: object
                        additionalProperties: false
                        required:
                          - type
                          - id
                        properties:
                          type:
                            const: oa.user
                          id:
                            type: string
                            minLength: 1
                      source_lineage:
                        type: object
                        additionalProperties: false
                        required:
                          - source_file_id
                          - source_sha256
                          - content_type
                          - size_bytes
                          - storage_backend
                          - storage_key_included
                          - storage_uri_included
                          - storage_path_included
                        properties:
                          source_file_id:
                            oneOf:
                              - type: string
                                minLength: 1
                              - type: "null"
                          source_sha256:
                            type: string
                            pattern: ^[0-9a-f]{64}$
                          content_type:
                            type: string
                            minLength: 1
                          size_bytes:
                            type: integer
                            minimum: 0
                          storage_backend:
                            type: "null"
                          storage_key_included:
                            const: false
                          storage_uri_included:
                            const: false
                          storage_path_included:
                            const: false
                      upload:
                        type: object
                        additionalProperties: false
                        required:
                          - available
                          - upload_id
                          - request_id
                          - trace_id
                          - dedupe_status
                          - existing_document_id
                          - payload_source
                          - source_content_in_record
                        properties:
                          available:
                            type: boolean
                          upload_id:
                            oneOf:
                              - type: string
                                minLength: 1
                              - type: "null"
                          request_id:
                            oneOf:
                              - type: string
                                minLength: 1
                              - type: "null"
                          trace_id:
                            oneOf:
                              - type: string
                                pattern: ^[0-9a-f]{32}$
                              - type: "null"
                          dedupe_status:
                            oneOf:
                              - type: string
                                minLength: 1
                              - type: "null"
                          existing_document_id:
                            oneOf:
                              - type: string
                                minLength: 1
                              - type: "null"
                          payload_source:
                            oneOf:
                              - type: string
                                minLength: 1
                              - type: "null"
                          source_content_in_record:
                            const: false
                      extraction:
                        type: object
                        additionalProperties: false
                        required:
                          - available
                          - job_id
                          - status
                          - markdown_available
                        properties:
                          available:
                            type: boolean
                          job_id:
                            oneOf:
                              - type: string
                                minLength: 1
                              - type: "null"
                          status:
                            type: string
                            minLength: 1
                          markdown_available:
                            type: boolean
                      summary:
                        type: object
                        additionalProperties: true
                      summary_embedding:
                        type: object
                        additionalProperties: true
                      processing:
                        type: object
                        additionalProperties: true
                      links:
                        type: object
                        additionalProperties: true
                      metadata:
                        type: object
                        additionalProperties: true
                      boundary_audit:
                        type: object
                        additionalProperties: true
                  boundary_audit:
                    type: object
                    additionalProperties: false
                    required:
                      - audit_schema_version
                      - legacy_route
                      - projection
