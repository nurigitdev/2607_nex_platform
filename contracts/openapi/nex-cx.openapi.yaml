                      - parent_cx_generation_id
                      - execution_status
                    properties:
                      result_schema_version:
                        const: cx_remediation_execution_result.v1
                      remediation_action_id:
                        type: string
                      parent_cx_generation_id:
                        type: string
                      execution_status:
                        type: string
                        enum:
                          - ACCEPTED
                          - RUNNING
                          - SUCCEEDED
                          - FAILED
                          - CANCELLED
                  repaired_generation_lineage:
                    type: object
                    additionalProperties: false
                    required:
                      - lineage_schema_version
                      - lineage_status
                      - parent_cx_generation_id
                      - root_cx_generation_id
                      - repair_cx_generation_id
                      - remediation_action_id
                      - action_type
                      - lineage_type
                      - execution_status
                      - attempt_no
                      - result_ref
                      - diagnostics
                      - debug_paths
                      - redaction_summary
                    properties:
                      lineage_schema_version:
                        const: cx_repaired_generation_lineage.v1
                      lineage_status:
                        type: string
                        enum:
                          - PENDING_REPAIR_GENERATION
                          - LINKED
                          - TERMINAL_WITHOUT_REPAIR
                          - INCONSISTENT
                      parent_cx_generation_id:
                        type: string
                      root_cx_generation_id:
                        type: string
                      repair_cx_generation_id:
                        type:
                          - string
                          - "null"
                      remediation_action_id:
                        type: string
                      action_type:
                        type: string
                        enum:
                          - retry_generation
                          - retrieval_repair
                          - citation_repair
                      lineage_type:
                        type: string
                        enum:
                          - retry
                          - fresh_retrieval_regenerate
                          - repair
                      execution_status:
                        type: string
                        enum:
                          - ACCEPTED
                          - RUNNING
                          - SUCCEEDED
                          - FAILED
                          - CANCELLED
                      attempt_no:
                        type: integer
                        minimum: 1
                      result_ref:
                        type:
                          - object
                          - "null"
                        additionalProperties: false
                        required:
                          - source_service
                          - ref_type
                          - ref_id
                          - relation
                        properties:
                          source_service:
                            const: nex-cx
                          ref_type:
                            const: repair_execution
                          ref_id:
                            type: string
                          relation:
                            const: result_of
                      diagnostics:
                        type: object
                        additionalProperties: false
                        required:
                          - lineage_consistent
                          - repair_generation_linked
                          - result_ref_present
                          - result_ref_matches_remediation_action
                          - parent_generation_mutated
                        properties:
                          lineage_consistent:
                            type: boolean
                          repair_generation_linked:
                            type: boolean
                          result_ref_present:
                            type: boolean
                          result_ref_matches_remediation_action:
                            type: boolean
                          parent_generation_mutated:
                            const: false
                      debug_paths:
                        type: object
                        additionalProperties: false
                        required:
                          - parent_generation_path
                          - root_generation_path
                          - repair_generation_path
                          - cx_remediation_execution_path
                        properties:
                          parent_generation_path:
                            type: string
                          root_generation_path:
                            type: string
                          repair_generation_path:
                            type:
                              - string
                              - "null"
                          cx_remediation_execution_path:
                            type: string
                      redaction_summary:
                        type: object
                        additionalProperties: false
                        required:
                          - raw_content_included
                          - prompt_text_included
                          - evidence_text_included
                          - provider_detail_included
                        properties:
                          raw_content_included:
                            const: false
                          prompt_text_included:
                            const: false
                          evidence_text_included:
                            const: false
                          provider_detail_included:
                            const: false
                  attention_required:
                    type: boolean
                  debug_paths:
                    type: object
                    additionalProperties: false
                    required:
                      - cx_remediation_execution_path
                      - cx_remediation_execution_list_path
                    properties:
                      cx_remediation_execution_path:
                        type: string
                      cx_remediation_execution_list_path:
                        type: string
                  redaction_summary:
                    type: object
                    additionalProperties: false
                    required:
                      - raw_content_included
                      - prompt_text_included
                      - evidence_text_included
                      - provider_detail_included
                    properties:
                      raw_content_included:
                        const: false
                      prompt_text_included:
                        const: false
                      evidence_text_included:
                        const: false
                      provider_detail_included:
                        const: false
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: CX remediation execution was not found.
        "503":
          description: CX remediation execution store is unavailable.
  /api/v1/prompts/bindings:
    get:
      operationId: listCxPromptBindings
      tags:
        - Prompts
      responses:
        "200":
          description: Active CX prompt bindings for debug and audit.
        "401":
          description: Service claim is missing or invalid.
  /api/v1/prompts/render-events/{prompt_render_event_id}:
    get:
      operationId: getCxPromptRenderEvent
      tags:
        - Prompts
      parameters:
        - name: prompt_render_event_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prompt render event metadata.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Prompt render event was not found.
components:
  parameters:
    CxTenantId:
      name: X-NEX-Tenant-ID
      in: header
      required: true
      description: OA tenant identifier asserted by an authorized platform service.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:@-]{0,127}$'
    CxSubjectId:
      name: X-NEX-Subject-ID
      in: header
      required: true
      description: OA user identifier asserted by an authorized platform service.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:@-]{0,127}$'
  schemas:
    CxGenerationReadModel:
      type: object
      additionalProperties: false
      required:
        - read_model_schema_version
        - record_schema_version
        - cx_generation_id
        - tenant_ref_type
        - tenant_ref_id
        - owner_subject_ref_type
        - owner_subject_ref_id
        - status
        - retrieval_package_id
        - trace_id
        - request_id
        - alias
        - provider_capability
        - mo_generation_id
        - request_metadata
        - response_metadata
        - mo_runtime_metadata
        - usage
        - failure
        - recovery_lineage
        - created_at
        - updated_at
        - content_ref
      properties:
        read_model_schema_version: {const: cx_generation_read_model.v1}
        record_schema_version: {const: cx_generation_execution_record.v1}
        cx_generation_id: {type: string, minLength: 1}
        tenant_ref_type: {type: string, minLength: 1}
        tenant_ref_id: {type: string, minLength: 1}
        owner_subject_ref_type: {type: string, minLength: 1}
        owner_subject_ref_id: {type: string, minLength: 1}
        status: {type: string, enum: [COMPLETED, FAILED]}
        retrieval_package_id: {type: [string, "null"], minLength: 1}
        trace_id: {type: string, pattern: '^[0-9a-f]{32}$'}
        request_id: {type: string, minLength: 1}
        alias: {type: string, minLength: 1}
        provider_capability: {const: generation}
        mo_generation_id: {type: [string, "null"], minLength: 1}
        request_metadata:
          type: object
          additionalProperties: false
          properties:
            provider_prompt_package_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
            generation_request_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
            response_format_type: {type: string, enum: [text, json_object, json_schema]}
            source_has_messages: {type: boolean}
            source_has_prompt: {type: boolean}
            compatibility_rule_id: {type: [string, "null"]}
            grounding_required: {type: boolean}
            retrieval_package_id: {type: [string, "null"]}
            retrieval_package_hash: {type: [string, "null"], pattern: '^[0-9a-f]{64}$'}
            selected_evidence_count: {type: integer, minimum: 0}
            structured_draft_id: {type: [string, "null"]}
            draft_validation_status: {type: [string, "null"]}
            grounded_response_quality_audit_schema_version: {type: [string, "null"]}
            grounded_response_quality_status: {type: [string, "null"]}
            grounded_response_quality_issue_count: {type: [integer, "null"], minimum: 0}
        response_metadata:
          type: object
          additionalProperties: false
          properties:
            finish_reason: {type: [string, "null"]}
            output_hash: {type: [string, "null"], pattern: '^[0-9a-f]{64}$'}
        mo_runtime_metadata:
          type: object
          additionalProperties: false
          properties:
            request_id: {type: string}
            trace_id: {type: string}
            queue_ms: {type: integer, minimum: 0}
            provider_ms: {type: integer, minimum: 0}
            total_ms: {type: integer, minimum: 0}
            route_id: {type: string}
            admission_decision: {type: string}
            provider_request_id: {type: string}
        usage:
          type: object
          additionalProperties: false
          properties:
            prompt_tokens: {type: integer, minimum: 0}
            completion_tokens: {type: integer, minimum: 0}
            input_tokens: {type: integer, minimum: 0}
            output_tokens: {type: integer, minimum: 0}
            total_tokens: {type: integer, minimum: 0}
        failure: {type: [object, "null"], additionalProperties: true}
        recovery_lineage: {type: [object, "null"], additionalProperties: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        content_ref:
          type: object
          additionalProperties: false
          required: [available, content_sha256, size_bytes]
          properties:
            available: {type: boolean}
            content_sha256: {type: [string, "null"], pattern: '^[0-9a-f]{64}$'}
            size_bytes: {type: [integer, "null"], minimum: 1}
    CxGenerationContent:
      type: object
      additionalProperties: false
      required:
        - content_schema_version
        - cx_generation_id
        - content_type
        - content
        - content_sha256
        - size_bytes
        - owner_scope_enforced
      properties:
        content_schema_version: {const: cx_generation_content.v1}
        cx_generation_id: {type: string, minLength: 1}
        content_type: {const: "text/plain; charset=utf-8"}
        content: {type: string, minLength: 1}
        content_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        size_bytes: {type: integer, minimum: 1}
        owner_scope_enforced: {const: true}
    CxDocumentIntelligenceObservability:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok: {type: boolean}
        event_id: {type: string, format: uuid}
        service_id: {const: nex-cx}
        event_type: {type: string, minLength: 1}
        severity: {type: string, enum: [INFO, WARNING, ERROR, CRITICAL]}
        error_code: {type: string, minLength: 1}
        detail: {type: string, minLength: 1}
        status_code: {type: integer, minimum: 400, maximum: 599}
      allOf:
        - if:
            properties:
              ok: {const: true}
          then:
            required: [event_id, service_id, event_type, severity]
          else:
            required: [error_code, detail, status_code]
    CxSummaryVectorFreshness:
      type: object
      additionalProperties: false
      required:
        - freshness_schema_version
        - state
        - usable
        - reasons
        - document_summary_id
        - summary_embedding_id
        - profile_fingerprint
      properties:
        freshness_schema_version: {const: cx_summary_vector_freshness.v1}
        state: {type: string, enum: [READY, STALE]}
        usable: {type: boolean}
        reasons:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1}
        document_summary_id: {type: string, format: uuid}
        summary_embedding_id: {type: string, format: uuid}
        profile_fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
    CxDocumentIntelligenceRun:
      type: object
      additionalProperties: false
      required:
        - document_intelligence_run_schema_version
        - document_id
        - status
        - summary
        - summary_embedding
        - summary_vector
        - raw_summary_included
        - raw_vector_included
        - observability
      properties:
        document_intelligence_run_schema_version:
          const: cx_document_intelligence_run.v1
        document_id: {type: string, format: uuid}
        status: {const: READY}
        summary:
          type: object
          additionalProperties: false
          required:
            - document_summary_id
            - status
            - summary_text_sha256
            - summary_char_count
            - summary_preview
            - summary_storage_uri
            - source_markdown_sha256
            - summarizer
            - updated_at
          properties:
            document_summary_id: {type: string, format: uuid}
            status: {const: READY}
            summary_text_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
            summary_char_count: {type: integer, minimum: 1, maximum: 1000}
            summary_preview: {type: string, minLength: 1, maxLength: 240}
            summary_storage_uri: {type: string, minLength: 1}
            source_markdown_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
            summarizer:
              type: object
              additionalProperties: false
              required: [provider, mode, model_profile_id, model_revision]
              properties:
                provider: {type: string, minLength: 1}
                mode: {type: string, minLength: 1}
                model_profile_id: {type: string, minLength: 1}
                model_revision: {type: string, minLength: 1}
                deployment_id: {type: string, minLength: 1}
                provider_type: {type: string, minLength: 1}
                mo_generation_id: {type: string, minLength: 1}
                finish_reason: {type: string, minLength: 1}
                usage: {type: object, additionalProperties: true}
                provider_prompt_package_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
            updated_at: {type: string, format: date-time}
        summary_embedding:
          type: object
          additionalProperties: false
          required:
            - summary_embedding_id
            - document_summary_id
            - provider_alias
            - model_profile_id
            - model_revision
            - deployment_id
            - embedding_sha256
            - vector_dimension
          properties:
            summary_embedding_id: {type: string, format: uuid}
            document_summary_id: {type: string, format: uuid}
            provider_alias: {type: string, minLength: 1}
            model_profile_id: {type: string, minLength: 1}
            model_revision: {type: string, minLength: 1}
            deployment_id: {type: string, minLength: 1}
            embedding_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
            vector_dimension: {type: integer, minimum: 1, maximum: 8192}
        summary_vector:
          type: object
          additionalProperties: false
          required:
            - summary_vector_id
            - storage_backend
            - storage_uri
            - embedding_sha256
            - vector_dimension
            - profile_fingerprint
            - freshness
          properties:
            summary_vector_id: {type: string, format: uuid}
            storage_backend: {type: string, minLength: 1}
            storage_uri: {type: string, minLength: 1}
            embedding_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
            vector_dimension: {type: integer, minimum: 1, maximum: 8192}
            profile_fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
            freshness:
              $ref: "#/components/schemas/CxSummaryVectorFreshness"
        raw_summary_included: {const: false}
        raw_vector_included: {const: false}
        observability:
          $ref: "#/components/schemas/CxDocumentIntelligenceObservability"
    CxDocumentIntelligenceSimilarity:
      type: object
      additionalProperties: false
      required:
        - document_intelligence_similarity_schema_version
        - source_document
        - freshness
        - result
        - raw_summary_included
        - raw_vector_included
        - observability
      properties:
        document_intelligence_similarity_schema_version:
          const: cx_document_intelligence_similarity.v1
        source_document:
          type: object
          additionalProperties: false
          required:
            - content_object_id
            - document_summary_id
            - summary_embedding_id
            - profile_fingerprint
          properties:
            content_object_id: {type: string, format: uuid}
            document_summary_id: {type: string, format: uuid}
            summary_embedding_id: {type: string, format: uuid}
            profile_fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
        freshness:
          $ref: "#/components/schemas/CxSummaryVectorFreshness"
        result:
          type: object
          additionalProperties: false
          required:
            - summary_similarity_result_schema_version
            - candidate_source
            - metric
            - query_embedding_sha256
            - query_dimension
            - profile_fingerprint
            - minimum_score
            - excluded_content_object_id
            - candidate_count
            - candidates
          properties:
            summary_similarity_result_schema_version:
              const: cx_summary_similarity_result.v1
            candidate_source: {const: postgresql_pgvector_summary}
            metric: {const: cosine}
            query_embedding_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
            query_dimension: {type: integer, minimum: 1, maximum: 8192}
            profile_fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
            minimum_score: {type: number, minimum: -1, maximum: 1}
            excluded_content_object_id: {type: [string, "null"], format: uuid}
            candidate_count: {type: integer, minimum: 0, maximum: 100}
            candidates:
              type: array
              maxItems: 100
              items:
                type: object
                additionalProperties: false
                required:
                  - summary_similarity_candidate_schema_version
                  - candidate_rank
                  - content_object_id
                  - document_summary_id
                  - summary_embedding_id
                  - original_filename
                  - content_type
                  - summary_text_sha256
                  - summary_char_count
                  - embedding_sha256
                  - vector_dimension
                  - profile_fingerprint
                  - similarity_score
                  - cosine_distance
                properties:
                  summary_similarity_candidate_schema_version:
                    const: cx_summary_similarity_candidate.v1
                  candidate_rank: {type: integer, minimum: 1}
                  content_object_id: {type: string, format: uuid}
                  document_summary_id: {type: string, format: uuid}
                  summary_embedding_id: {type: string, format: uuid}
                  original_filename: {type: string, minLength: 1, maxLength: 512}
                  content_type: {type: string, minLength: 1, maxLength: 160}
                  summary_text_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                  summary_char_count: {type: integer, minimum: 0, maximum: 1000}
                  embedding_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                  vector_dimension: {type: integer, minimum: 1, maximum: 8192}
                  profile_fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
                  similarity_score: {type: number, minimum: -1, maximum: 1}
                  cosine_distance: {type: number, minimum: 0, maximum: 2}
        raw_summary_included: {const: false}
        raw_vector_included: {const: false}
        observability:
          $ref: "#/components/schemas/CxDocumentIntelligenceObservability"
    CxVectorSourceSnapshot:
      type: object
      additionalProperties: false
      required:
        - chunk_set_id
        - chunk_policy_id
        - source_markdown_sha256
        - chunk_count
        - chunk_refs
        - source_fingerprint
      properties:
        chunk_set_id: {type: string, format: uuid}
        chunk_policy_id: {type: string, minLength: 1}
        source_markdown_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        chunk_count: {type: integer, minimum: 0}
        chunk_refs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [chunk_id, ordinal, text_sha256]
            properties:
              chunk_id: {type: string, format: uuid}
              ordinal: {type: integer, minimum: 0}
              text_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        source_fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
    CxEmbeddingProfile:
      type: object
      additionalProperties: false
      required:
        - profile_schema_version
        - provider_alias
        - model_profile_id
        - model_revision
        - deployment_id
        - vector_dimension
        - profile_fingerprint
      properties:
        profile_schema_version: {const: cx_embedding_profile.v1}
        provider_alias: {type: string, minLength: 1}
        model_profile_id: {type: string, minLength: 1}
        model_revision: {type: string, minLength: 1}
        deployment_id: {type: string, minLength: 1}
        vector_dimension: {type: integer, minimum: 1}
        profile_fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
    CxVectorIndexReadiness:
      type: object
      additionalProperties: false
      required:
        - readiness_schema_version
        - vector_index_id
        - content_object_id
        - status
        - status_reason
        - freshness_status
        - freshness_reason
        - checkpoint_version
        - expected_vector_count
        - actual_vector_count
        - retrieval_usable
        - rebuild_required
        - action
      properties:
        readiness_schema_version: {const: cx_vector_index_readiness.v1}
        vector_index_id: {type: string, format: uuid}
        content_object_id: {type: string, format: uuid}
        status:
          type: string
          enum: [BUILDING, READY, STALE, REBUILD_REQUIRED, FAILED]
        status_reason: {type: [string, "null"]}
        freshness_status:
          type: string
          enum: [BUILDING, READY, STALE, REBUILD_REQUIRED, FAILED]
        freshness_reason: {type: [string, "null"]}
        checkpoint_version: {type: integer, minimum: 0}
        expected_vector_count: {type: integer, minimum: 0}
        actual_vector_count: {type: integer, minimum: 0}
        retrieval_usable: {type: boolean}
        rebuild_required: {type: boolean}
        action:
          type: string
          enum: [NONE, WAIT_FOR_BUILD, ADMIT_REBUILD]
    CxVectorIndexReconciliationRequest:
      type: object
      additionalProperties: false
      required: [source_snapshot, embedding_profile, observed_at]
      properties:
        source_snapshot:
          $ref: "#/components/schemas/CxVectorSourceSnapshot"
        embedding_profile:
          $ref: "#/components/schemas/CxEmbeddingProfile"
        observed_at: {type: string, format: date-time}
    CxVectorIndexReconciliationResponse:
      type: object
      additionalProperties: false
      required:
        - readiness_schema_version
        - vector_index_id
        - content_object_id
        - status
        - status_reason
        - freshness_status
        - freshness_reason
        - checkpoint_version
        - expected_vector_count
        - actual_vector_count
        - retrieval_usable
        - rebuild_required
        - action
        - observability
      properties:
        readiness_schema_version: {const: cx_vector_index_readiness.v1}
        vector_index_id: {type: string, format: uuid}
        content_object_id: {type: string, format: uuid}
        status:
          type: string
          enum: [BUILDING, READY, STALE, REBUILD_REQUIRED, FAILED]
        status_reason: {type: [string, "null"]}
        freshness_status:
          type: string
          enum: [BUILDING, READY, STALE, REBUILD_REQUIRED, FAILED]
        freshness_reason: {type: [string, "null"]}
        checkpoint_version: {type: integer, minimum: 0}
        expected_vector_count: {type: integer, minimum: 0}
        actual_vector_count: {type: integer, minimum: 0}
        retrieval_usable: {type: boolean}
        rebuild_required: {type: boolean}
        action:
          type: string
          enum: [NONE, WAIT_FOR_BUILD, ADMIT_REBUILD]
        observability:
          type: object
          additionalProperties: true
          required: [ok]
          properties:
            ok: {type: boolean}
    CxIngestionRunReadModel:
      type: object
      additionalProperties: false
      required:
        - read_model_schema_version
        - run_id
        - document_id
        - job_id
        - status
        - current_step
        - attempt_count
        - max_attempts
        - checkpoint_version
        - trace_id
        - request_id
        - lease_expires_at
        - retry_at
        - last_error
        - created_at
        - updated_at
        - completed_at
        - step_total
        - step_completed
        - steps
      properties:
        read_model_schema_version:
          const: cx_ingestion_run_read_model.v1
        run_id: {type: string}
        document_id: {type: string}
        job_id: {type: string}
