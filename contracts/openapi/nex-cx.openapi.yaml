openapi: 3.1.0
info:
  title: NeX CX API
  version: 0.0.0-slice0003
tags:
  - name: Platform
  - name: Content
  - name: Generation
  - name: Compatibility
  - name: Recovery
  - name: Prompts
  - name: InternalJobControl
  - name: InternalServiceLogs
paths:
  /health:
    get:
      operationId: getCxHealth
      tags:
        - Platform
      responses:
        "200":
          description: Service health status.
  /ready:
    get:
      operationId: getCxReadiness
      tags:
        - Platform
      responses:
        "200":
          description: Service dependencies are ready.
        "503":
          description: One or more service dependencies are unavailable.
  /version:
    get:
      operationId: getCxVersion
      tags:
        - Platform
      responses:
        "200":
          description: Service version metadata.
  /internal/v1/auth/service-claim:
    get:
      operationId: validateCxServiceClaim
      tags:
        - Platform
      responses:
        "200":
          description: Service claim is valid for this service.
        "401":
          description: Service claim is missing or invalid.
  /internal/v1/service-logs/retention/purge:
    post:
      operationId: purgeCxServiceLogRetention
      tags:
        - InternalServiceLogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - retention_cutoff
              properties:
                retention_cutoff:
                  type: string
                  format: date-time
                retention_days:
                  type: integer
                  minimum: 1
                checked_at:
                  type: string
                  format: date-time
                dry_run:
                  type: boolean
                  default: true
                delete_enabled:
                  type: boolean
                  default: false
                max_delete_count:
                  type: integer
                  minimum: 1
                requested_by:
                  type: object
                  additionalProperties: true
                idempotency_key:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Guarded service log retention execution evidence.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - retention_execution_schema_version
                  - service_id
                  - mode
                  - execution_status
                  - candidate_count
                  - deleted_count
                properties:
                  retention_execution_schema_version:
                    type: string
                    const: service_log_retention_execution.v1
                  service_id:
                    type: string
                    const: nex-cx
                  mode:
                    type: string
                    enum:
                      - DRY_RUN
                      - EXECUTE
                  execution_status:
                    type: string
                    enum:
                      - SUCCEEDED
                      - BLOCKED
                      - FAILED
                  candidate_count:
                    type: integer
                    minimum: 0
                  deleted_count:
                    type: integer
                    minimum: 0
        "401":
          description: Service claim is missing or invalid.
        "422":
          description: Retention purge payload is invalid.
        "503":
          description: Service log store is unavailable.
  /internal/v1/jobs/{job_id}:
    get:
      operationId: getCxServiceJobControlJob
      tags:
        - InternalJobControl
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Payload-redacted service-local job control projection.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - job_control_schema_version
                  - service_id
                  - action
                  - job
                  - controls
                properties:
                  job_control_schema_version:
                    type: string
                    const: service_job_control.v1
                  service_id:
                    type: string
                    const: nex-cx
                  action:
                    type: string
                    const: read
                  job:
                    type: object
                    additionalProperties: true
                  controls:
                    type: object
                    additionalProperties: true
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Job was not found.
  /internal/v1/jobs/{job_id}/cancel:
    post:
      operationId: cancelCxServiceJob
      tags:
        - InternalJobControl
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                observed_at:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Active CX job was cancelled through service-local job control.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Job was not found.
        "409":
          description: Job cannot transition to cancelled.
        "422":
          description: Job control payload is invalid.
  /internal/v1/jobs/{job_id}/retry:
    post:
      operationId: retryCxServiceJob
      tags:
        - InternalJobControl
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                error_code:
                  type: string
                  minLength: 1
                detail:
                  type: string
                  minLength: 1
                observed_at:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Running CX job was requeued or dead-lettered through service-local retry policy.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Job was not found.
        "409":
          description: Job cannot be retried from its current status.
        "422":
          description: Job control payload is invalid.
  /internal/v1/jobs/{job_id}/replay:
    post:
      operationId: replayCxServiceJob
      tags:
        - InternalJobControl
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - replay_job_id
                - idempotency_key
                - requested_by
                - reason
              properties:
                replay_job_id:
                  type: string
                  minLength: 1
                idempotency_key:
                  type: string
                  minLength: 1
                requested_by:
                  type: string
                  minLength: 1
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                observed_at:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Dead-letter CX job was replayed as a new queued service-local job.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Source job was not found.
        "409":
          description: Source job is not replayable or replay idempotency conflicts.
        "422":
          description: Replay payload is invalid.
  /api/v1/documents:
    get:
      operationId: listCxOwnerScopedDocuments
      tags:
        - Content
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
          description: Legacy compatibility alias for tenant_ref.id.
        - name: owner_user_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
          description: Legacy compatibility alias for owner_subject_ref.id.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Owner-scoped active CX document library projection.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - projection_schema_version
                  - service_id
                  - filters
                  - pagination
                  - documents
                  - metadata
                properties:
                  projection_schema_version:
                    type: string
                    const: cx_document_library_projection.v1
                  service_id:
                    type: string
                    const: nex-cx
                  filters:
                    type: object
                    additionalProperties: true
                  pagination:
                    type: object
                    additionalProperties: true
                  documents:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  metadata:
                    type: object
                    additionalProperties: true
                    required:
                      - raw_source_included
                      - raw_summary_included
                      - embedding_vector_included
                      - storage_path_redacted
                    properties:
                      raw_source_included:
                        type: boolean
                        const: false
                      raw_summary_included:
                        type: boolean
                        const: false
                      embedding_vector_included:
                        type: boolean
                        const: false
                      storage_path_redacted:
                        type: boolean
                        const: true
        "400":
          description: Document library query parameters are invalid.
        "401":
          description: Service claim is missing or invalid.
        "503":
          description: CX content repository is unavailable.
  /api/v1/documents/uploads:
    post:
      operationId: registerCxDocumentUpload
      tags:
        - Content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - filename
              properties:
                filename:
                  type: string
                  minLength: 1
                  maxLength: 255
                content_type:
                  type: string
                  minLength: 1
                size_bytes:
                  type: integer
                  minimum: 0
                source_sha256:
                  type: string
                  pattern: ^[0-9A-Fa-f]{64}$
                content_text:
                  type: string
                content_base64:
                  type: string
                  minLength: 1
                tenant_id:
                  type: string
                  minLength: 1
                owner_user_id:
                  type: string
                  minLength: 1
                user_id:
                  type: string
                  minLength: 1
                uploaded_by_user_id:
                  type: string
                  minLength: 1
                tenant_ref:
                  type: object
                  additionalProperties: false
                  required:
                    - type
                    - id
                  properties:
                    type:
                      type: string
                      const: oa.tenant
                    id:
                      type: string
                      minLength: 1
                owner_subject_ref:
                  type: object
                  additionalProperties: false
                  required:
                    - type
                    - id
                  properties:
                    type:
                      type: string
                      const: oa.user
                    id:
                      type: string
                      minLength: 1
                uploaded_by_subject_ref:
                  type: object
                  additionalProperties: false
                  required:
                    - type
                    - id
                  properties:
                    type:
                      type: string
                      const: oa.user
                    id:
                      type: string
                      minLength: 1
                ownership_ref:
                  type: object
                  additionalProperties: false
                  properties:
                    ownership_schema_version:
                      type: string
                      const: cx_source_ownership_ref.v1
                    tenant_ref:
                      type: object
                      additionalProperties: false
                      required:
                        - type
                        - id
                      properties:
                        type:
                          type: string
                          const: oa.tenant
                        id:
                          type: string
                          minLength: 1
                    owner_subject_ref:
                      type: object
                      additionalProperties: false
                      required:
                        - type
                        - id
                      properties:
                        type:
                          type: string
                          const: oa.user
                        id:
                          type: string
                          minLength: 1
                    uploaded_by_subject_ref:
                      type: object
                      additionalProperties: false
                      required:
                        - type
                        - id
                      properties:
                        type:
                          type: string
                          const: oa.user
                        id:
                          type: string
                          minLength: 1
                    legacy:
                      type: object
                      additionalProperties: false
                      properties:
                        tenant_id:
                          type: string
                          minLength: 1
                        owner_user_id:
                          type: string
                          minLength: 1
                    compatibility_mode:
                      type: string
                      const: legacy_owner_fields_mapped_to_oa_subject_refs
                trace_id:
                  type: string
                  pattern: ^[0-9a-f]{32}$
      responses:
        "200":
          description: Owner-scoped duplicate upload already exists.
        "202":
          description: Document upload was registered and an ingestion job was queued.
        "401":
          description: Service claim is missing or invalid.
        "422":
          description: Upload metadata is invalid or unsafe.
  /api/v1/documents/{document_id}:
    get:
      operationId: getCxDocumentRegistration
      tags:
        - Content
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX document upload registration.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Document registration was not found.
  /api/v1/documents/{document_id}/extraction:
    get:
      operationId: getCxTextExtraction
      tags:
        - Content
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX text extraction result for a document.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Extraction result was not found.
  /api/v1/documents/{document_id}/chunks:
    get:
      operationId: getCxChunkSet
      tags:
        - Content
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX chunk set metadata for a document.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Chunk set was not found.
  /api/v1/documents/{document_id}/chunks/run:
    post:
      operationId: runCxChunking
      tags:
        - Content
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX chunk set was built from extracted Markdown.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Extraction result was not found.
        "409":
          description: Extracted Markdown file is missing.
  /api/v1/documents/{document_id}/embeddings:
    get:
      operationId: getCxEmbeddingIndex
      tags:
        - Content
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX embedding index metadata for a document.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Embedding index was not found.
  /api/v1/documents/{document_id}/embeddings/run:
    post:
      operationId: runCxEmbeddingIndex
      tags:
        - Content
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX embedding index was built from stored chunk text.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Chunk set was not found.
        "409":
          description: Private chunk text is unavailable.
        "502":
          description: MO embedding response was invalid.
  /api/v1/documents/{document_id}/lexical-index:
    get:
      operationId: getCxLexicalIndex
      tags:
        - Content
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX lexical index metadata for a document.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Lexical index was not found.
  /api/v1/documents/{document_id}/lexical-index/run:
    post:
      operationId: runCxLexicalIndex
      tags:
        - Content
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX lexical index was built from stored chunk text.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Chunk set was not found.
        "409":
          description: Private chunk text is unavailable.
        "500":
          description: No configured tokenizer is available.
  /api/v1/documents/{document_id}/summary:
    get:
      operationId: getCxDocumentSummary
      tags:
        - Content
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX document summary metadata.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Document summary was not found.
  /api/v1/documents/{document_id}/summary/run:
    post:
      operationId: runCxDocumentSummary
      tags:
        - Content
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX document summary was built from extracted Markdown.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Extraction result was not found.
        "409":
          description: Extracted Markdown file is missing.
  /api/v1/documents/{document_id}/summary-embedding:
    get:
      operationId: getCxDocumentSummaryEmbedding
      tags:
        - Content
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX document summary embedding metadata.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Document summary embedding was not found.
  /api/v1/documents/{document_id}/summary-embedding/run:
    post:
      operationId: runCxDocumentSummaryEmbedding
      tags:
        - Content
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX document summary embedding was built from private summary text.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Document summary was not found.
        "409":
          description: Private summary text is unavailable.
        "502":
          description: MO embedding response was invalid.
  /api/v1/jobs/{job_id}:
    get:
      operationId: getCxIngestionJob
      tags:
        - Content
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX ingestion job.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Ingestion job was not found.
  /api/v1/jobs/{job_id}/run:
    post:
      operationId: runCxIngestionJob
      tags:
        - Content
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Mock text extraction completed and wrote extracted Markdown.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Ingestion job or document registration was not found.
        "409":
          description: Source content is unavailable for mock extraction.
  /api/v1/retrieval/context:
    post:
      operationId: createCxRetrievalContext
      tags:
        - Content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                query_text:
                  type: string
                  minLength: 1
                user_prompt:
                  type: string
                  minLength: 1
                purpose:
                  type: string
                  enum:
                    - search
                    - grounded_answer
                    - summary
                    - document_generation
                    - confidence_probe
                top_k:
                  type: integer
                  minimum: 1
                  maximum: 20
                include_neighbors:
                  type: boolean
                include_source_preview:
                  type: boolean
      responses:
        "200":
          description: Retrieval context package for AE.
        "401":
          description: Service claim is missing or invalid.
        "422":
          description: Retrieval request is invalid.
  /api/v1/retrieval/context/{retrieval_package_id}:
    get:
      operationId: getCxRetrievalContext
      tags:
        - Content
      parameters:
        - name: retrieval_package_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Previously created retrieval context package.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Retrieval context package was not found.
  /api/v1/compatibility/generation-rules:
    get:
      operationId: listCxGenerationCompatibilityRules
      tags:
        - Compatibility
      responses:
        "200":
          description: Active generation compatibility rules visible to CX.
        "401":
          description: Service claim is missing or invalid.
  /api/v1/recovery/generation-policies:
    get:
      operationId: listCxGenerationRecoveryPolicies
      tags:
        - Recovery
      responses:
        "200":
          description: Active generation recovery policies visible to CX.
        "401":
          description: Service claim is missing or invalid.
  /api/v1/recovery/generation-policies/{failure_code}:
    get:
      operationId: getCxGenerationRecoveryPolicy
      tags:
        - Recovery
      parameters:
        - name: failure_code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Generation recovery policy selected by failure code.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: No active generation recovery policy matched the failure code.
  /api/v1/generations:
    post:
      operationId: createCxGeneration
      tags:
        - Generation
      responses:
        "200":
          description: CX generation execution record created from MO mock response.
        "400":
          description: Generation request is invalid.
        "401":
          description: Service claim is missing or invalid.
        "422":
          description: Provider-private fields, compatibility mismatches, or invalid retrieval evidence refs are rejected.
        "409":
          description: Retrieval package hash/status does not allow grounded generation.
        "503":
          description: Required CX state or MO generation dependency is unavailable; retry-safe failure records may be stored when a CX generation ID exists.
        "504":
          description: MO provider timeout; CX stores a failed generation record with recovery policy lineage.
  /api/v1/generations/{cx_generation_id}:
    get:
      operationId: getCxGeneration
      tags:
        - Generation
      parameters:
        - name: cx_generation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX generation execution record.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: CX generation record was not found.
  /api/v1/generations/{cx_generation_id}/structured-draft:
    get:
      operationId: getCxStructuredDraft
      tags:
        - Generation
      parameters:
        - name: cx_generation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX structured draft with citation validation summary.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: CX structured draft was not found.
  /api/v1/generations/{cx_generation_id}/events:
    get:
      operationId: getCxGenerationEvents
      tags:
        - Generation
      parameters:
        - name: cx_generation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ordered CX generation progress events for polling clients.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: CX generation record was not found.
  /api/v1/prompts/bindings:
    get:
      operationId: listCxPromptBindings
      tags:
        - Prompts
      responses:
        "200":
          description: Active CX prompt bindings for debug and audit.
        "401":
          description: Service claim is missing or invalid.
  /api/v1/prompts/render-events/{prompt_render_event_id}:
    get:
      operationId: getCxPromptRenderEvent
      tags:
        - Prompts
      parameters:
        - name: prompt_render_event_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prompt render event metadata.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Prompt render event was not found.
