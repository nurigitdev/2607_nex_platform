openapi: 3.1.0
info:
  title: NeX CX API
  version: 0.0.0-slice0003
tags:
  - name: Platform
paths:
  /health:
    get:
      operationId: getCxHealth
      tags:
        - Platform
      responses:
        "200":
          description: Service health status.
  /ready:
    get:
      operationId: getCxReadiness
      tags:
        - Platform
      responses:
        "200":
          description: Service dependencies are ready.
        "503":
          description: One or more service dependencies are unavailable.
  /version:
    get:
      operationId: getCxVersion
      tags:
        - Platform
      responses:
        "200":
          description: Service version metadata.
  /internal/v1/auth/service-claim:
    get:
      operationId: validateCxServiceClaim
      tags:
        - Platform
      responses:
        "200":
          description: Service claim is valid for this service.
        "401":
          description: Service claim is missing or invalid.
  /api/v1/generations:
    post:
      operationId: createCxGeneration
      tags:
        - Generation
      responses:
        "200":
          description: CX generation execution record created from MO mock response.
        "400":
          description: Generation request is invalid.
        "401":
          description: Service claim is missing or invalid.
        "422":
          description: Provider-private fields are rejected.
  /api/v1/generations/{cx_generation_id}:
    get:
      operationId: getCxGeneration
      tags:
        - Generation
      parameters:
        - name: cx_generation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX generation execution record.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: CX generation record was not found.
