openapi: 3.1.0
info:
  title: NeX CX API
  version: 0.0.0-slice0003
tags:
  - name: Platform
  - name: Content
  - name: Generation
  - name: Compatibility
  - name: Prompts
paths:
  /health:
    get:
      operationId: getCxHealth
      tags:
        - Platform
      responses:
        "200":
          description: Service health status.
  /ready:
    get:
      operationId: getCxReadiness
      tags:
        - Platform
      responses:
        "200":
          description: Service dependencies are ready.
        "503":
          description: One or more service dependencies are unavailable.
  /version:
    get:
      operationId: getCxVersion
      tags:
        - Platform
      responses:
        "200":
          description: Service version metadata.
  /internal/v1/auth/service-claim:
    get:
      operationId: validateCxServiceClaim
      tags:
        - Platform
      responses:
        "200":
          description: Service claim is valid for this service.
        "401":
          description: Service claim is missing or invalid.
  /api/v1/documents/uploads:
    post:
      operationId: registerCxDocumentUpload
      tags:
        - Content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - filename
              properties:
                filename:
                  type: string
                  minLength: 1
                  maxLength: 255
                content_type:
                  type: string
                  minLength: 1
                size_bytes:
                  type: integer
                  minimum: 0
                source_sha256:
                  type: string
                  pattern: ^[0-9A-Fa-f]{64}$
                content_text:
                  type: string
                trace_id:
                  type: string
                  pattern: ^[0-9a-f]{32}$
      responses:
        "202":
          description: Document upload was registered and an ingestion job was queued.
        "401":
          description: Service claim is missing or invalid.
        "422":
          description: Upload metadata is invalid or unsafe.
  /api/v1/documents/{document_id}:
    get:
      operationId: getCxDocumentRegistration
      tags:
        - Content
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX document upload registration.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Document registration was not found.
  /api/v1/documents/{document_id}/extraction:
    get:
      operationId: getCxTextExtraction
      tags:
        - Content
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX text extraction result for a document.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Extraction result was not found.
  /api/v1/documents/{document_id}/chunks:
    get:
      operationId: getCxChunkSet
      tags:
        - Content
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX chunk set metadata for a document.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Chunk set was not found.
  /api/v1/documents/{document_id}/chunks/run:
    post:
      operationId: runCxChunking
      tags:
        - Content
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX chunk set was built from extracted Markdown.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Extraction result was not found.
        "409":
          description: Extracted Markdown file is missing.
  /api/v1/documents/{document_id}/embeddings:
    get:
      operationId: getCxEmbeddingIndex
      tags:
        - Content
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX embedding index metadata for a document.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Embedding index was not found.
  /api/v1/documents/{document_id}/embeddings/run:
    post:
      operationId: runCxEmbeddingIndex
      tags:
        - Content
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX embedding index was built from stored chunk text.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Chunk set was not found.
        "409":
          description: Private chunk text is unavailable.
        "502":
          description: MO embedding response was invalid.
  /api/v1/documents/{document_id}/lexical-index:
    get:
      operationId: getCxLexicalIndex
      tags:
        - Content
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX lexical index metadata for a document.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Lexical index was not found.
  /api/v1/documents/{document_id}/lexical-index/run:
    post:
      operationId: runCxLexicalIndex
      tags:
        - Content
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX lexical index was built from stored chunk text.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Chunk set was not found.
        "409":
          description: Private chunk text is unavailable.
        "500":
          description: No configured tokenizer is available.
  /api/v1/documents/{document_id}/summary:
    get:
      operationId: getCxDocumentSummary
      tags:
        - Content
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX document summary metadata.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Document summary was not found.
  /api/v1/documents/{document_id}/summary/run:
    post:
      operationId: runCxDocumentSummary
      tags:
        - Content
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX document summary was built from extracted Markdown.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Extraction result was not found.
        "409":
          description: Extracted Markdown file is missing.
  /api/v1/documents/{document_id}/summary-embedding:
    get:
      operationId: getCxDocumentSummaryEmbedding
      tags:
        - Content
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX document summary embedding metadata.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Document summary embedding was not found.
  /api/v1/documents/{document_id}/summary-embedding/run:
    post:
      operationId: runCxDocumentSummaryEmbedding
      tags:
        - Content
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX document summary embedding was built from private summary text.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Document summary was not found.
        "409":
          description: Private summary text is unavailable.
        "502":
          description: MO embedding response was invalid.
  /api/v1/jobs/{job_id}:
    get:
      operationId: getCxIngestionJob
      tags:
        - Content
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX ingestion job.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Ingestion job was not found.
  /api/v1/jobs/{job_id}/run:
    post:
      operationId: runCxIngestionJob
      tags:
        - Content
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Mock text extraction completed and wrote extracted Markdown.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Ingestion job or document registration was not found.
        "409":
          description: Source content is unavailable for mock extraction.
  /api/v1/retrieval/context:
    post:
      operationId: createCxRetrievalContext
      tags:
        - Content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                query_text:
                  type: string
                  minLength: 1
                user_prompt:
                  type: string
                  minLength: 1
                purpose:
                  type: string
                  enum:
                    - search
                    - grounded_answer
                    - summary
                    - document_generation
                    - confidence_probe
                top_k:
                  type: integer
                  minimum: 1
                  maximum: 20
                include_neighbors:
                  type: boolean
                include_source_preview:
                  type: boolean
      responses:
        "200":
          description: Retrieval context package for AE.
        "401":
          description: Service claim is missing or invalid.
        "422":
          description: Retrieval request is invalid.
  /api/v1/retrieval/context/{retrieval_package_id}:
    get:
      operationId: getCxRetrievalContext
      tags:
        - Content
      parameters:
        - name: retrieval_package_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Previously created retrieval context package.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Retrieval context package was not found.
  /api/v1/compatibility/generation-rules:
    get:
      operationId: listCxGenerationCompatibilityRules
      tags:
        - Compatibility
      responses:
        "200":
          description: Active generation compatibility rules visible to CX.
        "401":
          description: Service claim is missing or invalid.
  /api/v1/generations:
    post:
      operationId: createCxGeneration
      tags:
        - Generation
      responses:
        "200":
          description: CX generation execution record created from MO mock response.
        "400":
          description: Generation request is invalid.
        "401":
          description: Service claim is missing or invalid.
        "422":
          description: Provider-private fields, compatibility mismatches, or invalid retrieval evidence refs are rejected.
        "409":
          description: Retrieval package hash/status does not allow grounded generation.
  /api/v1/generations/{cx_generation_id}:
    get:
      operationId: getCxGeneration
      tags:
        - Generation
      parameters:
        - name: cx_generation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CX generation execution record.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: CX generation record was not found.
  /api/v1/prompts/bindings:
    get:
      operationId: listCxPromptBindings
      tags:
        - Prompts
      responses:
        "200":
          description: Active CX prompt bindings for debug and audit.
        "401":
          description: Service claim is missing or invalid.
  /api/v1/prompts/render-events/{prompt_render_event_id}:
    get:
      operationId: getCxPromptRenderEvent
      tags:
        - Prompts
      parameters:
        - name: prompt_render_event_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prompt render event metadata.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Prompt render event was not found.
