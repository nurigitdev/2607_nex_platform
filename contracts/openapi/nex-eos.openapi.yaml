    NvtProjectCreateCommand:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_eos/nvt_project_create_command.v1.schema.json
    NvtProjectUpdateCommand:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_eos/nvt_project_update_command.v1.schema.json
    ProjectVerificationRequest:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_eos/project_verification_request.v1.schema.json
    ProjectVerification:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_eos/project_verification.v1.schema.json
    ProjectMembershipVerificationRequest:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_eos/project_membership_verification_request.v1.schema.json
    ProjectMembershipVerification:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_eos/project_membership_verification.v1.schema.json
    ScopedApprovalRequestCommand:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - business_operation_id
        - idempotency_key
        - requested_operation
        - payload_hash
        - case
      properties:
        tenant_id: {type: string, minLength: 1, maxLength: 128}
        business_operation_id: {type: string, format: uuid}
        idempotency_key: {type: string, minLength: 1, maxLength: 256}
        requested_operation:
          type: string
          const: FINANCE.ACCOUNTING_APPROVAL.REQUEST
        payload_hash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        case:
          $ref: "#/components/schemas/ScopedApprovalCaseRequest"
    ScopedApprovalCaseRequest:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - case_id
        - company_id
        - purpose
        - scope_type
        - project_ids
        - subject_ref
        - subject_revision
        - subject_hash
        - requester_subject_id
        - approval_policy_id
        - correlation_id
        - causation_id
        - expires_at
      properties:
        tenant_id: {type: string, minLength: 1, maxLength: 128}
        case_id: {type: string, format: uuid}
        company_id: {type: string, format: uuid}
        purpose: {type: string, enum: [DOCUMENT_SIGNOFF, ACCOUNTING_POSTING]}
        scope_type: {type: string, enum: [COMPANY, PROJECT, PROJECT_SET]}
        project_ids:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
        subject_ref: {type: string, minLength: 1, maxLength: 256}
        subject_revision: {type: integer, minimum: 1}
        subject_hash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        requester_subject_id: {type: string, minLength: 1, maxLength: 128}
        approval_policy_id: {type: string, format: uuid}
        correlation_id: {type: string, minLength: 1, maxLength: 128}
        causation_id: {type: string, minLength: 1, maxLength: 128}
        expires_at: {type: [string, "null"], format: date-time}
        accounting_review:
          $ref: "#/components/schemas/AccountingReviewContext"
        document_signoff_context:
          $ref: "#/components/schemas/DocumentSignoffContext"
      allOf:
        - if:
            properties:
              purpose: {const: DOCUMENT_SIGNOFF}
          then:
            required: [document_signoff_context]
            not:
              required: [accounting_review]
        - if:
            properties:
              purpose: {const: ACCOUNTING_POSTING}
          then:
            not:
              required: [document_signoff_context]
    DocumentSignoffContext:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - envelope_id
        - approved_document_id
        - document_revision
        - document_type
        - work_code
        - document_content_hash
        - attachment_manifest_hash
        - approved_amount
        - approved_currency
        - tolerance_policy_hash
        - valid_from
        - valid_until
        - subject_hash
      properties:
        schema_version:
          type: string
          enum: [eos_document_signoff_context.v1, eos_document_signoff_context.v2]
        envelope_id: {type: string, format: uuid}
        approved_document_id: {type: string, minLength: 1, maxLength: 128}
        document_revision: {type: integer, minimum: 1}
        document_type: {type: string, minLength: 1, maxLength: 64}
        work_code: {type: string, pattern: "^FL[0-9]{7}$"}
        document_content_hash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        attachment_manifest_hash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        approved_amount: {type: string, pattern: "^[0-9]+(?:\\.[0-9]{1,4})?$"}
        approved_currency: {type: string, pattern: "^[A-Z]{3}$"}
        tolerance_policy_hash:
          type: [string, "null"]
          pattern: "^sha256:[0-9a-f]{64}$"
        valid_from: {type: string, format: date-time}
        valid_until: {type: [string, "null"], format: date-time}
        subject_hash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        allowed_project_codes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Z0-9]{4}[DMSOIG][0-9]{6}$"
      allOf:
        - if:
            properties:
              schema_version: {const: eos_document_signoff_context.v2}
          then:
            required: [allowed_project_codes]
    AccountingReviewContext:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - candidate_id
        - candidate_revision
        - candidate_hash
        - document_envelope_hash
        - fx_rate_set_hash
        - rule_release_hash
        - accounting_period_id
        - candidate_preparer_subject_id
        - business_approver_subject_ids
        - original_currency
        - original_amount
        - market_base_rate
        - rate_reference_date
        - rate_publication
        - functional_currency
        - functional_amount
        - fx_exception
      properties:
        schema_version:
          type: string
          enum: [eos_accounting_review_context.v2, eos_accounting_review_context.v3]
        candidate_id: {type: string, format: uuid}
        candidate_revision: {type: integer, minimum: 1}
        candidate_hash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        candidate_version: {type: integer, minimum: 1}
        validation_hash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        validation_observed_at: {type: string, format: date-time}
        document_envelope_hash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        fx_rate_set_hash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        rule_release_hash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        accounting_period_id: {type: string, format: uuid}
        candidate_preparer_subject_id: {type: string, minLength: 1, maxLength: 128}
        business_approver_subject_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 128}
        original_currency: {type: string, pattern: "^[A-Z]{3}$"}
        original_amount: {type: string, pattern: "^[0-9]+(?:\\.[0-9]+)?$"}
        market_base_rate: {type: string, pattern: "^[0-9]+(?:\\.[0-9]+)?$"}
        rate_reference_date: {type: string, format: date}
        rate_publication: {type: string, minLength: 1, maxLength: 256}
        functional_currency: {type: string, pattern: "^[A-Z]{3}$"}
        functional_amount: {type: string, pattern: "^[0-9]+(?:\\.[0-9]+)?$"}
        fx_exception: {type: [string, "null"], maxLength: 512}
      allOf:
        - if:
            properties:
              schema_version: {const: eos_accounting_review_context.v3}
          then:
            required: [candidate_version, validation_hash, validation_observed_at]
    ScopedApprovalRequestReceipt:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - created
        - tenant_id
        - business_operation_id
        - commit_state
        - scoped_approval_case
        - wc_publication
      properties:
        schema_version:
          type: string
          const: eos_scoped_approval_request_receipt.v2
        created: {type: boolean}
        tenant_id: {type: string}
        business_operation_id: {type: string, format: uuid}
        commit_state: {type: string, const: COMMITTED}
        scoped_approval_case:
          $ref: "#/components/schemas/ScopedApprovalCase"
        candidate_review:
          oneOf:
            - type: object
            - type: "null"
        wc_publication:
          type: object
          additionalProperties: false
          required: [work_item, created]
          properties:
            work_item: {type: object}
            created: {type: boolean}
    ScopedApprovalCase:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - tenant_id
        - case_id
        - company_id
        - purpose
        - scope_type
        - project_set_hash
        - project_ids
        - subject_ref
        - subject_revision
        - subject_hash
        - requester_ref
        - approval_policy_ref
        - oa_decision_ref
        - authorization_revision_hash
        - authorization_checked_at
        - state
        - active_stage_order
        - stage_count
        - target_role_ref
        - version
        - case_hash
        - created_business_operation_id
        - correlation_id
        - causation_id
        - expires_at
        - created_at
        - updated_at
        - decided_at
        - project_bindings
      properties:
        schema_version: {type: string, const: eos_scoped_approval_case.v2}
        tenant_id: {type: string}
        case_id: {type: string, format: uuid}
        company_id: {type: string, format: uuid}
        purpose: {type: string, enum: [DOCUMENT_SIGNOFF, ACCOUNTING_POSTING]}
        scope_type: {type: string, enum: [COMPANY, PROJECT, PROJECT_SET]}
        project_set_hash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        project_ids:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
        subject_ref: {type: string}
        subject_revision: {type: integer, minimum: 1}
        subject_hash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        requester_ref: {type: object}
        approval_policy_ref: {type: object}
        oa_decision_ref: {type: string}
        authorization_revision_hash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        authorization_checked_at: {type: string, format: date-time}
        state: {type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED, EXPIRED]}
        active_stage_order: {type: [integer, "null"], minimum: 1, maximum: 5}
        stage_count: {type: integer, minimum: 1, maximum: 5}
        target_role_ref: {type: [string, "null"]}
        version: {type: integer, minimum: 1}
        case_hash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        created_business_operation_id: {type: string, format: uuid}
        correlation_id: {type: string}
        causation_id: {type: string}
        expires_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        decided_at: {type: [string, "null"], format: date-time}
        project_bindings:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [project_id, company_id, authorization_scope_hash]
            properties:
              project_id: {type: string, format: uuid}
              company_id: {type: string, format: uuid}
              authorization_scope_hash:
                type: string
                pattern: "^sha256:[0-9a-f]{64}$"
