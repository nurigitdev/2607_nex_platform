openapi: 3.1.0
info:
  title: NeX Enterprise Operations System API
  version: 2.1.0-p8-s105
  description: >-
    NeX-EOS service shell and canonical Voucher Draft command contract. The
    P8-S18 path is contract-first and becomes executable in P8-S19.
servers:
  - url: http://127.0.0.1:8107
tags:
  - name: Platform
  - name: Finance
  - name: Organization
  - name: Project
paths:
  /:
    get:
      operationId: getEosServiceRoot
      tags: [Platform]
      responses:
        "200":
          description: NeX-EOS service identity and platform links.
  /health:
    get:
      operationId: getEosHealth
      tags: [Platform]
      responses:
        "200":
          description: Process-level service health.
  /ready:
    get:
      operationId: getEosReadiness
      tags: [Platform]
      responses:
        "200":
          description: Configuration and database dependencies are ready.
        "503":
          description: One or more required dependencies are unavailable.
  /version:
    get:
      operationId: getEosVersion
      tags: [Platform]
      responses:
        "200":
          description: Service version, build, and contract identity.
  /internal/v1/auth/service-claim:
    get:
      operationId: validateEosServiceClaim
      tags: [Platform]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      responses:
        "200":
          description: Service claim is valid for NeX-EOS.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Audience or required scope is not allowed.
  /internal/v1/auth/service-claim/active:
    post:
      operationId: validateEosActiveServiceClaim
      tags: [Platform]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-route-class: CREDENTIAL
      responses:
        "200":
          description: Service claim is active under the configured trust profile.
        "401":
          description: Service claim is missing, invalid, expired, or inactive.
        "403":
          description: Audience or required scope is not allowed.
        "503":
          description: Signed-token verification or introspection is unavailable.
  /internal/v1/auth/service-token-runtime:
    get:
      operationId: getEosServiceTokenRuntime
      tags: [Platform]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      responses:
        "200":
          description: Redacted service-token admission runtime state.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Audience or required scope is not allowed.
  /internal/v1/nvt-projects:
    get:
      operationId: PROJECT.NVT_PROJECT.LIST
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:nvt_project:read
      x-nex-side-effect-free: true
      parameters:
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: X-NeX-Subject-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: status
          in: query
          required: false
          schema: {type: string, enum: [ACTIVE, INACTIVE]}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: Tenant-scoped bounded NVTProject list in deterministic order.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Fresh OA NVTProject read authority is denied.
        "422":
          description: Tenant, subject, status, or pagination input is invalid.
        "503":
          description: OA authorization or EOS persistence is unavailable.
    post:
      operationId: PROJECT.NVT_PROJECT.CREATE
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:nvt_project:create
      x-nex-route-class: WRITE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NvtProjectCreateCommand"
      responses:
        "200":
          description: Exact idempotent replay of an existing NVTProject creation.
        "201":
          description: NVTProject and BusinessOperation committed atomically.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Service trust or fresh OA create authority is denied.
        "409":
          description: NVT identity, code, or idempotency semantics conflict.
        "422":
          description: Command, payload hash, or domain invariant is invalid.
        "503":
          description: OA authorization or EOS persistence is unavailable.
  /internal/v1/nvt-projects/{nvt_project_id}:
    get:
      operationId: PROJECT.NVT_PROJECT.GET
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:nvt_project:read
      x-nex-side-effect-free: true
      parameters:
        - name: nvt_project_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: X-NeX-Subject-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        "200":
          description: Current tenant-scoped NVTProject projection.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Fresh OA NVTProject read authority is denied.
        "404":
          description: NVTProject is absent from the admitted tenant scope.
        "422":
          description: Tenant, subject, or NVTProject identity is invalid.
        "503":
          description: OA authorization or EOS persistence is unavailable.
    patch:
      operationId: PROJECT.NVT_PROJECT.UPDATE
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:nvt_project:admin
      x-nex-route-class: WRITE
      parameters:
        - name: nvt_project_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NvtProjectUpdateCommand"
      responses:
        "200":
          description: NVTProject update committed or replayed idempotently.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Service trust or fresh OA admin authority is denied.
        "404":
          description: NVTProject is absent from the admitted tenant scope.
        "409":
          description: Version changed or an active Mother Project blocks inactivation.
        "422":
          description: Patch, payload hash, or domain invariant is invalid.
        "503":
          description: OA authorization or EOS persistence is unavailable.
  /internal/v2/finance/legal-entities/{company_id}:
    get:
      operationId: FINANCE.LEGAL_ENTITY.GET
      tags: [Finance]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: finance:company:read
      x-nex-side-effect-free: true
      parameters:
        - name: company_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: X-NeX-Subject-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: effective_on
          in: query
          required: false
          schema: {type: string, format: date}
      responses:
        "200":
          description: Active tenant-scoped LegalEntity projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntity"
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Fresh OA company-read authority is denied.
        "404":
          description: LegalEntity is absent from the admitted effective scope.
        "422":
          description: Tenant, subject, company, or effective date is invalid.
        "503":
          description: OA authorization or EOS persistence is unavailable.
  /internal/v2/projects/{project_id}/company-bindings:
    post:
      operationId: PROJECT.COMPANY_BINDING.CREATE
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:company-binding:manage
      x-nex-route-class: WRITE
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: X-NeX-Subject-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCompanyBindingCommand"
      responses:
        "201":
          description: Approved ProjectCompanyBinding committed or replayed exactly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCompanyBinding"
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Service trust or fresh OA binding authority is denied.
        "404":
          description: A real tenant-scoped Project or LegalEntity is absent.
        "409":
          description: Identity semantics conflict or effective periods overlap.
        "422":
          description: Binding command or effective period is invalid.
        "503":
          description: OA authorization or EOS persistence is unavailable.
  /internal/v2/projects/{project_id}/company-binding:
    get:
      operationId: PROJECT.COMPANY_BINDING.GET
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:company-binding:read
      x-nex-side-effect-free: true
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: X-NeX-Subject-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: effective_on
          in: query
          required: true
          schema: {type: string, format: date}
      responses:
        "200":
          description: Unique effective accounting-company binding for the Project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCompanyBinding"
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Fresh OA binding-read authority is denied.
        "404":
          description: No binding is effective on the requested date.
        "409":
          description: Persisted data contains multiple effective bindings.
        "422":
          description: Tenant, subject, Project, or effective date is invalid.
        "503":
          description: OA authorization or EOS persistence is unavailable.
  /internal/v2/finance/account-catalog:
    get:
      operationId: FINANCE.ACCOUNT.CATALOG_GET
      tags: [Finance]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: finance:account:read
      x-nex-side-effect-free: true
      parameters:
        - name: company_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: effective_on
          in: query
          required: true
          schema: {type: string, format: date}
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: X-NeX-Subject-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        "200":
          description: Effective approved account catalog and PostingRule projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountCatalogProjection"
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Fresh OA account-read authority is denied.
        "404":
          description: No approved catalog is effective for the company.
        "409":
          description: Effective release or PostingRule state is ambiguous or incomplete.
        "422":
          description: Tenant, subject, company, or date is invalid.
        "503":
          description: OA authorization or EOS persistence is unavailable.
  /internal/v2/finance/accounts/approved:
    post:
      operationId: FINANCE.ACCOUNT.CREATE_APPROVED
      tags: [Finance]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: finance:account:manage
      x-nex-work-code: FL0004011
      x-nex-route-class: WRITE
      parameters:
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: X-NeX-Subject-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovedAccountCreateCommand"
      responses:
        "201":
          description: Approved Account and company policy committed or replayed exactly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovedAccountCreateResult"
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Service trust or fresh OA account-manage authority is denied.
        "404":
          description: LegalEntity, catalog release, or PostingRule is absent.
        "409":
          description: Identity, policy period, parent, or release semantics conflict.
        "422":
          description: Account, policy, proof, currency, or effective date is invalid.
        "503":
          description: OA authorization or EOS persistence is unavailable.
  /internal/v2/finance/coa/releases/{definition_release_id}/publish:
    post:
      operationId: FINANCE.COA.PUBLISH_APPROVED
      tags: [Finance]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: finance:catalog:publish
      x-nex-route-class: WRITE
      parameters:
        - name: definition_release_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          description: Real OA tenant of the Product publisher; never a COA owner.
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: X-NeX-Subject-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoaPublishApprovedCommand"
      responses:
        "200": {description: Exact idempotent publication replay.}
        "201": {description: Approved GLOBAL release published atomically.}
        "401": {description: Service claim is missing or invalid.}
        "403": {description: Fresh Product publication authority is denied.}
        "404": {description: COA definition release is absent.}
        "409": {description: "Approval, hash, identity, or release state conflicts."}
        "422": {description: Publication command is invalid.}
        "503": {description: "OA, source admission, or EOS persistence is unavailable."}
  /internal/v2/finance/coa/adoptions:
    post:
      operationId: FINANCE.COA.ADOPT_APPROVED
      tags: [Finance]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: finance:account:manage
      x-nex-route-class: WRITE
      parameters:
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: X-NeX-Subject-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoaAdoptApprovedCommand"
      responses:
        "200": {description: Exact idempotent company-adoption replay.}
        "201": {description: Company adoption and Account bindings committed atomically.}
        "401": {description: Service claim is missing or invalid.}
        "403": {description: Fresh tenant account-management authority is denied.}
        "404": {description: "Company, release, Account, or entry is absent."}
        "409": {description: "Release, policy, PostingRule, period, or binding conflicts."}
        "422": {description: Adoption command or approval proof is invalid.}
        "503": {description: OA authorization or EOS persistence is unavailable.}
  /internal/v2/finance/coa/extensions/{definition_release_id}/publish:
    post:
      operationId: FINANCE.COA.EXTENSION_PUBLISH_APPROVED
      tags: [Finance]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: finance:account:manage
      x-nex-work-code: FL0004011
      x-nex-route-class: WRITE
      parameters:
        - name: definition_release_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: X-NeX-Subject-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoaPublishApprovedCommand"
      responses:
        "200": {description: Exact idempotent tenant extension replay.}
        "201": {description: Approved tenant extension published atomically.}
        "401": {description: Service claim is missing or invalid.}
        "403": {description: Tenant authority or ownership is denied.}
        "404": {description: Extension or GLOBAL base release is absent.}
        "409": {description: "Parent, namespace, legacy code, or release conflicts."}
        "422": {description: Extension publication command is invalid.}
        "503": {description: OA authorization or EOS persistence is unavailable.}
  /internal/v1/finance/voucher-drafts:
    get:
      operationId: FINANCE.VOUCHER_DRAFT.LIST
      tags: [Finance]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: finance:voucher-draft:read
      x-nex-side-effect-free: true
      parameters:
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: project_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: requester_subject_id
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 100}
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: Membership-filtered, bounded Voucher Draft list in deterministic order.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Fresh OA read authorization or active Project membership is denied.
        "422":
          description: Tenant, Project, requester, or pagination input is invalid.
        "503":
          description: OA authorization or EOS query persistence is unavailable.
    post:
      operationId: createEosVoucherDraft
      tags: [Finance]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: finance:voucher-draft:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVoucherDraftCommand"
      responses:
        "200":
          description: Idempotent replay of an existing committed Voucher Draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateVoucherDraftResult"
        "201":
          description: Voucher Draft committed atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateVoucherDraftResult"
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Service trust or fresh business authorization is denied.
        "409":
          description: Idempotency identity conflicts with prior semantics.
        "422":
          description: Command, hash, approval, or domain invariant is invalid.
        "503":
          description: OA authorization or EOS persistence is unavailable.
  /internal/v1/finance/voucher-drafts/{voucher_id}:
    get:
      operationId: FINANCE.VOUCHER_DRAFT.GET
      tags: [Finance]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: finance:voucher-draft:read
      x-nex-side-effect-free: true
      parameters:
        - name: voucher_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: requester_subject_id
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        "200":
          description: Membership-filtered Voucher Draft and ordered accounting lines.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Fresh OA read authorization or active Project membership is denied.
        "404":
          description: Voucher Draft is absent from the admitted tenant and Project scope.
        "422":
          description: Tenant, Voucher, or requester identity is invalid.
        "503":
          description: OA authorization or EOS query persistence is unavailable.
  /internal/v1/organization/approver-resolutions:
    post:
      operationId: resolveEosApprover
      tags: [Organization]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-security-authorization: false
      parameters:
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproverResolutionRequest"
      responses:
        "200":
          description: Deterministic intended business approver resolution; not an OA authorization decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproverResolution"
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Service audience or scope is denied.
        "404":
          description: No effective organization assignment matches the policy.
        "409":
          description: The default policy would select the requester.
        "422":
          description: Resolution input or policy is invalid.
        "503":
          description: Organization persistence is unavailable.
  /internal/v1/projects:verify-batch:
    post:
      operationId: PROJECT.PROJECT.VERIFY_BATCH
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-caller: nex-wa
      x-nex-required-scopes: [service:call, project:verify]
      x-nex-route-class: READ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectVerificationRequest"
      responses:
        "200":
          description: Tenant-scoped Project identities were verified independently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectVerification"
        "400": {description: "Batch envelope or Project identity is invalid."}
        "401": {description: "Service token is missing, invalid, or lacks scope."}
        "403": {description: "The admitted caller is not NeX-WA."}
        "503": {description: "EOS Project authority is unavailable."}
  /internal/v1/project-memberships:verify-at:
    post:
      operationId: PROJECT.MEMBERSHIP.VERIFY_AT
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-caller: nex-wa
      x-nex-required-scopes: [service:call, project:verify]
      x-nex-route-class: READ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMembershipVerificationRequest"
      responses:
        "200":
          description: Historical Project membership was verified at the event time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMembershipVerification"
        "400": {description: "Verification identity or occurred_at is invalid."}
        "401": {description: "Service token is missing, invalid, or lacks scope."}
        "403": {description: "The admitted caller is not NeX-WA."}
        "503": {description: "EOS Project membership authority is unavailable."}
  /internal/v1/business-operations/{business_operation_id}:
    get:
      operationId: getEosBusinessOperation
      tags: [Finance]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      parameters:
        - name: business_operation_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        "200":
          description: Authoritative BusinessOperation reconciliation projection.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: BusinessOperation is absent from the requested tenant scope.
        "422":
          description: Tenant or BusinessOperation identity is invalid.
        "503":
          description: Query persistence or stored state is unavailable.
  /internal/v1/finance/voucher-drafts/{voucher_id}/verification:
    get:
      operationId: verifyEosVoucherDraft
      tags: [Finance]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-side-effect-free: true
      parameters:
        - name: voucher_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: business_operation_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        "200":
          description: Side-effect-free stable Voucher business-state verification.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Voucher or BusinessOperation is absent from tenant scope.
        "409":
          description: Voucher and BusinessOperation binding is not committed.
        "422":
          description: Verification identity is invalid.
        "503":
          description: Persisted business state is unavailable or inconsistent.
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
  schemas:
    ApproverResolutionRequest:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_eos/approver_resolution_request.v1.schema.json
    ApproverResolution:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_eos/approver_resolution.v1.schema.json
    CreateVoucherDraftCommand:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_eos/create_voucher_draft_command.v1.schema.json
    CreateVoucherDraftResult:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_eos/create_voucher_draft_result.v1.schema.json
    LegalEntity:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - company_id
        - company_code
        - name
        - functional_currency
        - presentation_currency
        - business_timezone
        - status
        - effective_from
        - version
        - created_at
        - updated_at
      properties:
        tenant_id: {type: string, minLength: 1, maxLength: 128}
        company_id: {type: string, format: uuid}
        company_code: {type: string, minLength: 1, maxLength: 64}
        name: {type: string, minLength: 1, maxLength: 256}
        functional_currency: {type: string, pattern: "^[A-Z]{3}$"}
        presentation_currency: {type: string, pattern: "^[A-Z]{3}$"}
        business_timezone: {type: string, minLength: 1, maxLength: 64}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
        effective_from: {type: string, format: date}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProjectCompanyBindingCommand:
      type: object
      additionalProperties: false
      required: [binding_id, company_id, valid_from, approved_proof_hash]
      properties:
        binding_id: {type: string, format: uuid}
        company_id: {type: string, format: uuid}
        valid_from: {type: string, format: date}
        valid_until:
          type: [string, "null"]
          format: date
        approved_proof_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
    ProjectCompanyBinding:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - binding_id
        - project_id
        - company_id
        - valid_from
        - approved_proof_hash
        - state
        - version
        - created_at
        - updated_at
      properties:
        tenant_id: {type: string, minLength: 1, maxLength: 128}
        binding_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        company_id: {type: string, format: uuid}
        valid_from: {type: string, format: date}
        valid_until:
          type: [string, "null"]
          format: date
        approved_proof_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        state: {type: string, enum: [APPROVED, REVOKED]}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AccountCatalogProjection:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - company_id
        - effective_on
        - catalog_release
        - posting_rule
        - accounts
      properties:
        tenant_id: {type: string, minLength: 1, maxLength: 128}
        company_id: {type: string, format: uuid}
        effective_on: {type: string, format: date}
        catalog_release: {$ref: "#/components/schemas/AccountCatalogRelease"}
        posting_rule: {$ref: "#/components/schemas/PostingRuleRelease"}
        accounts:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/CompanyAccountProjection"}
    AccountCatalogRelease:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - release_id
        - source_reference
        - source_version
        - source_hash
        - effective_from
        - published_by
        - approved_proof_ref
        - status
        - created_at
      properties:
        tenant_id: {type: string}
        release_id: {type: string, format: uuid}
        source_reference: {type: string, minLength: 1, maxLength: 512}
        source_version: {type: string, minLength: 1, maxLength: 128}
        source_hash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        effective_from: {type: string, format: date}
        published_by: {type: string, minLength: 1, maxLength: 128}
        approved_proof_ref: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        status: {type: string, enum: [DRAFT, PUBLISHED, SUPERSEDED]}
        created_at: {type: string, format: date-time}
    PostingRuleRelease:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - posting_rule_id
        - company_id
        - catalog_release_id
        - rule_code
        - rule_version
        - rule_hash
        - effective_date
        - account_mapping_hash
        - approved_proof_ref
        - status
        - created_at
      properties:
        tenant_id: {type: string}
        posting_rule_id: {type: string, format: uuid}
        company_id: {type: string, format: uuid}
        catalog_release_id: {type: string, format: uuid}
        rule_code: {type: string, minLength: 1, maxLength: 128}
        rule_version: {type: integer, minimum: 1}
        rule_hash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        effective_date: {type: string, format: date}
        account_mapping_hash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        approved_proof_ref: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        status: {type: string, enum: [DRAFT, PUBLISHED, SUPERSEDED]}
        created_at: {type: string, format: date-time}
    CompanyAccountProjection:
      type: object
      required:
        - policy_id
        - account_id
        - account_code
        - name
        - category
        - account_type
        - is_postable_leaf
        - is_monetary
        - statement_line_ref
        - allowed_currencies
        - valid_from
        - rule_revision
        - approved_proof_ref
      properties:
        policy_id: {type: string, format: uuid}
        account_id: {type: string, format: uuid}
        account_code: {type: string, minLength: 1, maxLength: 64}
        name: {type: string, minLength: 1, maxLength: 256}
        category: {type: string, enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE]}
        account_type: {type: string, minLength: 1, maxLength: 32}
        parent_account_id: {type: [string, "null"], format: uuid}
        is_postable_leaf: {type: boolean}
        is_monetary: {type: boolean}
        statement_line_ref: {type: string, minLength: 1, maxLength: 128}
        allowed_currencies:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: "^[A-Z]{3}$"}
        valid_from: {type: string, format: date}
        valid_until: {type: [string, "null"], format: date}
        rule_revision: {type: integer, minimum: 1}
        approved_proof_ref: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
    ApprovedAccountCreateCommand:
      type: object
      additionalProperties: false
      required: [account, policy]
      properties:
        account:
          type: object
          additionalProperties: false
          required:
            - account_id
            - account_code
            - name
            - category
            - account_type
            - effective_from
          properties:
            account_id: {type: string, format: uuid}
            account_code: {type: string, minLength: 1, maxLength: 64}
            name: {type: string, minLength: 1, maxLength: 256}
            category: {type: string, enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE]}
            account_type: {type: string, minLength: 1, maxLength: 32}
            effective_from: {type: string, format: date}
            effective_until: {type: [string, "null"], format: date}
        policy:
          type: object
          additionalProperties: false
          required:
            - policy_id
            - company_id
            - catalog_release_id
            - posting_rule_id
            - is_postable_leaf
            - is_monetary
            - statement_line_ref
            - allowed_currencies
            - valid_from
            - approved_proof_ref
          properties:
            policy_id: {type: string, format: uuid}
            company_id: {type: string, format: uuid}
            catalog_release_id: {type: string, format: uuid}
            posting_rule_id: {type: string, format: uuid}
            parent_account_id: {type: [string, "null"], format: uuid}
            is_postable_leaf: {type: boolean}
            is_monetary: {type: boolean}
            statement_line_ref: {type: string, minLength: 1, maxLength: 128}
            allowed_currencies:
              type: array
              minItems: 1
              uniqueItems: true
              items: {type: string, pattern: "^[A-Z]{3}$"}
            valid_from: {type: string, format: date}
            valid_until: {type: [string, "null"], format: date}
            rule_revision: {type: integer, minimum: 1, default: 1}
            approved_proof_ref: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
    ApprovedAccountCreateResult:
      type: object
      additionalProperties: false
      required: [account, policy]
      properties:
        account:
          type: object
        policy:
          type: object
    CoaPublishApprovedCommand:
      type: object
      additionalProperties: false
      required:
        - business_operation_id
        - idempotency_key
        - source_reference
        - source_hash
        - approved_proof_ref
        - content_hash
      properties:
        business_operation_id: {type: string, format: uuid}
        idempotency_key: {type: string, minLength: 1, maxLength: 256}
        source_reference: {type: string, minLength: 1, maxLength: 512}
        source_hash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        approved_proof_ref: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        content_hash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
    CoaAdoptApprovedCommand:
      type: object
      additionalProperties: false
      required:
        - business_operation_id
        - idempotency_key
        - adoption_id
        - company_id
        - global_release_id
        - effective_from
        - approved_proof_ref
        - bindings
      properties:
        business_operation_id: {type: string, format: uuid}
        idempotency_key: {type: string, minLength: 1, maxLength: 256}
        adoption_id: {type: string, format: uuid}
        company_id: {type: string, format: uuid}
        global_release_id: {type: string, format: uuid}
        extension_release_id: {type: [string, "null"], format: uuid}
        effective_from: {type: string, format: date}
        effective_until: {type: [string, "null"], format: date}
        approved_proof_ref: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        bindings:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CoaAccountBindingCommand"
    CoaAccountBindingCommand:
      type: object
