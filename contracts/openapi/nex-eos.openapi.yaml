components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
  parameters:
    TenantCodeHeader:
      name: X-NeX-Tenant-Id
      in: header
      required: true
      schema: {type: string, pattern: "^[A-Z0-9]{4}$"}
    SubjectHeader:
      name: X-NeX-Subject-Id
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    ProjectRequestCodePath:
      name: project_request_code
      in: path
      required: true
      schema: {type: string, pattern: "^[A-Z0-9]{4}R[0-9]{6}$"}
  schemas:
    ProjectApplicationDraftCommand:
      type: object
      additionalProperties: false
      required: [application_id, purpose_type, name, currency]
      properties:
        application_id: {type: string, format: uuid}
        purpose_type: {type: string, enum: [D, M, S, O, I, G]}
        name: {type: string, minLength: 1, maxLength: 256}
        parent_project_id: {type: [string, "null"], format: uuid}
        nvt_project_id: {type: [string, "null"], format: uuid}
        company_id: {type: [string, "null"], format: uuid}
        start_date: {type: [string, "null"], format: date}
        end_date: {type: [string, "null"], format: date}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
      oneOf:
        - required: [parent_project_id]
          properties:
            nvt_project_id: {type: "null"}
        - required: [nvt_project_id]
          properties:
            parent_project_id: {type: "null"}
    ProjectApplicationRevisionCommand:
      type: object
      additionalProperties: false
      required: [expected_version, purpose_type, name, currency]
      properties:
        expected_version: {type: integer, minimum: 1}
        purpose_type: {type: string, enum: [D, M, S, O, I, G]}
        name: {type: string, minLength: 1, maxLength: 256}
        parent_project_id: {type: [string, "null"], format: uuid}
        nvt_project_id: {type: [string, "null"], format: uuid}
        company_id: {type: [string, "null"], format: uuid}
        start_date: {type: [string, "null"], format: date}
        end_date: {type: [string, "null"], format: date}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
      oneOf:
        - required: [parent_project_id]
          properties:
            nvt_project_id: {type: "null"}
        - required: [nvt_project_id]
          properties:
            parent_project_id: {type: "null"}
    ExpectedVersionCommand:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: {type: integer, minimum: 1}
    ProjectApplicationApprovalCommand:
      type: object
      additionalProperties: false
      required: [approval_policy_id, expected_version]
      properties:
        approval_policy_id: {type: string, format: uuid}
        expected_version: {type: integer, minimum: 1}
    ApprovedDocumentEnvelope:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - tenant_id
        - envelope_id
        - company_id
