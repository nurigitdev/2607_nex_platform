openapi: 3.1.0
info:
  title: NeX Enterprise Operations System API
  version: 2.1.0-p8-s105
  description: >-
    NeX-EOS service shell and canonical Voucher Draft command contract. The
    P8-S18 path is contract-first and becomes executable in P8-S19.
servers:
  - url: http://127.0.0.1:8107
tags:
  - name: Platform
  - name: Finance
  - name: Organization
  - name: Project
paths:
  /:
    get:
      operationId: getEosServiceRoot
      tags: [Platform]
      responses:
        "200":
          description: NeX-EOS service identity and platform links.
  /health:
    get:
      operationId: getEosHealth
      tags: [Platform]
      responses:
        "200":
          description: Process-level service health.
  /ready:
    get:
      operationId: getEosReadiness
      tags: [Platform]
      responses:
        "200":
          description: Configuration and database dependencies are ready.
        "503":
          description: One or more required dependencies are unavailable.
  /version:
    get:
      operationId: getEosVersion
      tags: [Platform]
      responses:
        "200":
          description: Service version, build, and contract identity.
  /internal/v1/auth/service-claim:
    get:
      operationId: validateEosServiceClaim
      tags: [Platform]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      responses:
        "200":
          description: Service claim is valid for NeX-EOS.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Audience or required scope is not allowed.
  /internal/v1/auth/service-claim/active:
    post:
      operationId: validateEosActiveServiceClaim
      tags: [Platform]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-route-class: CREDENTIAL
      responses:
        "200":
          description: Service claim is active under the configured trust profile.
        "401":
          description: Service claim is missing, invalid, expired, or inactive.
        "403":
          description: Audience or required scope is not allowed.
        "503":
          description: Signed-token verification or introspection is unavailable.
  /internal/v1/auth/service-token-runtime:
    get:
      operationId: getEosServiceTokenRuntime
      tags: [Platform]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      responses:
        "200":
          description: Redacted service-token admission runtime state.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Audience or required scope is not allowed.
  /internal/v1/nvt-projects:
    get:
      operationId: PROJECT.NVT_PROJECT.LIST
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:nvt_project:read
      x-nex-side-effect-free: true
      parameters:
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: X-NeX-Subject-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: status
          in: query
          required: false
          schema: {type: string, enum: [ACTIVE, INACTIVE]}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: Tenant-scoped bounded NVTProject list in deterministic order.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Fresh OA NVTProject read authority is denied.
        "422":
          description: Tenant, subject, status, or pagination input is invalid.
        "503":
          description: OA authorization or EOS persistence is unavailable.
    post:
      operationId: PROJECT.NVT_PROJECT.CREATE
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:nvt_project:create
      x-nex-route-class: WRITE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NvtProjectCreateCommand"
      responses:
        "200":
          description: Exact idempotent replay of an existing NVTProject creation.
        "201":
          description: NVTProject and BusinessOperation committed atomically.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Service trust or fresh OA create authority is denied.
        "409":
          description: NVT identity, code, or idempotency semantics conflict.
        "422":
          description: Command, payload hash, or domain invariant is invalid.
        "503":
          description: OA authorization or EOS persistence is unavailable.
  /internal/v1/nvt-projects/{nvt_project_id}:
    get:
      operationId: PROJECT.NVT_PROJECT.GET
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:nvt_project:read
      x-nex-side-effect-free: true
      parameters:
        - name: nvt_project_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: X-NeX-Subject-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        "200":
          description: Current tenant-scoped NVTProject projection.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Fresh OA NVTProject read authority is denied.
        "404":
          description: NVTProject is absent from the admitted tenant scope.
        "422":
          description: Tenant, subject, or NVTProject identity is invalid.
        "503":
          description: OA authorization or EOS persistence is unavailable.
    patch:
      operationId: PROJECT.NVT_PROJECT.UPDATE
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:nvt_project:admin
      x-nex-route-class: WRITE
      parameters:
        - name: nvt_project_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NvtProjectUpdateCommand"
      responses:
        "200":
          description: NVTProject update committed or replayed idempotently.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Service trust or fresh OA admin authority is denied.
        "404":
          description: NVTProject is absent from the admitted tenant scope.
        "409":
          description: Version changed or an active Mother Project blocks inactivation.
        "422":
          description: Patch, payload hash, or domain invariant is invalid.
        "503":
          description: OA authorization or EOS persistence is unavailable.
  /internal/v1/finance/voucher-drafts:
    get:
      operationId: FINANCE.VOUCHER_DRAFT.LIST
      tags: [Finance]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: finance:voucher-draft:read
      x-nex-side-effect-free: true
      parameters:
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: project_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: requester_subject_id
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 100}
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: Membership-filtered, bounded Voucher Draft list in deterministic order.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Fresh OA read authorization or active Project membership is denied.
        "422":
          description: Tenant, Project, requester, or pagination input is invalid.
        "503":
          description: OA authorization or EOS query persistence is unavailable.
    post:
      operationId: createEosVoucherDraft
      tags: [Finance]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: finance:voucher-draft:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVoucherDraftCommand"
      responses:
        "200":
          description: Idempotent replay of an existing committed Voucher Draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateVoucherDraftResult"
        "201":
          description: Voucher Draft committed atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateVoucherDraftResult"
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Service trust or fresh business authorization is denied.
        "409":
          description: Idempotency identity conflicts with prior semantics.
        "422":
          description: Command, hash, approval, or domain invariant is invalid.
        "503":
          description: OA authorization or EOS persistence is unavailable.
  /internal/v1/finance/voucher-drafts/{voucher_id}:
    get:
      operationId: FINANCE.VOUCHER_DRAFT.GET
      tags: [Finance]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: finance:voucher-draft:read
      x-nex-side-effect-free: true
      parameters:
        - name: voucher_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: requester_subject_id
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        "200":
          description: Membership-filtered Voucher Draft and ordered accounting lines.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Fresh OA read authorization or active Project membership is denied.
        "404":
          description: Voucher Draft is absent from the admitted tenant and Project scope.
        "422":
          description: Tenant, Voucher, or requester identity is invalid.
        "503":
          description: OA authorization or EOS query persistence is unavailable.
  /internal/v1/organization/approver-resolutions:
    post:
      operationId: resolveEosApprover
      tags: [Organization]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-security-authorization: false
      parameters:
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproverResolutionRequest"
      responses:
        "200":
          description: Deterministic intended business approver resolution; not an OA authorization decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproverResolution"
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Service audience or scope is denied.
        "404":
          description: No effective organization assignment matches the policy.
        "409":
          description: The default policy would select the requester.
        "422":
          description: Resolution input or policy is invalid.
        "503":
          description: Organization persistence is unavailable.
  /internal/v1/business-operations/{business_operation_id}:
    get:
      operationId: getEosBusinessOperation
      tags: [Finance]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      parameters:
        - name: business_operation_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        "200":
          description: Authoritative BusinessOperation reconciliation projection.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: BusinessOperation is absent from the requested tenant scope.
        "422":
          description: Tenant or BusinessOperation identity is invalid.
        "503":
          description: Query persistence or stored state is unavailable.
  /internal/v1/finance/voucher-drafts/{voucher_id}/verification:
    get:
      operationId: verifyEosVoucherDraft
      tags: [Finance]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-side-effect-free: true
      parameters:
        - name: voucher_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: business_operation_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        "200":
          description: Side-effect-free stable Voucher business-state verification.
        "401":
          description: Service claim is missing or invalid.
        "404":
          description: Voucher or BusinessOperation is absent from tenant scope.
        "409":
          description: Voucher and BusinessOperation binding is not committed.
        "422":
          description: Verification identity is invalid.
        "503":
          description: Persisted business state is unavailable or inconsistent.
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
  schemas:
    ApproverResolutionRequest:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_eos/approver_resolution_request.v1.schema.json
    ApproverResolution:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_eos/approver_resolution.v1.schema.json
    CreateVoucherDraftCommand:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_eos/create_voucher_draft_command.v1.schema.json
    CreateVoucherDraftResult:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_eos/create_voucher_draft_result.v1.schema.json
    NvtProjectCreateCommand:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_eos/nvt_project_create_command.v1.schema.json
    NvtProjectUpdateCommand:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_eos/nvt_project_update_command.v1.schema.json
