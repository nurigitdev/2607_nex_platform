        rate_policy_id: {type: string, format: uuid}
        rate_policy_version: {type: integer, minimum: 1}
        source_provider_id: {type: string, minLength: 1, maxLength: 128}
        base_currency: {type: string, pattern: "^[A-Z]{3}$"}
        quote_currency: {type: string, pattern: "^[A-Z]{3}$"}
        quote_unit: {type: [number, string]}
        published_rate: {type: [number, string]}
