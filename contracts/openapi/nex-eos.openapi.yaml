openapi: 3.1.0
info:
  title: NeX Enterprise Operations System API
  version: 2.1.0-p8-s105-mybee-w30-s00a
  description: >-
    NeX-EOS service shell and canonical Voucher Draft command contract. The
    P8-S18 path is contract-first and becomes executable in P8-S19.
servers:
  - url: http://127.0.0.1:8107
tags:
  - name: Platform
  - name: Finance
  - name: Organization
  - name: Project
paths:
  /:
    get:
      operationId: getEosServiceRoot
      tags: [Platform]
      responses:
        "200":
          description: NeX-EOS service identity and platform links.
  /health:
    get:
      operationId: getEosHealth
      tags: [Platform]
      responses:
        "200":
          description: Process-level service health.
  /ready:
    get:
      operationId: getEosReadiness
      tags: [Platform]
      responses:
        "200":
          description: Configuration and database dependencies are ready.
        "503":
          description: One or more required dependencies are unavailable.
  /version:
    get:
      operationId: getEosVersion
      tags: [Platform]
      responses:
        "200":
          description: Service version, build, and contract identity.
  /internal/v1/auth/service-claim:
    get:
      operationId: validateEosServiceClaim
      tags: [Platform]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      responses:
        "200":
          description: Service claim is valid for NeX-EOS.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Audience or required scope is not allowed.
  /internal/v1/auth/service-claim/active:
    post:
      operationId: validateEosActiveServiceClaim
      tags: [Platform]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-route-class: CREDENTIAL
      responses:
        "200":
          description: Service claim is active under the configured trust profile.
        "401":
          description: Service claim is missing, invalid, expired, or inactive.
        "403":
          description: Audience or required scope is not allowed.
        "503":
          description: Signed-token verification or introspection is unavailable.
  /internal/v1/auth/service-token-runtime:
    get:
      operationId: getEosServiceTokenRuntime
      tags: [Platform]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      responses:
        "200":
          description: Redacted service-token admission runtime state.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Audience or required scope is not allowed.
  /internal/v1/nvt-projects:
    get:
      operationId: PROJECT.NVT_PROJECT.LIST
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:nvt_project:read
      x-nex-side-effect-free: true
      parameters:
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: X-NeX-Subject-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: status
          in: query
          required: false
          schema: {type: string, enum: [ACTIVE, INACTIVE]}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: Tenant-scoped bounded NVTProject list in deterministic order.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Fresh OA NVTProject read authority is denied.
        "422":
          description: Tenant, subject, status, or pagination input is invalid.
        "503":
          description: OA authorization or EOS persistence is unavailable.
    post:
      operationId: PROJECT.NVT_PROJECT.CREATE
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:nvt_project:create
      x-nex-route-class: WRITE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NvtProjectCreateCommand"
      responses:
        "200":
          description: Exact idempotent replay of an existing NVTProject creation.
        "201":
          description: NVTProject and BusinessOperation committed atomically.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Service trust or fresh OA create authority is denied.
        "409":
          description: NVT identity, code, or idempotency semantics conflict.
        "422":
          description: Command, payload hash, or domain invariant is invalid.
        "503":
          description: OA authorization or EOS persistence is unavailable.
  /internal/v1/nvt-projects/{nvt_project_id}:
    get:
      operationId: PROJECT.NVT_PROJECT.GET
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:nvt_project:read
      x-nex-side-effect-free: true
      parameters:
        - name: nvt_project_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: X-NeX-Subject-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        "200":
          description: Current tenant-scoped NVTProject projection.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Fresh OA NVTProject read authority is denied.
        "404":
          description: NVTProject is absent from the admitted tenant scope.
        "422":
          description: Tenant, subject, or NVTProject identity is invalid.
        "503":
          description: OA authorization or EOS persistence is unavailable.
    patch:
      operationId: PROJECT.NVT_PROJECT.UPDATE
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:nvt_project:admin
      x-nex-route-class: WRITE
      parameters:
        - name: nvt_project_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NvtProjectUpdateCommand"
      responses:
        "200":
          description: NVTProject update committed or replayed idempotently.
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Service trust or fresh OA admin authority is denied.
        "404":
          description: NVTProject is absent from the admitted tenant scope.
        "409":
          description: Version changed or an active Mother Project blocks inactivation.
        "422":
          description: Patch, payload hash, or domain invariant is invalid.
        "503":
          description: OA authorization or EOS persistence is unavailable.
  /internal/v2/project-applications:
    post:
      operationId: PROJECT.APPLICATION.CREATE
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:application:create
      x-nex-route-class: WRITE
      parameters:
        - $ref: "#/components/parameters/TenantCodeHeader"
        - $ref: "#/components/parameters/SubjectHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectApplicationDraftCommand"
      responses:
        "201":
          description: DRAFT application and immutable request code were created atomically.
        "401": {description: Service claim is missing or invalid.}
        "403": {description: Fresh OA application authority is denied.}
        "404": {description: Hierarchy target is absent from tenant scope.}
        "409": {description: Application identity or annual code allocation conflicts.}
        "422": {description: Draft or Project hierarchy input is invalid.}
        "503": {description: OA authorization or EOS persistence is unavailable.}
  /internal/v2/project-applications/{project_request_code}:
    get:
      operationId: PROJECT.APPLICATION.GET
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:application:read
      x-nex-side-effect-free: true
      parameters:
        - $ref: "#/components/parameters/ProjectRequestCodePath"
        - $ref: "#/components/parameters/TenantCodeHeader"
        - $ref: "#/components/parameters/SubjectHeader"
      responses:
        "200": {description: Owner-scoped current application revision.}
        "401": {description: Service claim is missing or invalid.}
        "403": {description: Fresh OA read authority or owner scope is denied.}
        "404": {description: Request code is absent from tenant scope.}
        "422": {description: Tenant or request code syntax is invalid.}
        "503": {description: OA authorization or EOS persistence is unavailable.}
    patch:
      operationId: PROJECT.APPLICATION.REVISE
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:application:create
      x-nex-route-class: WRITE
      parameters:
        - $ref: "#/components/parameters/ProjectRequestCodePath"
        - $ref: "#/components/parameters/TenantCodeHeader"
        - $ref: "#/components/parameters/SubjectHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectApplicationRevisionCommand"
      responses:
        "200": {description: DRAFT revision was appended or exactly replayed.}
        "401": {description: Service claim is missing or invalid.}
        "403": {description: Fresh OA authority or owner scope is denied.}
        "404": {description: Request code or hierarchy target is absent.}
        "409": {description: Application is not DRAFT or version changed.}
        "422": {description: Revision input is invalid.}
        "503": {description: OA authorization or EOS persistence is unavailable.}
  /internal/v2/project-applications/{project_request_code}:submit:
    post:
      operationId: PROJECT.APPLICATION.SUBMIT
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:application:submit
      x-nex-route-class: WRITE
      parameters:
        - $ref: "#/components/parameters/ProjectRequestCodePath"
        - $ref: "#/components/parameters/TenantCodeHeader"
        - $ref: "#/components/parameters/SubjectHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpectedVersionCommand"
      responses:
        "200": {description: Application became SUBMITTED or replayed exactly.}
        "401": {description: Service claim is missing or invalid.}
        "403": {description: Fresh OA submit authority or owner scope is denied.}
        "404": {description: Request code is absent from tenant scope.}
        "409": {description: Application state or expected version conflicts.}
        "422": {description: Request code or expected version is invalid.}
        "503": {description: OA authorization or EOS persistence is unavailable.}
  /internal/v2/project-applications/{project_request_code}:request-approval:
    post:
      operationId: PROJECT.APPLICATION.REQUEST_APPROVAL
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:application:request-approval
      x-nex-route-class: WRITE
      parameters:
        - $ref: "#/components/parameters/ProjectRequestCodePath"
        - $ref: "#/components/parameters/TenantCodeHeader"
        - $ref: "#/components/parameters/SubjectHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectApplicationApprovalCommand"
      responses:
        "200": {description: BUSINESS_FORMAL committee approval was requested or exactly replayed.}
        "401": {description: Service claim is missing or invalid.}
        "403": {description: Fresh OA authority or applicant ownership is denied.}
        "404": {description: Application or approval policy is absent from tenant scope.}
        "409": {description: "Application, policy, version, or replay semantics conflict."}
        "422": {description: "Request code, policy identity, or expected version is invalid."}
        "503": {description: "OA, WC, or EOS persistence is unavailable."}
  /internal/v2/projects:resolve:
    get:
      operationId: PROJECT.PROJECT.RESOLVE
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:project:read
      x-nex-side-effect-free: true
      parameters:
        - $ref: "#/components/parameters/TenantCodeHeader"
        - $ref: "#/components/parameters/SubjectHeader"
        - name: project_code
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 64}
        - name: active_only
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        "200": {description: Exact tenant-scoped Project business-code projection without internal UUIDs.}
        "401": {description: Service claim is missing or invalid.}
        "403": {description: Fresh OA Project read authority is denied.}
        "404": {description: Project code is absent from tenant scope.}
        "422": {description: "Tenant, subject, or Project code is invalid."}
        "503": {description: OA authorization or EOS persistence is unavailable.}
  /internal/v2/finance/legal-entities/{company_id}:
    get:
      operationId: FINANCE.LEGAL_ENTITY.GET
      tags: [Finance]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: finance:company:read
      x-nex-side-effect-free: true
      parameters:
        - name: company_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: X-NeX-Subject-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: effective_on
          in: query
          required: false
          schema: {type: string, format: date}
      responses:
        "200":
          description: Active tenant-scoped LegalEntity projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntity"
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Fresh OA company-read authority is denied.
        "404":
          description: LegalEntity is absent from the admitted effective scope.
        "422":
          description: Tenant, subject, company, or effective date is invalid.
        "503":
          description: OA authorization or EOS persistence is unavailable.
  /internal/v2/projects/{project_id}/company-bindings:
    post:
      operationId: PROJECT.COMPANY_BINDING.CREATE
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:company-binding:manage
      x-nex-route-class: WRITE
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: X-NeX-Subject-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCompanyBindingCommand"
      responses:
        "201":
          description: Approved ProjectCompanyBinding committed or replayed exactly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCompanyBinding"
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Service trust or fresh OA binding authority is denied.
        "404":
          description: A real tenant-scoped Project or LegalEntity is absent.
        "409":
          description: Identity semantics conflict or effective periods overlap.
        "422":
          description: Binding command or effective period is invalid.
        "503":
          description: OA authorization or EOS persistence is unavailable.
  /internal/v2/projects/{project_id}/company-binding:
    get:
      operationId: PROJECT.COMPANY_BINDING.GET
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:company-binding:read
      x-nex-side-effect-free: true
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: X-NeX-Subject-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: effective_on
          in: query
          required: true
          schema: {type: string, format: date}
      responses:
        "200":
          description: Unique effective accounting-company binding for the Project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCompanyBinding"
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Fresh OA binding-read authority is denied.
        "404":
          description: No binding is effective on the requested date.
        "409":
          description: Persisted data contains multiple effective bindings.
        "422":
          description: Tenant, subject, Project, or effective date is invalid.
        "503":
          description: OA authorization or EOS persistence is unavailable.
  /internal/v2/projects/{project_id}/work-code-sets:approve:
    post:
      operationId: PROJECT.WORK_CODE_SET.APPROVE
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:work-code:approve
      x-nex-route-class: WRITE
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectWorkCodeSetApprovalCommand"
      responses:
        "200": {description: Exact BusinessOperation replay returned the approved immutable revision.}
        "201": {description: A new immutable Project WorkCodeSet revision was approved.}
        "401": {description: Service claim is missing or invalid.}
        "403": {description: Fresh OA authority or Project owner/manager membership is denied.}
        "404": {description: Project is absent from the admitted tenant scope.}
        "409": {description: "Catalog, mandatory-code, identity, or revision semantics conflict."}
        "422": {description: Command shape or canonical payload hash is invalid.}
        "503": {description: OA authorization or EOS persistence is unavailable.}
  /internal/v2/projects/{project_id}/work-code-set:
    get:
      operationId: PROJECT.WORK_CODE_SET.GET
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:work-code:read
      x-nex-side-effect-free: true
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: X-NeX-Subject-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: effective_on
          in: query
          required: false
          schema: {type: string, format: date}
      responses:
        "200":
          description: Latest effective immutable Project WorkCodeSet revision.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectWorkCodeSet"}
        "401": {description: Service claim is missing or invalid.}
        "403": {description: Fresh OA authority or active Project membership is denied.}
        "404": {description: No approved WorkCodeSet is effective.}
        "422": {description: "Tenant, subject, Project, or date is invalid."}
        "503": {description: OA authorization or EOS persistence is unavailable.}
  /internal/v2/projects/{project_id}/business-readiness:
    get:
      operationId: PROJECT.BUSINESS_READINESS.GET
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:work-code:read
      x-nex-side-effect-free: true
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: X-NeX-Subject-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: effective_on
          in: query
          required: false
          schema: {type: string, format: date}
      responses:
        "200":
          description: BusinessReady projection independent of technical Project ACTIVE status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectBusinessReadiness"}
        "401": {description: Service claim is missing or invalid.}
        "403": {description: Fresh OA authority or active Project membership is denied.}
        "404": {description: Project is absent from the admitted tenant scope.}
        "422": {description: "Tenant, subject, Project, or date is invalid."}
        "503": {description: OA authorization or EOS persistence is unavailable.}
  /internal/v2/projects/{project_id}/work-assignments:assign:
    post:
      operationId: PROJECT.WORK_ASSIGNMENT.ASSIGN
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:work-assignment:manage
      x-nex-route-class: WRITE
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectWorkAssignmentCommand"}
      responses:
        "200": {description: Exact BusinessOperation replay returned the immutable assignment.}
        "201": {description: A new immutable Project WorkAssignment was admitted.}
        "401": {description: Service claim is missing or invalid.}
        "403": {description: "Fresh OA scope, Project role, or performer authority is denied."}
        "404": {description: Project is absent from the tenant scope.}
        "409": {description: "Work-set, identity, or assignment period semantics conflict."}
        "422": {description: "Command, payload hash, grade/Man-Day, or privacy contract is invalid."}
        "503": {description: OA authorization or EOS persistence is unavailable.}
  /internal/v2/projects/{project_id}/work-assignments:
    get:
      operationId: PROJECT.WORK_ASSIGNMENT.LIST
      tags: [Project]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: project:work-assignment:read
      x-nex-side-effect-free: true
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: X-NeX-Subject-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: effective_on
          in: query
          required: false
          schema: {type: string, format: date}
        - name: work_code_id
          in: query
          required: false
          schema: {type: string, pattern: "^FL[0-9]{7}$"}
      responses:
        "200":
          description: Grade-based planning assignments with private payroll excluded.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectWorkAssignmentCollection"}
        "401": {description: Service claim is missing or invalid.}
        "403": {description: Fresh OA read authority or active Project membership is denied.}
        "422": {description: "Tenant, Project, subject, date, or work code is invalid."}
        "503": {description: OA authorization or EOS persistence is unavailable.}
  /internal/v2/finance/account-catalog:
    get:
      operationId: FINANCE.ACCOUNT.CATALOG_GET
      tags: [Finance]
      security:
        - serviceBearer: []
      x-nex-required-scopes: [service:call]
      x-nex-business-scope: finance:account:read
      x-nex-side-effect-free: true
      parameters:
        - name: company_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: effective_on
          in: query
          required: true
          schema: {type: string, format: date}
        - name: X-NeX-Tenant-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: X-NeX-Subject-Id
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        "200":
          description: Effective approved account catalog and PostingRule projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountCatalogProjection"
        "401":
          description: Service claim is missing or invalid.
        "403":
          description: Fresh OA account-read authority is denied.
        "404":
          description: No approved catalog is effective for the company.
        "409":
          description: Effective release or PostingRule state is ambiguous or incomplete.
        "422":
          description: Tenant, subject, company, or date is invalid.
        "503":
