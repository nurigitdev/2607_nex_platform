components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
  schemas:
    ApproverResolutionRequest:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_eos/approver_resolution_request.v1.schema.json
    ApproverResolution:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_eos/approver_resolution.v1.schema.json
    CreateVoucherDraftCommand:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_eos/create_voucher_draft_command.v1.schema.json
    CreateVoucherDraftResult:
      type: object
      x-nex-canonical-json-schema: schemas/service/nex_eos/create_voucher_draft_result.v1.schema.json
    LegalEntity:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - company_id
        - company_code
        - name
        - functional_currency
        - presentation_currency
        - business_timezone
        - status
        - effective_from
        - version
        - created_at
        - updated_at
      properties:
        tenant_id: {type: string, minLength: 1, maxLength: 128}
        company_id: {type: string, format: uuid}
        company_code: {type: string, minLength: 1, maxLength: 64}
        name: {type: string, minLength: 1, maxLength: 256}
        functional_currency: {type: string, pattern: "^[A-Z]{3}$"}
        presentation_currency: {type: string, pattern: "^[A-Z]{3}$"}
        business_timezone: {type: string, minLength: 1, maxLength: 64}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
        effective_from: {type: string, format: date}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProjectCompanyBindingCommand:
      type: object
      additionalProperties: false
      required: [binding_id, company_id, valid_from, approved_proof_hash]
      properties:
        binding_id: {type: string, format: uuid}
        company_id: {type: string, format: uuid}
        valid_from: {type: string, format: date}
        valid_until:
          type: [string, "null"]
          format: date
        approved_proof_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
    ProjectCompanyBinding:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - binding_id
        - project_id
        - company_id
        - valid_from
        - approved_proof_hash
        - state
        - version
        - created_at
        - updated_at
      properties:
        tenant_id: {type: string, minLength: 1, maxLength: 128}
        binding_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        company_id: {type: string, format: uuid}
        valid_from: {type: string, format: date}
        valid_until:
          type: [string, "null"]
          format: date
        approved_proof_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        state: {type: string, enum: [APPROVED, REVOKED]}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProjectWorkCodeSetApprovalCommand:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - business_operation_id
        - idempotency_key
        - payload_hash
        - requester_subject_id
        - work_set
      properties:
        tenant_id: {type: string, minLength: 1, maxLength: 128}
        business_operation_id: {type: string, format: uuid}
        idempotency_key: {type: string, minLength: 1, maxLength: 256}
        payload_hash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        requested_operation:
          type: string
          const: PROJECT.WORK_CODE_SET.APPROVE
        requester_subject_id: {type: string, minLength: 1, maxLength: 128}
        work_set:
          $ref: "#/components/schemas/ProjectWorkCodeSetApproval"
    ProjectWorkCodeSetApproval:
      type: object
      additionalProperties: false
      required:
        - work_set_id
        - revision
        - catalog_id
        - catalog_version
        - catalog_digest
        - template_ref
        - template_version
        - code_ids
        - approved_proof_hash
        - pm_subject_id
        - pa_agent_id
        - pa_identity_evidence_hash
        - effective_from
      properties:
        work_set_id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        catalog_id: {type: string, const: mybee.fl.d12.project-governance}
        catalog_version: {type: string, const: 1.0.0}
        catalog_digest: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        template_ref: {type: string, minLength: 1, maxLength: 256}
        template_version: {type: string, pattern: "^[1-9][0-9]*\\.[0-9]+\\.[0-9]+$"}
        code_ids:
          type: array
          minItems: 5
          maxItems: 100
          uniqueItems: true
          items: {type: string, pattern: "^FL[0-9]{7}$"}
        approved_proof_hash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        pm_subject_id: {type: string, minLength: 1, maxLength: 128}
