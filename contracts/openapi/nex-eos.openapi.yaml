        adoption_id: {type: string, format: uuid}
        company_id: {type: string, format: uuid}
        global_release_id: {type: string, format: uuid}
        extension_release_id: {type: [string, "null"], format: uuid}
        effective_from: {type: string, format: date}
        effective_until: {type: [string, "null"], format: date}
