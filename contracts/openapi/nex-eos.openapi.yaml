      required: [binding_id, entry_id, account_id, approved_proof_ref]
      properties:
        binding_id: {type: string, format: uuid}
        entry_id: {type: string, format: uuid}
        account_id: {type: string, format: uuid}
        approved_proof_ref: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
    NvtProjectCreateCommand:
      type: object
